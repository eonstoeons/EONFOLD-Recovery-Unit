    activity++;                 /* toggling the pad IS a response to a touch */
    padVisible = !!on;
    if (padVisible) touchEnabled = true;
    const b = RR.U.el("padToggle");
    b.classList.toggle("on", padVisible);
    b.textContent = padVisible ? "▼ Controls" : "▲ Controls";
    if (!padVisible) clearTouch();
    RR.settings.touchOn = padVisible;
    RR.saveSettings();
    refreshPadVisibility();
  }
  function refreshPadVisibility() {
    const playing = RR.mode === "play" && !RR.paused;
    if (playing && padVisible) layout();
    /* the toggle button is always available while playing, so you can never
       get stuck with no way to bring the controls back */
    RR.U.el("padToggle").classList.toggle("show", playing);
    RR.U.el("touch").classList.toggle("show", playing && padVisible);
    if (!playing) clearTouch();
  }
  function init() {
    if (initDone) return; initDone = true;
    if (RR.settings.touchOn === null || RR.settings.touchOn === undefined) {
      /* first run on this device: phones and tablets get the pad, desktops do
         not — including desktops with a touchscreen */
      padVisible = RR.settings.autoTouch ? RR.U.isHandheld() : false;
    } else padVisible = !!RR.settings.touchOn;
    touchEnabled = padVisible || RR.U.isTouch();

    window.addEventListener("keydown", (e) => onKey(e, true), { passive: false });
    window.addEventListener("keyup", (e) => onKey(e, false), { passive: false });
    window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; clearTouch(); });

    const view = RR.U.el("app");
    view.addEventListener("mousedown", (e) => {
      if (RR.mode !== "play" || RR.paused) return;
      RR.Audio.resume();
      /* LEFT CLICK = FIRE, on every click including the one that grabs pointer
         lock. It used to `return` after requesting lock, so the first shot of
         every match — and the first shot after every Esc — was swallowed. */
      if (e.button === 0) { keys.fire = true; st.firePress = true; }
      if (e.button === 2) { keys.ads = true; }        /* RIGHT CLICK = AIM */
      if (wantLock() && !document.pointerLockElement) requestLock();
      e.preventDefault();
    });
    window.addEventListener("mouseup", (e) => { if (e.button === 0) keys.fire = false; if (e.button === 2) keys.ads = false; });

    /* MOUSE TURNS YOU LEFT AND RIGHT — locked or not.
       With pointer lock the browser hands us clean relative movement. Without
       it (lock refused, or the player pressed Esc) the mouse used to do
       nothing at all, which left the game looking broken on a desktop. Now the
       same movement drives the same turn either way, so the mouse is a real
       control rather than something that only works once the pointer is
       captured. Settings -> Controls -> "Mouse turns view" switches the
       unlocked half off for anyone who does not want it. */
    let lastMouseX = null;
    window.addEventListener("mousemove", (e) => {
      if (RR.mode !== "play" || RR.paused) { lastMouseX = null; return; }
      let dx = 0;
      if (document.pointerLockElement) {
        dx = e.movementX || 0;
        lastMouseX = null;
      } else {
        if (!RR.settings.mouseTurn) { lastMouseX = e.clientX; return; }
        if (typeof e.movementX === "number" && e.movementX) dx = e.movementX;
        else if (lastMouseX != null) dx = e.clientX - lastMouseX;
        lastMouseX = e.clientX;
      }

    });
    document.addEventListener("pointerlockchange", () => { lastMouseX = null; });
    window.addEventListener("wheel", (e) => {
      if (RR.mode !== "play" || RR.paused) return;
      st.wheel += e.deltaY > 0 ? 1 : -1;
      e.preventDefault();
    }, { passive: false });
    document.addEventListener("pointerlockchange", () => { locked = !!document.pointerLockElement; });
    window.addEventListener("contextmenu", (e) => { if (RR.mode === "play") e.preventDefault(); });

    /* NATIVE TOUCH is the pad's input path. Pointer events are deliberately
       not used: the browser-synthesised pointer event for a touch can arrive
       with clientX/clientY of 0,0, which is exactly what used to anchor the
       stick in the screen corner and kill the controls in both orientations.
       A TouchEvent always carries real coordinates. */
    const touch = RR.U.el("touch");
    touch.addEventListener("touchstart", onTouchStart, { passive: false });
    touch.addEventListener("touchmove", onTouchMove, { passive: false });
    touch.addEventListener("touchend", onTouchEnd, { passive: false });
    touch.addEventListener("touchcancel", onTouchEnd, { passive: false });
    /* desktop path, so the same pad works with a mouse */
    touch.addEventListener("mousedown", onMouseDown, { passive: false });
    window.addEventListener("mousemove", onMouseMove, { passive: false });
    window.addEventListener("mouseup", onMouseUp, { passive: false });

    RR.U.el("padToggle").addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      RR.Audio.resume();
      setPad(!padVisible);
      RR.U.toast(padVisible ? "Touch controls ON" : "Touch controls OFF");
    });

    /* block browser gestures that would break a fullscreen game */
    document.addEventListener("gesturestart", (e) => e.preventDefault());
    document.addEventListener("dblclick", (e) => { if (RR.mode === "play") e.preventDefault(); }, { passive: false });
    document.addEventListener("touchmove", (e) => {
      if (RR.mode === "play" && e.cancelable) e.preventDefault();
    }, { passive: false });

    RR.bus.on("blur", () => { for (const k in keys) keys[k] = false; clearTouch(); });

    /* Re-lay the pad whenever the viewport changes shape. This is now purely
       cosmetic upkeep — the pad no longer DEPENDS on an orientation event to
       start working, which is what used to force the flip-to-portrait-and-back
       ritual after dying. */
    const relayout = () => { if (padVisible) { layout(); resetStickVisual("L"); resetStickVisual("R"); } };
    window.addEventListener("resize", relayout);
    window.addEventListener("orientationchange", () => { relayout(); setTimeout(relayout, 250); });
    if (window.screen && screen.orientation && screen.orientation.addEventListener)
      screen.orientation.addEventListener("change", () => { relayout(); setTimeout(relayout, 250); });
    if (window.visualViewport) window.visualViewport.addEventListener("resize", relayout);
    /* A cancelled gesture must ALWAYS release everything — a grab still
       registered after a cancel is precisely the case that used to leave the
       player walking into a wall. */
    window.addEventListener("touchcancel", () => clearTouch(), { passive: true });
    window.addEventListener("touchend", (e) => {
      if (e.touches && e.touches.length) return;
      setTimeout(() => { if (!Object.keys(grabs).length) clearTouch(); }, 0);
    }, { passive: true });
    document.addEventListener("visibilitychange", () => { if (document.hidden) clearTouch(); });
    layout();
  }

  return {
    init, sample, consume, setPad, refreshPadVisibility, clearTouch,
    requestLock, exitLock,
    script(o) { scripted = o; },
    layoutPad: layout,
    /* TESTS: compute (and apply) the layout for an arbitrary viewport size */
    layoutFor(w, h) { const L = layout(w, h); layout(); return L; },
    /* TESTS: simulate a touchend that never arrives, to prove a lost finger
       cannot disable half the screen for the rest of the match. */
    _dropPointersForTest() { for (const k in grabs) delete grabs[k]; },
    /* TESTS: drive the pad without a real finger, through the same three verbs
       every real input path uses. */
    _touchDown(id, x, y) { if (padLive()) grabDown(id, x, y); },
    _touchMove(id, x, y) { if (padLive()) grabMove(id, x, y); },
    _touchUp(id) { grabUp(id); },
    get activity() { return activity; },
    get padVisible() { return padVisible; },
    get touchEnabled() { return touchEnabled; },
    get padTop() { return padTop; },
    setTouchEnabled(v) { touchEnabled = !!v; if (!touchEnabled) { padVisible = false; } refreshPadVisibility(); },
    keyDown(a) { return !!keys[a]; },
    state: st,
  };
})();

/* ============================================================================
 * MODULE: COMBAT
 * Actors, weapons, pooled projectiles and particles, damage, health regen and
 * the quick-melee knife. No allocation happens inside the per-frame loops:
 * bullets and particles are fixed-size pools that are reused forever.
 * ========================================================================== */
RR.Combat = (function () {
  const A = RR.Assets;
  const BULLETS = 320, PARTS = 420;

  const COL = {
    playerTracer: A.pack(255, 236, 170, 255),
    enemyTracer: A.pack(255, 176, 96, 255),
    blood: A.pack(168, 30, 40, 255),
    spark: A.pack(255, 214, 150, 255),
    rocket: A.pack(255, 150, 60, 255),
    fire: A.pack(255, 120, 40, 255),
    smoke: A.pack(120, 120, 128, 255),
    green: A.pack(120, 200, 90, 255),
  };

  /* ------------------------------------------------------------------ pools */
  function makePools(S) {
    S.bullets = new Array(BULLETS);
    for (let i = 0; i < BULLETS; i++) S.bullets[i] = { live: false, isBullet: true, x: 0, y: 0, z: 0.5, dx: 0, dy: 0, spd: 0, dmg: 0, owner: null, team: 0, life: 0, color: COL.playerTracer, size: 0.07, splash: 0, splashDmg: 0, _d: 0 };
    S.parts = new Array(PARTS);
    for (let i = 0; i < PARTS; i++) S.parts[i] = { live: false, isPart: true, x: 0, y: 0, z: 0.5, dx: 0, dy: 0, dz: 0, life: 0, ttl: 1, color: COL.blood, size: 0.05, grav: 1, _d: 0 };
    S._bi = 0; S._pi = 0;
  }
  function spawnBullet(S, x, y, ang, spd, dmg, owner, color, range) {
    const pool = S.bullets;
    for (let n = 0; n < BULLETS; n++) {
      const i = (S._bi + n) % BULLETS;
      const b = pool[i];
      if (b.live) continue;
      S._bi = (i + 1) % BULLETS;
      b.live = true; b.x = x; b.y = y; b.z = 0.52;
      b.dx = Math.cos(ang); b.dy = Math.sin(ang);
      b.spd = spd; b.dmg = dmg; b.owner = owner; b.team = owner ? owner.team : 9;
      b.life = (range || 22) / spd; b.color = color; b.size = 0.075;
      b.splash = 0; b.splashDmg = 0;
      return b;
    }
    return null;
  }
  function spawnPart(S, x, y, z, dx, dy, dz, ttl, color, size, grav) {
    const pool = S.parts;
    for (let n = 0; n < PARTS; n++) {
      const i = (S._pi + n) % PARTS;
      const p = pool[i];
      if (p.live) continue;
      S._pi = (i + 1) % PARTS;
      p.live = true; p.x = x; p.y = y; p.z = z;
      p.dx = dx; p.dy = dy; p.dz = dz;
      p.life = ttl; p.ttl = ttl; p.color = color; p.size = size; p.grav = grav == null ? 1 : grav;
      return p;
    }
    return null;
  }
  function burst(S, x, y, z, n, color, spread, size, ttl) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * M.TAU, s = Math.random() * spread;
      spawnPart(S, x, y, z, Math.cos(a) * s, Math.sin(a) * s, Math.random() * 1.6, ttl * (0.6 + Math.random() * 0.6), color, size, 1);
    }
  }

  /* ----------------------------------------------------------------- actors */
  function weaponState(id) {
    const def = RR.Content.weapon(id);
    if (!def) return null;
    return { id, def, mag: def.mag, reserve: def.reserveStart == null ? def.mag * 3 : def.reserveStart, have: true };
  }
  /* A map may define its own player loadout and its own bottomless-clip rule.
     Scoping these to the MAP rather than to global rules is what lets a demo
     mod hand you every weapon without changing the rest of the game the moment
     it is enabled. Map wins; otherwise fall back to the pack's rules. */
  function loadoutFor(act, S) {
    const rules = RR.Content.rules();
    const md = S && S.map && S.map.def;
    if (act && act.isPlayer && md && Array.isArray(md.startWeapons) && md.startWeapons.length)
      return md.startWeapons;
    return (rules.startWeapons && rules.startWeapons.length) ? rules.startWeapons : ["pistol"];
  }
  function infiniteAmmoFor(act, S) {
    if (!act || !act.isPlayer) return false;      /* never the AI */
    const md = S && S.map && S.map.def;
    if (md && md.infiniteAmmo !== undefined) return !!md.infiniteAmmo;
    return !!RR.Content.rules().infiniteAmmo;
  }

  function makePlayer(S, x, y, team, name) {
    const rules = RR.Content.rules();
    const maxHp = rules.playerHp || 100;
    const p = {
      isPlayer: true, isBot: false, name: name || "YOU", team: team == null ? 0 : team,
      x: x, y: y, a: 0, radius: 0.22, hp: maxHp, maxHp, dead: false, deadT: 0, respawnT: 0,
      speed: 3.05, bob: 0, bobT: 0, swayX: 0, swayY: 0, recoilY: 0, fireFlash: 0,
      weapons: {}, order: [], cur: 0, weapon: null, ws: null,
      fireCd: 0, reloadT: 0, reloadDur: 0, knifeT: 0, knifeCd: 0,
      lastHurt: -99, score: 0, kills: 0, deaths: 0, hitT: 0, alive: true,
      armor: rules.playerArmor || 0, armorMax: rules.armorMax == null ? 100 : rules.armorMax,
    };
    const start = loadoutFor(p, S);
    for (const id of start) giveWeapon(p, id, true);
    if (!p.order.length) giveWeapon(p, "pistol", true);
    selectSlot(p, 0);
    return p;
  }
  function giveWeapon(p, id, silent) {
    const def = RR.Content.weapon(id);
    if (!def || def.melee) return false;
    if (p.weapons[id]) {
      const w = p.weapons[id];
      const before = w.reserve;
      w.reserve = Math.min(def.reserveMax || def.mag * 6, w.reserve + (def.mag * 2));
      return w.reserve > before;
    }
    const ws = weaponState(id);
    if (!ws) return false;
    p.weapons[id] = ws;

    if (!silent) {

      RR.Audio.play("pickup");

    if (!p.weapon) selectSlot(p, 0);
    return true;
  }
  function selectSlot(p, i) {
    if (!p.order.length) return;
    i = M.clamp(i, 0, p.order.length - 1);
    if (p.cur === i && p.weapon) return;
    p.cur = i;
    p.ws = p.weapons[p.order[i]];
    p.weapon = p.ws.def;
    p.reloadT = 0;
    p.fireCd = Math.max(p.fireCd, 0.16);
    RR.Audio.play("weapon_swap");

  function selectBySlotNum(p, n) {
    for (let i = 0; i < p.order.length; i++) {

      if (d && (d.slot || 0) === n + 1) { selectSlot(p, i); return true; }
    }
    return false;
  }
  function cycle(p, dir) {

    selectSlot(p, (p.cur + dir + p.order.length) % p.order.length);

  let uidSeq = 0;
  const missingWarned = Object.create(null);
  /* `family` is "undead" or "human". When a mod names an enemy that does not

     broken mod playable and keeps a zombie mode full of zombies. */
  function pickFallback(family) {
    const all = (RR.Mods.resolved && RR.Mods.resolved.enemies) || {};
    for (const k in all) {
      const e = all[k];
      if (!e || e._full !== k) continue;
      const isUndead = e.sprite === "undead" || !!e.melee;
      if (family === "undead" ? isUndead : !isUndead) return e;
    }
    return RR.Content.enemy(family === "undead" ? "shambler" : "guard") || RR.Content.enemy("guard");
  }
  function makeEnemy(S, defId, x, y, team, family) {
    let def = RR.Content.enemy(defId);
    if (!def) {
      def = pickFallback(family || "human");
      if (def) {
        const key = "enemy:" + defId;
        if (!missingWarned[key]) {
          missingWarned[key] = 1;
          RR.U.toast('Unknown enemy "' + defId + '" — using ' + (def.name || def.id));
        }
      }
    }
    if (!def) return null;
    const d = RR.diff();
    const sheet = A.sprite(def._full || defId, def, RR.settings.sprite8 !== false);
    const scale = RR.Content.horde().hpScale || 1;
    const e = {
      /* stable id + spawn point so a checkpoint rewind can tell which enemies
         were already dead and put the rest back where they started */
      _uid: ++uidSeq, _sx: x, _sy: y,
      isEnemy: true, defId: def._full || defId, def, sheet, name: def.name,
      team: team == null ? 1 : team, x, y, a: Math.random() * M.TAU, radius: 0.26,
      hp: def.hp * (S.hpScale || 1), maxHp: def.hp * (S.hpScale || 1),
      speed: (def.speed || 1.8) * (S.speedScale || 1),
      spriteScale: def.height || 1,
      dead: false, deadT: 0, hitT: 0, frame: 0, animT: 0, fireFlash: 0,
      state: "idle", stateT: 0, target: null, fireCd: 1 + Math.random(), reactT: 0,
      seen: false, lastSeenX: 0, lastSeenY: 0, strafe: Math.random() < 0.5 ? 1 : -1,
      aw: def.weapon ? RR.Content.aiWeapon(def.weapon) : null,
      melee: def.melee || 0, meleeRate: def.meleeRate || 1, meleeCd: 0,
      score: def.score || 100, dmgScale: (S.dmgScale || 1) * d.dmg,

/* ============================================================================
 * MODULE: AI
 * One small state machine shared by campaign enemies, horde zombies and
 * deathmatch bots. Navigation is a cached BFS flow field (budgeted to a few
 * rebuilds per frame); everything else is distance checks and a throttled
 * line-of-sight test, so cost stays flat as actor counts grow.
 * ========================================================================== */
RR.AI = (function () {
  const W = RR.World, C = RR.Combat;

  function nearestFoe(S, a) {
    let best = null, bd = 1e9;
    for (let i = 0; i < S.actors.length; i++) {
      const t = S.actors[i];
      if (t === a || t.dead || t.removed) continue;
      if (!C.canHurt(S, a, t)) continue;
      const d = M.dist2(a.x, a.y, t.x, t.y);
      if (d < bd) { bd = d; best = t; }
    }
    return best;
  }

  function faceToward(a, tx, ty, dt, rate) {
    const want = Math.atan2(ty - a.y, tx - a.x);
    const diff = M.angDiff(a.a, want);
    a.a = M.norm(a.a + M.clamp(diff, -rate * dt, rate * dt));
    return Math.abs(diff);
  }

  function walk(S, a, dirX, dirY, dt, speedMul) {
    const sp = a.speed * (speedMul == null ? 1 : speedMul) * dt;
    const moved = W.move(S.map, a, dirX * sp, dirY * sp);
    if (!moved) {
      /* nudge sideways so actors never wedge on a corner */
      a._stuck = (a._stuck || 0) + dt;
      if (a._stuck > 0.25) {
        const px = -dirY * a.strafe, py = dirX * a.strafe;
        if (!W.move(S.map, a, px * sp, py * sp)) a.strafe = -a.strafe;
        a._stuck = 0;
      }
    } else a._stuck = 0;
    a.animT += dt * (2.6 + a.speed * 0.6);
    if (!a.dead) a.frame = (a.animT % 1) < 0.5 ? 1 : 2;
    return moved;
  }

  /* Waypoint follower. Asking the flow field for a direction every single
     frame makes actors flip-flop between two adjacent cells when they sit near
     a boundary — that is the "stuttering enemy" you see. Instead we lock onto
     the next cell centre and hold it until we actually arrive. */
  function pathStep(S, a, tx, ty, urgent) {
    const map = S.map;
    const gk = (ty | 0) * map.w + (tx | 0);
    if (a._wp && a._wpGoal === gk && !urgent) {
      const dx = a._wp[0] - a.x, dy = a._wp[1] - a.y;
      const m = Math.hypot(dx, dy);
      if (m > 0.34) return { x: dx / m, y: dy / m };
    }
    const f = W.fieldFor(map, a, tx, ty, urgent);
    const d = W.stepDir(map, f, a.x, a.y);
    if (!d) { a._wp = null; return null; }
    a._wp = [d.tx, d.ty]; a._wpGoal = gk;
    return d;
  }

  /* Smooth the heading so actors bank into turns instead of snapping. */
  function steer(a, dir, dt, rate) {
    if (!dir) return null;
    const k = M.clamp(dt * (rate || 9), 0, 1);
    a._sx = (a._sx === undefined ? dir.x : a._sx + (dir.x - a._sx) * k);
    a._sy = (a._sy === undefined ? dir.y : a._sy + (dir.y - a._sy) * k);
    const m = Math.hypot(a._sx, a._sy);
    if (m < 0.05) return dir;
    return { x: a._sx / m, y: a._sy / m };
  }

  /* Cheap cover pick: sample 8 offsets around us, keep the one that breaks
     line of sight and puts the most distance between us and the shooter. */
  function findCover(S, a, foe) {
    const R = 2.4;
    let best = null, bestD = -1;
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * M.TAU + Math.random() * 0.3;
      const cx = a.x + Math.cos(ang) * R, cy = a.y + Math.sin(ang) * R;
      if (!W.canStand(S.map, cx, cy, 0.3)) continue;
      if (W.los(S.map, cx, cy, foe.x, foe.y)) continue;
      const d = M.dist2(cx, cy, foe.x, foe.y);
      if (d > bestD) { bestD = d; best = [cx, cy]; }
    }
    return best;
  }

     motion — an actor scraping a wall or strafing in place technically "moves"
     every frame while going nowhere, which is exactly how bots used to end up
     parked for tens of seconds looking frozen and (behind cover) unkillable. */
  function unstick(S, a, dt) {
    a._chkT = (a._chkT || 0) + dt;
    if (a._lastPX === undefined) { a._lastPX = a.x; a._lastPY = a.y; }
    /* Long window on purpose. A short window is defeated by an actor that
       jitters back and forth: each half second it "moved", while over ten
       seconds it went nowhere. */
    if (a._chkT < 2.0) return false;
    const net = Math.hypot(a.x - a._lastPX, a.y - a._lastPY);
    a._chkT = 0; a._lastPX = a.x; a._lastPY = a.y;
    if (net > 0.7) { a._stallT = 0; a._kickStreak = 0; return false; }
    a._stallT = (a._stallT || 0) + 2.0;
    if (a._stallT < 2.0) return false;
    a._stallT = 0;
    a._kickStreak = (a._kickStreak || 0) + 1;
    a._stuckKicks = (a._stuckKicks || 0) + 1;
    /* drop everything that could be pinning us and repath from scratch */
    a._fieldKey = -1; a._goal = null; a._wp = null; a._goalT = 0;
    a.state = "roam"; a.stateT = 0; a.coverX = null;
    a.strafe = -a.strafe;
    if (a._kickStreak < 3) {
      const step = 0.34;
      for (let i = 0; i < 12; i++) {
        const ang = (i / 12) * M.TAU + Math.random() * 0.5;
        if (W.move(S.map, a, Math.cos(ang) * step, Math.sin(ang) * step)) { a.a = ang; return true; }
      }
    }
    /* nudging failed, or nudging keeps failing: relocate somewhere legal and
       far from where we were pinned */
    let best = null, bestD = -1;
    for (let i = 0; i < 8; i++) {
      const c = W.anyOpenCell(S.map, null, a.radius || 0.24);
      if (!c) continue;
      /* never teleport into geometry — check with THIS actor's radius */
      if (!W.canStand(S.map, c[0], c[1], (a.radius || 0.24) + 0.02)) continue;
      const dd = M.dist2(c[0], c[1], a.x, a.y);
      if (dd > bestD) { bestD = dd; best = c; }
    }
    if (best) { a.x = best[0]; a.y = best[1]; a._lastPX = best[0]; a._lastPY = best[1]; }
    a._kickStreak = 0;
    return true;
  }

  /* ---------------------------------------------------------------- update */
  function update(S, a, dt) {
    if (a.dead) { a.deadT += dt; a.frame = 4; return; }
    if (a.hitT > 0) a.hitT -= dt;
    const d = RR.diff();

    /* target acquisition (throttled) */
    a._tgtT = (a._tgtT || 0) - dt;
    if (a._tgtT <= 0 || !a.target || a.target.dead || a.target.removed) {
      a._tgtT = 0.5 + Math.random() * 0.4;
      a.target = nearestFoe(S, a);
    }
    const foe = a.target;
    if (!foe) {
      /* Nothing to fight — every opponent dead and waiting to respawn, say.
         Bots keep patrolling; a standing enemy in a campaign is fine. */
      if (a.isBot) { a.seen = false; botRoam(S, a, dt); } else idle(S, a, dt);
      unstick(S, a, dt);
      return;
    }

    /* line of sight (throttled + staggered per actor) */
    a._losT = (a._losT || 0) - dt;
    if (a._losT <= 0) {
      a._losT = 0.12 + Math.random() * 0.1;
      const dist = Math.hypot(foe.x - a.x, foe.y - a.y);
      const sight = (a.def && a.def.sight) || 20;
      a.seen = dist < sight * (0.7 + d.aggro * 0.4) && W.los(S.map, a.x, a.y, foe.x, foe.y);
      if (a.seen) { a.lastSeenX = foe.x; a.lastSeenY = foe.y; a.seenAt = S.time; }
    }
    const dist = Math.hypot(foe.x - a.x, foe.y - a.y);

    if (a.isBot) botLogic(S, a, foe, dist, dt, d);
    else if (a.melee) zombieLogic(S, a, foe, dist, dt, d);
    else humanLogic(S, a, foe, dist, dt, d);

    unstick(S, a, dt);
    if (a.animT > 1000) a.animT = 0;
  }

  function idle(S, a, dt) {
    a.frame = 0;
    a.animT += dt;
  }

  /* --- melee undead ------------------------------------------------------ */
  function zombieLogic(S, a, foe, dist, dt, d) {
    a.growlCd -= dt;
    if (a.growlCd <= 0 && dist < 12) { a.growlCd = 3 + Math.random() * 5; RR.Audio.play3d("zombie_growl", a.x, a.y, 0.9, 0.8 + Math.random() * 0.5); }
    if (a.meleeCd > 0) a.meleeCd -= dt;
    const reach = 0.95;
    if (dist < reach) {
      faceToward(a, foe.x, foe.y, dt, 7);
      a.frame = 3;
      if (a.meleeCd <= 0) {
        a.meleeCd = (a.meleeRate || 1) / Math.max(0.4, d.aggro);
        if (W.los(S.map, a.x, a.y, foe.x, foe.y)) C.damage(S, foe, a.melee * a.dmgScale, a);
      }
      return;
    }
    let dir = null;
    if (a.seen && dist < 6) dir = { x: (foe.x - a.x) / dist, y: (foe.y - a.y) / dist };
    if (!dir) dir = pathStep(S, a, foe.x, foe.y, (a._stallT || 0) > 0.5);
    if (!dir) dir = { x: (foe.x - a.x) / dist, y: (foe.y - a.y) / dist };
    dir = steer(a, dir, dt, 11);
    if (dir) { faceToward(a, a.x + dir.x, a.y + dir.y, dt, 6); walk(S, a, dir.x, dir.y, dt, 0.85 + d.aggro * 0.2); }
    else idle(S, a, dt);
  }

  /* --- human, single-shot firearms --------------------------------------- */
  function humanLogic(S, a, foe, dist, dt, d) {
    if (a.animT > 0 && a.frame === 3) { a.animT -= dt; if (a.animT <= 0) a.frame = 0; }
    if (a.fireCd > 0) a.fireCd -= dt;
    const aw = a.aw || {};
    const range = aw.range || 15;

    if (a.state === "cover" && a.stateT > 0) {
      a.stateT -= dt;
      if (a.coverX != null) {
        const dx = a.coverX - a.x, dy = a.coverY - a.y, m = Math.hypot(dx, dy);
        if (m > 0.35) { walk(S, a, dx / m, dy / m, dt, 1.05); faceToward(a, foe.x, foe.y, dt, 4); return; }
      }
      a.stateT = 0;
    }

    if (a.seen && dist < range * 1.15) {
      const off = faceToward(a, foe.x, foe.y, dt, 3.4 + d.aggro * 1.6);
      /* reaction delay before the first shot after acquiring */
      if (a.reactT <= 0 && a._wasSeen !== true) a.reactT = d.react * (0.6 + Math.random() * 0.8);
      a._wasSeen = true;
      if (a.reactT > 0) { a.reactT -= dt; a.frame = 0; return; }

      if (a.fireCd <= 0 && off < 0.30) {
        a.fireCd = (aw.rof || 1.1) / Math.max(0.5, d.fireRate);
        C.aiFire(S, a);
        /* after firing, sometimes reposition — reads as using the corridor */
        if (Math.random() < 0.28 * d.aggro) { a.state = "strafe"; a.stateT = 0.4 + Math.random() * 0.5; a.strafe = Math.random() < 0.5 ? 1 : -1; }
      }
      if (a.state === "strafe" && a.stateT > 0) {
        a.stateT -= dt;
        walk(S, a, -Math.sin(a.a) * a.strafe, Math.cos(a.a) * a.strafe, dt, 0.7);
        return;
      }
      /* close the gap if far, back off if too close */
      if (dist > range * 0.72) {
        const dir = pathStep(S, a, foe.x, foe.y) || { x: (foe.x - a.x) / dist, y: (foe.y - a.y) / dist };
        walk(S, a, dir.x, dir.y, dt, 0.55 + d.aggro * 0.25);
      } else if (dist < 2.0) {
        walk(S, a, -(foe.x - a.x) / dist, -(foe.y - a.y) / dist, dt, 0.55);
      } else a.frame = 0;
      /* wounded enemies duck behind geometry */
      if (a.hp < a.maxHp * 0.4 && Math.random() < dt * 0.7) {
        const c = findCover(S, a, foe);
        if (c) { a.state = "cover"; a.stateT = 1.4; a.coverX = c[0]; a.coverY = c[1]; }
      }
      return;
    }

    a._wasSeen = false; a.reactT = 0;
    /* hunt the last known position, then patrol toward the target */
    const tx = a.seenAt != null && S.time - a.seenAt < 6 ? a.lastSeenX : foe.x;
    const ty = a.seenAt != null && S.time - a.seenAt < 6 ? a.lastSeenY : foe.y;
    let dir = pathStep(S, a, tx, ty, (a._stallT || 0) > 0.5);
    if (!dir) {
      const gx = tx - a.x, gy = ty - a.y, m = Math.hypot(gx, gy);
      if (m > 0.05) dir = { x: gx / m, y: gy / m };
    }
    dir = steer(a, dir, dt, 9);
    if (dir) { faceToward(a, a.x + dir.x, a.y + dir.y, dt, 5); walk(S, a, dir.x, dir.y, dt, 0.5 + d.aggro * 0.3); }
    else idle(S, a, dt);
  }

  /* --- deathmatch bot ----------------------------------------------------- */
  function botLogic(S, a, foe, dist, dt, d) {
    C.updateWeapon(S, a, dt);
    const def = a.weapon || {};
    const range = def.range || 20;

    /* proactive reload out of contact */
    if (!a.seen && a.ws && a.reloadT <= 0 && a.ws.mag < def.mag * 0.4 && a.ws.reserve > 0) C.startReload(S, a);
    /* prefer the biggest gun we have when close */
    a._swapT = (a._swapT || 0) - dt;
    if (a._swapT <= 0) {
      a._swapT = 1.5;
      if (a.order.length > 1) {
        const want = dist < 5 ? a.order.length - 1 : 0;
        if (a.cur !== want && Math.random() < 0.5) C.selectSlot(a, want);
      }
    }
    /* Detour for a pickup only if it is worth something and we are not
       already standing on it. The old version re-targeted the SAME pickup
       every frame — including inert markers and boxes the bot was full on —
       which pinned bots in place indefinitely. */
    a._grabT = (a._grabT || 0) - dt;
    if (!a.seen && a._grabT <= 0) {
      a._grabT = 0.5;
      for (let i = 0; i < S.pickups.length; i++) {
        const q = S.pickups[i];
        const d2 = M.dist2(q.x, q.y, a.x, a.y);
        if (d2 > 9 || d2 < 0.30) continue;          /* too far, or underfoot */
        if (!C.wantsPickup(a, q)) continue;
        a._goal = [q.x, q.y]; a._goalT = 4; a._wp = null;
        break;
      }
    }

    if (a.state === "cover" && a.stateT > 0) {
      a.stateT -= dt;
      if (a.coverX != null) {
        const dx = a.coverX - a.x, dy = a.coverY - a.y, m = Math.hypot(dx, dy);
        if (m > 0.35) { walk(S, a, dx / m, dy / m, dt, 1.1); return; }
      }
      a.stateT = 0;
    }

    if (a.seen && dist < range * 1.1) {
      a._goal = null;
      const off = faceToward(a, foe.x, foe.y, dt, 4.0 + d.aggro * 2.0);
      if (a.reactT <= 0 && a._wasSeen !== true) a.reactT = d.react * (0.5 + Math.random() * 0.7);
      a._wasSeen = true;
      if (a.reactT > 0) { a.reactT -= dt; return; }
      const jitter = (1 - d.aim) * 0.22;
      if (off < 0.14 + jitter && a.reloadT <= 0 && a.ws && a.ws.mag > 0) C.fire(S, a);
      /* strafe around the target rather than standing in the open */
      a._strafeT = (a._strafeT || 0) - dt;
      if (a._strafeT <= 0) { a._strafeT = 0.5 + Math.random() * 0.9; a.strafe = Math.random() < 0.5 ? 1 : -1; }
      const px = -Math.sin(a.a) * a.strafe, py = Math.cos(a.a) * a.strafe;
      let fx = 0, fy = 0;
      if (dist > range * 0.6) { fx = Math.cos(a.a); fy = Math.sin(a.a); }
      else if (dist < 2.2) { fx = -Math.cos(a.a); fy = -Math.sin(a.a); }
      const mx = px * 0.8 + fx * 0.7, my = py * 0.8 + fy * 0.7;
      const m = Math.hypot(mx, my) || 1;
      walk(S, a, mx / m, my / m, dt, 0.85);
      if ((a.reloadT > 0 || a.hp < a.maxHp * 0.35) && Math.random() < dt * 1.2) {
        const c = findCover(S, a, foe);
        if (c) { a.state = "cover"; a.stateT = 1.2; a.coverX = c[0]; a.coverY = c[1]; }
      }
      return;
    }

    a._wasSeen = false; a.reactT = 0;
    botRoam(S, a, dt);
  }

  /* Roam is its own function so a bot with no foe at all can use it too. */
  function botRoam(S, a, dt) {
    /* head for the last contact, a pickup, or a random reachable cell */
    a._goalT = (a._goalT || 0) - dt;
    const reached = a._goal && M.dist2(a._goal[0], a._goal[1], a.x, a.y) < 1.0;
    if (!a._goal || reached || a._goalT <= 0) {
      /* Arriving at a last-known-position CONSUMES that memory. Without this
         the bot re-picks the spot it is already standing on, every frame,
         until the memory times out — which is a bot frozen in the open for
         several seconds, and was the "teammates freeze" bug. */
      if (reached) { a.seenAt = null; a._goal = null; }
      let g = null;
      if (a.seenAt != null && S.time - a.seenAt < 5) g = [a.lastSeenX, a.lastSeenY];
      /* any goal we are already on top of is not a goal */
      if (g && M.dist2(g[0], g[1], a.x, a.y) < 1.44) g = null;
      if (!g) {
        /* pick somewhere actually worth walking to, not the next tile over */
        let best = null, bestD = -1;
        for (let i = 0; i < 8; i++) {
          const c = W.anyOpenCell(S.map);
          if (!c) continue;
          const dd = M.dist2(c[0], c[1], a.x, a.y);
          if (dd > bestD) { bestD = dd; best = c; }
          if (bestD > 36) break;
        }
        g = best;
      }
      a._goal = g;
      a._goalT = 6 + Math.random() * 4;
      a._wp = null; a._fieldKey = -1;
    }
    if (!a._goal) { idle(S, a, dt); return; }
    let dir = pathStep(S, a, a._goal[0], a._goal[1], (a._stallT || 0) > 0.5);
    if (!dir) {
      /* no field yet, or we are sitting on its minimum: steer straight at the
         goal rather than standing still */
      const gx = a._goal[0] - a.x, gy = a._goal[1] - a.y, m = Math.hypot(gx, gy);
      if (m > 0.05) dir = { x: gx / m, y: gy / m };
    }
    dir = steer(a, dir, dt, 10);
    if (dir) { faceToward(a, a.x + dir.x, a.y + dir.y, dt, 5.5); walk(S, a, dir.x, dir.y, dt, 0.95); }
    else {
      /* No usable direction means the goal is where we already are. Take a
         new one immediately — a roaming bot standing still is the bug, not a
         state worth waiting in. */
      a._goal = null; a._goalT = 0; a._wp = null;
      idle(S, a, dt);
    }
  }

  return { update, nearestFoe, findCover, unstick, pathStep, steer };
})();

/* ============================================================================
 * MODULE: GAME
 * Mode setup + the per-frame simulation: player control, level flow, horde
 * rounds, deathmatch scoring, save/load and the safe mod action vocabulary.
 * ========================================================================== */
RR.Game = (function () {
  const W = RR.World, C = RR.Combat;
  let S = null;
  let hudT = 0, lastHud = "";

  /* ------------------------------------------------------------ HUD helpers */
  function feed(st, text) {
    st.killfeed.unshift({ t: st.time, text });
    if (st.killfeed.length > 5) st.killfeed.length = 5;
  }
  function banner(text, sub, secs) {
    const b = RR.U.el("banner");
    b.innerHTML = RR.U.esc(text) + (sub ? "<small>" + RR.U.esc(sub) + "</small>" : "");
    b.style.opacity = "1";
    S._bannerT = secs || 2.2;
  }
  function hideBanner() { RR.U.el("banner").style.opacity = "0"; }

  /* --------------------------------------------------------------- spawning */
  function spawnEnemiesForLevel(st, level) {
    const d = RR.diff();
    const mix = (level && level.mix && level.mix.length) ? level.mix : ["guard"];
    const pts = ((level && level.points) || st.map.spawns.enemy).slice();
    let count = Math.max(1, Math.round(pts.length * d.countMul));
    let k = 0;
    for (let i = 0; i < count; i++) {
      let p = pts[i];
      if (!p) p = W.anyOpenCell(st.map);
      if (!p) break;
      if (M.dist2(p[0], p[1], st.player.x, st.player.y) < 16 && i >= pts.length) { i--; count--; continue; }
      const e = C.makeEnemy(st, mix[k++ % mix.length], p[0], p[1], 1, level && level.family);
      if (e) st.actors.push(e);
    }
    st.totalEnemies = st.actors.filter((a) => a.isEnemy).length;
  }
  function aliveEnemies(st) {
    let n = 0;
    for (let i = 0; i < st.actors.length; i++) { const a = st.actors[i]; if (a.isEnemy && !a.dead && !a.removed) n++; }
    return n;
  }
  function livingFoes(st, team) {
    const out = [];
    for (const a of st.actors) if (!a.dead && !a.removed && a.team !== team) out.push(a);
    return out;
  }
  function pickSpawn(st, list, team) {
    const foes = livingFoes(st, team);
    const p = W.farFrom(st.map, list.length ? list : [[st.player.x, st.player.y]], foes, 5);
    return p || W.anyOpenCell(st.map);
  }
  function placePickups(st) {
    st.pickups.length = 0;
    const sp = RR.Assets.pickups();
    for (const it of st.map.items) {
      st.pickups.push({ kind: it.kind, x: it.x, y: it.y, z: 0.5, taken: false, respawn: 0,
        respawnMax: 0, sheet: sp[it.kind] || sp.ammo, frame: 0, spriteScale: 0.55, _d: 0 });
    }
    /* Checkpoints ride in the same list so both renderers and the minimap draw
       them for free. `inert` keeps the collection loop off them. */
    if (st.mode === "campaign" || st.mode === "edtest") {
      for (const cp of (st.map.checkpoints || [])) {
        st.pickups.push({ kind: "checkpoint", inert: true, n: cp.n, x: cp.x, y: cp.y, z: 0.5,
          taken: false, respawn: 0, respawnMax: 0, sheet: sp.checkpoint || sp.ammo,
          frame: 0, spriteScale: 0.9, _d: 0 });
      }
    }
  }

  /* ------------------------------------------------------------ level setup */
  function loadMap(st, mapId) {
    const def = RR.Content.map(mapId);
    if (!def) return false;
    st.map = W.build(def);
    if (!st.map) return false;
    st.objective = def.objective || "";
    st.mapId = mapId;
    /* The player object is built before any map exists, so a map that defines
       its own loadout has to re-issue it here — otherwise you would arrive on
       an all-weapons map holding nothing but the starting pistol. Only maps
       that actually declare startWeapons are touched, so campaign progression
       and every shipped map keep the loadout they already had. */
    if (st.player && Array.isArray(def.startWeapons) && def.startWeapons.length)
      C.resetLoadout(st.player, st);
    return true;
  }
  function resetActors(st) {
    st.actors.length = 0;
    if (st.player) st.actors.push(st.player);
  }
  function placePlayer(st, pt) {
    const p = st.player;
    const safe = (pt && st.map) ? W.nearestStandable(st.map, pt[0], pt[1], (p.radius || 0.22) + 0.02) : null;
    if (safe) pt = safe;
    p.x = pt[0]; p.y = pt[1];
    p.dead = false; p.alive = true; p.hp = p.maxHp; p.deadT = 0; p.frame = 0;
    p.lastHurt = -99; p.reloadT = 0; p.knifeT = 0; p.fireCd = 0;
    p.adsT = 0; p.adsEase = 0; p.fovNow = RR.settings.fov; p.fovPunch = 0;
    p.recoilY = 0; p.kickPitch = 0; p.pitch = 0; p.swayX = 0; p.swayY = 0; p.swayVX = 0; p._moveAmt = 0;
    /* face the most open direction so you never start staring at a wall */

    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * M.TAU;
      let d = 0;
      while (d < 8 && !W.solidAt(st.map, (p.x + Math.cos(a) * d) | 0, (p.y + Math.sin(a) * d) | 0)) d += 0.5;
      if (d > bestD) { bestD = d; best = a; }
    }
    p.a = best;
  }

  /* ------------------------------------------------------------------ start */
  function start(opts) {
    const st = RR.newState(opts);
    S = st; RR.S = st;
    C.makePools(st);
    st.difficulty = RR.settings.difficulty;
    const rules = RR.Content.rules();

    st.player = C.makePlayer(st, 1.5, 1.5, opts.mode === "tdm" ? (opts.team || 0) : 0, "YOU");
    st.actors.push(st.player);

    if (opts.mode === "campaign") {
      /* Accept either spelling — half the call sites used `campaign` and the
         other half `campaignId`, and the mismatch silently played the core
         campaign whatever you asked for, which is why mod campaigns looked
         like they did not load. An unknown id now fails instead of guessing. */
      st.campaign = opts.campaignId || opts.campaign || "core:main";
      if (!RR.Content.campaign(st.campaign)) {
        RR.U.toast('Campaign "' + st.campaign + '" not found');
        return null;
      }
      const cam = RR.Content.campaign(st.campaign);
      if (!cam) return null;
      st.levelIndex = opts.levelIndex || 0;
      if (!beginCampaignLevel(st)) return null;
    } else if (opts.mode === "horde") {
      const h = RR.Content.horde();
      const maps = (h.maps && h.maps.length) ? h.maps : ["c1"];
      if (!loadMap(st, opts.mapId || maps[Math.floor(Math.random() * maps.length)])) return null;
      resetActors(st); placePickups(st);
      placePlayer(st, st.map.spawns.player[0] || W.anyOpenCell(st.map));
      /* a map with its own pacing may want to start almost immediately */
      st.round = 0; st.roundState = "break";
      st.roundTimer = (st.map.def && st.map.def.horde && st.map.def.horde.breakTime != null)
        ? Math.min(4, st.map.def.horde.breakTime + 1) : 4;
      st.best = RR.Store.get("hordeBest", 0);
      st.hpScale = 1; st.speedScale = 1; st.dmgScale = 1;
      st.respawnDelay = (rules.coop && rules.coop.respawn) || 6;
      banner("ZOMBIE HORDE", "Round 1 incoming", 2.6);
    } else if (opts.mode === "ffa" || opts.mode === "tdm") {
      const ar = RR.Content.arenas();
      const pool = (ar[opts.mode] && ar[opts.mode].length) ? ar[opts.mode] : ["m1"];
      if (!loadMap(st, opts.mapId || pool[Math.floor(Math.random() * pool.length)])) return null;
      resetActors(st); placePickups(st);
      const mr = rules[opts.mode] || {};
      st.scoreLimit = opts.scoreLimit || mr.scoreLimit || 15;
      st.timeLimit = opts.timeLimit || mr.timeLimit || 300;
      st.respawnDelay = opts.respawnDelay || mr.respawn || 2.5;
      const nBots = opts.bots == null ? (mr.bots || 5) : opts.bots;
      const names = (RR.Content.botCfg().names || ["BOT"]).slice();
      for (let i = names.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = names[i]; names[i] = names[j]; names[j] = t; }
      const spawnList = opts.mode === "tdm" ? null : (st.map.spawns.dm.length ? st.map.spawns.dm : st.map.spawns.player);
      placePlayer(st, opts.mode === "tdm"
        ? pickSpawn(st, st.player.team === 0 ? st.map.spawns.teamA : st.map.spawns.teamB, st.player.team)
        : pickSpawn(st, spawnList, st.player.team));
      for (let i = 0; i < nBots; i++) {
        const team = opts.mode === "tdm" ? (i % 2 === 0 ? (st.player.team === 0 ? 1 : 0) : st.player.team) : (100 + i);
        const list = opts.mode === "tdm" ? (team === 0 ? st.map.spawns.teamA : st.map.spawns.teamB) : spawnList;
        const pt = pickSpawn(st, list && list.length ? list : st.map.spawns.dm, team);
        const b = C.makeBot(st, names[i % names.length] || ("BOT" + i), pt[0], pt[1], team);
        st.actors.push(b);
      }
      banner(opts.mode === "ffa" ? "FREE FOR ALL" : "TEAM DEATHMATCH",
        (opts.mode === "ffa" ? "First to " + st.scoreLimit : "First team to " + st.scoreLimit), 2.4);
    } else if (opts.mode === "edtest") {
      st.mode = "edtest";
      st.simMode = opts.simMode || "campaign";
      st.map = W.build(opts.mapDef);
      if (!st.map) return null;
      st.objective = opts.mapDef.objective || "Test drive";
      st.mapId = opts.mapDef._full || opts.mapDef.id;
      resetActors(st); placePickups(st);
      placePlayer(st, st.map.spawns.player[0] || st.map.spawns.dm[0] || W.anyOpenCell(st.map));
      /* A horde test drives the Z markers; everything else drives the E markers. */
      spawnEnemiesForLevel(st, { mix: opts.mix || ["guard"],
        family: st.simMode === "horde" ? "undead" : "human",
        points: st.simMode === "horde" && st.map.spawns.zombie.length ? st.map.spawns.zombie : null });
      banner("TEST DRIVE", "Esc to return to the editor", 2.2);
    }
    st.startedAt = 0;
    RR.mode = "play"; RR.paused = false;
    RR.In.refreshPadVisibility();
    RR.U.el("hud").classList.add("show");
    const mus = RR.Content.music((st.map && st.map.theme && st.map.theme.music) || "menu");
    RR.Audio.startMusic(mus);
    RR.Audio.setReverb(st.map && st.map.theme && st.map.theme.reverb != null ? st.map.theme.reverb : 0.20);
    if (RR.RGL && RR.RGL.dropMap) RR.RGL.dropMap();
    return st;
  }

  function beginCampaignLevel(st) {
    const cam = RR.Content.campaign(st.campaign);
    if (!cam || !cam.levels[st.levelIndex]) return false;
    const level = cam.levels[st.levelIndex];
    if (!loadMap(st, level.map)) return false;
    resetActors(st);
    placePickups(st);
    placePlayer(st, st.map.spawns.player[0] || W.anyOpenCell(st.map));
    spawnEnemiesForLevel(st, level);
    st.exitOpen = false; st.over = false; st.outcome = "";
    st.levelTime = 0;
    st.checkpoint = null;                       /* fresh sector, fresh progress */
    st.checkpointCount = (st.map.checkpoints || []).length;
    const def = RR.Content.map(level.map);
    if (def && def.onStart) runActions(st, def.onStart);
    /* the sector you are on is now the sector a restart should replay */
    RR.bus.emit("sector-begin", { campaignId: st.campaign, levelIndex: st.levelIndex });
    banner("SECTOR " + (st.levelIndex + 1), (level.brief || "").split("\n")[1] || st.objective, 3.0);
    const mus = RR.Content.music((st.map.theme && st.map.theme.music) || "menu");
    RR.Audio.startMusic(mus);
    return true;
  }

  /* ------------------------------------------------- safe mod action runner */
  function runActions(st, list) {
    if (!Array.isArray(list)) return;
    for (const a of list) {
      if (a.when) {
        let v = 0;
        if (a.when === "enemiesRemaining") v = aliveEnemies(st);
        else if (a.when === "health") v = st.player.hp;
        else if (a.when === "round") v = st.round;
        else if (a.when === "time") v = st.time;
        const ok = a.op === "<" ? v < a.value : a.op === "<=" ? v <= a.value :
          a.op === ">" ? v > a.value : a.op === ">=" ? v >= a.value : v === a.value;
        if (ok) runActions(st, a.then);
        continue;
      }
      switch (a.action) {
        case "message": banner(a.text || "", "", a.secs || 2.2); break;
        case "playSound": RR.Audio.play(a.sound); break;
        case "setMusic": RR.Audio.startMusic(RR.Content.music(a.track)); break;
        case "giveWeapon": C.giveWeapon(st.player, a.weapon, false); break;
        case "giveAmmo": {
          for (const id in st.player.weapons) {
            const w = st.player.weapons[id];
            if (!a.ammo || w.def.ammo === a.ammo) w.reserve = Math.min(w.def.reserveMax || 999, w.reserve + (a.amount || 20));
          }
          break;
        }
        case "setHealth": st.player.hp = M.clamp(a.value || 100, 1, st.player.maxHp); break;
        case "spawnEnemy": {
          const n = a.count || 1;
          for (let i = 0; i < n; i++) {
            const pt = a.at === "near" ? W.anyOpenCell(st.map) : W.farFrom(st.map, st.map.spawns.enemy.length ? st.map.spawns.enemy : [W.anyOpenCell(st.map)], [st.player], 6);
            const e = C.makeEnemy(st, a.enemy, pt[0], pt[1], 1);
            if (e) st.actors.push(e);
          }
          st.totalEnemies = Math.max(st.totalEnemies || 0, st.actors.filter((x) => x.isEnemy).length);
          break;
        }
        case "openDoors": W.openAllDoors(st.map); break;
        case "endLevel": finishLevel(st); break;
      }
    }
  }

  /* ------------------------------------------------------------ player step */
  function playerStep(st, inp, dt) {
    const p = st.player;
    if (p.dead) {
      p.deadT += dt;
      if (st.mode === "ffa" || st.mode === "tdm" || st.mode === "edtest") {
        p.respawnT -= dt;
        if (p.respawnT <= 0) respawnPlayer(st);
      }
      return;
    }
    /* look */
    p.a = M.norm(p.a + inp.look + inp.turn * 2.7 * dt);
    /* move */
    const fwd = inp.my, str = inp.mx;
    const cos = Math.cos(p.a), sin = Math.sin(p.a);
    const spd = p.speed * (1 - (p.adsEase || 0) * 0.42);
    let dx = (cos * fwd - sin * str) * spd * dt;
    let dy = (sin * fwd + cos * str) * spd * dt;
    const speedNow = Math.hypot(fwd, str);
    const moving = speedNow > 0.05;
    p._moveAmt = M.clamp(speedNow, 0, 1) * (1 - (p.adsEase || 0) * 0.5);
    W.move(st.map, p, dx, dy);
    if (moving && RR.settings.bobbing) { p.bobT += dt * 9.2; p.bob = Math.sin(p.bobT) * 0.5 * (1 - (p.adsEase || 0) * 0.7); }
    else { p.bob *= 0.86; }

    /* weapons + viewmodel */
    RR.VM.update(st, p, dt, inp);
    C.updateWeapon(st, p, dt);
    if (inp.slot >= 0) C.selectBySlotNum(p, inp.slot);
    if (inp.wheel) C.cycle(p, inp.wheel > 0 ? 1 : -1);
    if (inp.reload) C.startReload(st, p);
    if (inp.knife) C.knife(st, p);
    const wantFire = p.weapon && p.weapon.auto ? inp.fire : inp.firePress;
    if (wantFire) {
      if (p.ws && p.ws.mag <= 0 && p.ws.reserve <= 0 && p.reloadT <= 0 && p.fireCd <= 0) {
        RR.Audio.play("dry"); p.fireCd = 0.3;
      } else C.fire(st, p);
    }
    C.regen(st, p, dt);

    /* pickups */
    for (let i = 0; i < st.pickups.length; i++) {
      const q = st.pickups[i];
      if (q.taken || q.inert) continue;
      if (M.dist2(q.x, q.y, p.x, p.y) > 0.36) continue;
      let took = false;
      if (q.kind === "ammo") took = C.giveAmmoAll(p, 0.34);
      else if (q.kind === "armor") { took = C.giveArmor(p); if (took) RR.Audio.play("armor_pickup"); }
      else took = C.giveWeapon(p, q.kind, false);
      if (took) {
        /* Everything on the floor comes back, in every mode. rules.pickupRespawn
           is the one knob; 0 disables it for a mod that wants scarcity. */
        const rr = RR.Content.rules();
        q.taken = true;
        q.respawn = rr.pickupRespawn == null ? 30 : rr.pickupRespawn;
        q.respawnMax = q.respawn;
        RR.Audio.play("pickup");
        feed(st, "picked up " + (q.kind === "ammo" ? "ammo" : q.kind === "armor" ? "armour"
          : (RR.Content.weapon(q.kind) || {}).name || q.kind));
      }
    }
    /* exit */
    if (st.mode === "campaign" && st.map.exit && st.exitOpen) {
      if (M.dist2(p.x, p.y, st.map.exit.x, st.map.exit.y) < 0.6) finishLevel(st);
    }
  }
  /* A taken pickup does not disappear: it drops to a dim marker that pulses
     faster as it comes back, so you can learn the map's rhythm. */
  function updatePickups(st, dt) {
    for (let i = 0; i < st.pickups.length; i++) {
      const q = st.pickups[i];
      if (q.inert) { q.frame = st.checkpoint && st.checkpoint.n >= q.n ? 1 : 0; continue; }
      if (!q.taken) continue;
      if (q.respawn > 0) {
        q.respawn -= dt;
        if (q.respawn <= 0) {
          q.taken = false; q.respawn = 0;
          RR.Audio.play3d("pickup_respawn", q.x, q.y, 0.35);
        }
      }
    }
  }

  /* --------------------------------------------------------- checkpoints */
  /* Touching a checkpoint snapshots everything that matters. Dying in a
     campaign sector rewinds to that snapshot instead of throwing the whole
     sector away — enemies you already killed stay dead. */
  function snapshotCheckpoint(st, cp) {
    const p = st.player;
    const weapons = {};
    for (const id in p.weapons) {
      const w = p.weapons[id];
      weapons[id] = { mag: w.mag, reserve: w.reserve };
    }
    st.checkpoint = {
      n: cp.n, x: cp.x, y: cp.y, a: p.a,
      hp: p.hp, armor: p.armor || 0,
      weapons, order: p.order.slice(), cur: p.cur,
      /* which enemies were already down, so the rewind does not resurrect them */
      dead: st.actors.filter((a) => a.isEnemy && (a.dead || a.removed)).map((a) => a._uid),
      kills: st.stats.kills, shots: st.stats.shots, hits: st.stats.hits,
      levelTime: st.levelTime || 0,
      /* pickups already consumed stay consumed, but keep their timers running */
      taken: st.pickups.map((q) => (q.taken ? 1 : 0)),
    };
  }
  function updateCheckpoints(st, dt) {
    const cps = st.map && st.map.checkpoints;
    if (!cps || !cps.length || st.mode !== "campaign") return;
    const p = st.player;
    if (p.dead) return;
    for (let i = 0; i < cps.length; i++) {
      const cp = cps[i];
      if (st.checkpoint && st.checkpoint.n >= cp.n) continue;   /* never go backwards */
      if (M.dist2(cp.x, cp.y, p.x, p.y) > 0.42) continue;
      snapshotCheckpoint(st, cp);
      RR.Audio.play("checkpoint");
      banner("CHECKPOINT " + cp.n, "Progress saved", 1.6);
      feed(st, "checkpoint " + cp.n + " of " + cps.length);
      RR.bus.emit("checkpoint", cp.n);
    }
  }
  function restoreCheckpoint(st) {
    const cp = st.checkpoint;
    if (!cp) return false;
    const p = st.player;
    placePlayer(st, [cp.x, cp.y]);
    p.a = cp.a;
    /* resetLoadout re-applies the starting armour, so restore health and
       armour AFTER it, not before */
    C.resetLoadout(p, st);
    p.hp = Math.max(25, cp.hp);
    p.armor = cp.armor;
    for (const id in cp.weapons) {
      if (!p.weapons[id]) C.giveWeapon(p, id, true);
      const w = p.weapons[id];
      if (w) { w.mag = cp.weapons[id].mag; w.reserve = cp.weapons[id].reserve; }
    }
    C.selectSlot(p, M.clamp(cp.cur, 0, Math.max(0, p.order.length - 1)));
    /* rewind the level: everything that was alive at the checkpoint comes back
       where it started, everything already dead stays dead */
    const wasDead = Object.create(null);
    for (const uid of cp.dead) wasDead[uid] = 1;
    for (const a of st.actors) {
      if (!a.isEnemy) continue;
      if (wasDead[a._uid]) { a.dead = true; a.removed = true; continue; }
      a.dead = false; a.removed = false; a.hp = a.maxHp; a.frame = 0; a.deadT = 0;
      a.target = null; a.state = "idle"; a.stateT = 0; a._wp = null; a._field = null;
      if (a._sx != null) { a.x = a._sx; a.y = a._sy; }
    }
    for (let i = 0; i < st.pickups.length; i++) {
      const q = st.pickups[i];
      const wasTaken = cp.taken[i];
      if (!wasTaken && q.taken) { q.taken = false; q.respawn = 0; }
    }
    st.stats.kills = cp.kills; st.stats.shots = cp.shots; st.stats.hits = cp.hits;
    st.levelTime = cp.levelTime;
    st.exitOpen = false;
    st.bullets.forEach((b) => { b.live = false; });
    banner("CHECKPOINT " + cp.n, "Back in the fight", 2.2);
    RR.Audio.play("respawn");
    return true;
  }

  /* No checkpoint reached yet: rewind THIS sector, not the campaign. Same map,
     same sector number, everything back where it started. */
  function restartSector(st) {
    const cam = RR.Content.campaign(st.campaign);
    const L = cam && cam.levels[st.levelIndex];
    if (!L) {                      /* not a campaign sector — fail safe */
      placePlayer(st, st.map.spawns.player[0] || W.anyOpenCell(st.map));
      C.resetLoadout(st.player, st);
      return false;
    }
    beginCampaignLevel(st);
    banner("SECTOR " + (st.levelIndex + 1), "No checkpoint reached — restarting the sector", 2.6);
    RR.Audio.play("respawn");
    return true;
  }

  function respawnPlayer(st) {
    const p = st.player;
    const list = st.mode === "tdm" ? (p.team === 0 ? st.map.spawns.teamA : st.map.spawns.teamB)
      : (st.map.spawns.dm.length ? st.map.spawns.dm : st.map.spawns.player);
    const pt = pickSpawn(st, list && list.length ? list : st.map.spawns.player, p.team);
    placePlayer(st, pt);
    C.resetLoadout(p, st);       /* found weapons are lost; pistol + knife stay */
  }
  function respawnBot(st, b) {
    const list = st.mode === "tdm" ? (b.team === 0 ? st.map.spawns.teamA : st.map.spawns.teamB)
      : (st.map.spawns.dm.length ? st.map.spawns.dm : st.map.spawns.player);
    let pt = pickSpawn(st, list && list.length ? list : st.map.spawns.player, b.team);
    /* A spawn marker on an open tile is not automatically somewhere a body
       fits — nudge to the nearest place it does. */
    const rad = (b.radius || 0.24) + 0.02;
    pt = (pt && W.nearestStandable(st.map, pt[0], pt[1], rad)) ||
         W.anyOpenCell(st.map, null, rad) || pt;
    if (!pt) return;                       /* nowhere legal: leave it be */
    b.x = pt[0]; b.y = pt[1]; b.dead = false; b.alive = true; b.hp = b.maxHp;
    b.deadT = 0; b.frame = 0; b.target = null; b._goal = null; b.state = "roam";
    b.reloadT = 0; b.knifeT = 0;
    C.resetLoadout(b, st);
    const cfg = RR.Content.botCfg();
    const load = cfg.loadout || ["pistol"];
    const pick = load[Math.floor(Math.random() * load.length)];
    if (pick !== "pistol") { C.giveWeapon(b, pick, true); C.selectSlot(b, b.order.length - 1); }
  }

  /* ------------------------------------------------------------ mode ticks */
  function campaignTick(st, dt) {
    st.levelTime += dt;
    const alive = aliveEnemies(st);
    if (!st.exitOpen && alive === 0) {
      st.exitOpen = true;
      const def = RR.Content.map(st.mapId);
      if (def && def.onClear) runActions(st, def.onClear);
      if (st.map.exit) { banner("AREA CLEAR", "Reach the exit", 2.6); W.openAllDoors(st.map); RR.Audio.play("level_clear"); }
      else finishLevel(st);
    }
    st.objectiveText = alive > 0 ? "ELIMINATE HOSTILES" : (st.map.exit ? "REACH THE EXIT" : "CLEAR");
  }
  function finishLevel(st) {
    if (st.over) return;
    const cam = RR.Content.campaign(st.campaign);
    /* record THIS sector as cleared before the index moves on, so mission
       select can show what you have already done however you got there */
    markMissionDone(st.campaign, st.levelIndex);
    st.levelIndex++;
    if (!cam || st.levelIndex >= cam.levels.length) {
      st.over = true; st.outcome = "win";
      RR.Audio.play("level_clear");
      RR.UI.endScreen(st, "CAMPAIGN COMPLETE", (cam && cam.outro) || "");
      RR.Store.set("campaignDone", true);
      return;
    }
    saveProgress(st);
    RR.UI.interLevel(st);
  }
  /* A map may carry its own wave pacing (maps.<id>.horde). It layers over the
     pack-level horde block for THAT map only, so a demo map can stream enemies
     continuously without changing how the shipped horde maps play. */
  function hordeCfg(st) {
    const h = RR.Content.horde();
    const md = st && st.map && st.map.def;
    return (md && md.horde) ? Object.assign({}, h, md.horde) : h;
  }
  function hordeTick(st, dt) {
    const h = hordeCfg(st);
    const cap = h.capRound || 30;
    if (st.roundState === "break") {
      st.roundTimer -= dt;
      st.objectiveText = "NEXT ROUND IN " + Math.max(0, Math.ceil(st.roundTimer));
      if (st.roundTimer <= 0) {
        st.round++;
        const r = Math.min(st.round, cap);
        st.hpScale = 1 + (r - 1) * (h.hpPerRound || 0.075);
        st.speedScale = 1 + (r - 1) * (h.speedPerRound || 0.018);
        st.dmgScale = 1 + (r - 1) * (h.dmgPerRound || 0.045);
        st.spawnQueue = (h.baseCount || 6) + (st.round - 1) * (h.perRound || 3);
        st.roundTotal = st.spawnQueue;
        st.roundState = "fight"; st.spawnTimer = 0;
        C.giveAmmoAll(st.player, h.ammoRefillFrac || 0.4);
        RR.Audio.play("round_start");
        banner("ROUND " + st.round, st.spawnQueue + " incoming", 2.0);
      }
      return;
    }
    /* fight */
    const alive = aliveEnemies(st);
    const maxAlive = h.maxAlive || 16;
    st.spawnTimer -= dt;
    if (st.spawnQueue > 0 && alive < maxAlive && st.spawnTimer <= 0) {
      st.spawnTimer = h.spawnEvery == null ? 0.45 : h.spawnEvery;
      const mixList = (h.unlock || [{ round: 1, mix: ["shambler"] }]);
      let mix = mixList[0].mix;
      for (const u of mixList) if (st.round >= u.round) mix = u.mix;
      const pts = st.map.spawns.zombie.length ? st.map.spawns.zombie : st.map.spawns.enemy;
      const pt = W.farFrom(st.map, pts.length ? pts : [W.anyOpenCell(st.map)], [st.player], 6) || W.anyOpenCell(st.map);
      /* horde waves are undead by definition — a mistyped id must not put a
         rifleman in a zombie round */
      const e = C.makeEnemy(st, mix[Math.floor(Math.random() * mix.length)], pt[0], pt[1], 1, "undead");
      if (e) { st.actors.push(e); st.spawnQueue--; }
    }
    st.objectiveText = "ROUND " + st.round;
    if (st.spawnQueue <= 0 && alive === 0) {
      st.roundState = "break";
      st.roundTimer = h.breakTime || 9;
      if (st.round > st.best) { st.best = st.round; RR.Store.set("hordeBest", st.best); }
      banner("ROUND " + st.round + " CLEAR", "Resupplying…", 2.4);
      RR.Audio.play("level_clear", 0.6);
    }
  }
  function dmTick(st, dt) {
    if (st.timeLimit > 0) {
      st.matchTime = (st.matchTime || 0) + dt;
      if (st.matchTime >= st.timeLimit) return endMatch(st, "TIME");
    }
    for (let i = 0; i < st.actors.length; i++) {
      const b = st.actors[i];
      if (!b.isBot) continue;
      if (b.dead) { b.respawnT -= dt; if (b.respawnT <= 0) respawnBot(st, b); }
    }
    if (st.mode === "tdm") {
      st.objectiveText = "TEAM " + st.teamScore[0] + " – " + st.teamScore[1];
      if (st.teamScore[0] >= st.scoreLimit || st.teamScore[1] >= st.scoreLimit) return endMatch(st, "SCORE");
    } else {
      let top = 0;
      for (const a of st.actors) if (a.isPlayer || a.isBot) top = Math.max(top, a.score);
      st.objectiveText = "FRAGS " + st.player.score + " / " + st.scoreLimit;
      if (top >= st.scoreLimit) return endMatch(st, "SCORE");
    }
  }
  function endMatch(st, why) {
    if (st.over) return;
    st.over = true; st.outcome = "match";
    let title = "MATCH OVER";
    if (st.mode === "tdm") title = st.teamScore[st.player.team] > st.teamScore[1 - st.player.team] ? "TEAM VICTORY" : (st.teamScore[0] === st.teamScore[1] ? "DRAW" : "TEAM DEFEAT");
    else {
      let best = st.player, bs = st.player.score;
      for (const a of st.actors) if ((a.isBot || a.isPlayer) && a.score > bs) { bs = a.score; best = a; }
      title = best === st.player ? "VICTORY" : "DEFEATED BY " + best.name;
    }
    RR.UI.endScreen(st, title, why === "TIME" ? "Time limit reached" : "Score limit reached");
  }

  /* ------------------------------------------------------------------ tick */
  function tick(dt) {
    if (!S || RR.paused || RR.mode !== "play") return;
    const st = S;
    st.time += dt;
    if (st._bannerT > 0) { st._bannerT -= dt; if (st._bannerT <= 0) hideBanner(); }
    W.resetBudget();

    const inp = RR.In.sample(dt);
    RR.Audio.setListener(st.player, st.map);
    if (inp.pause) { RR.UI.pause(); RR.In.consume(); return; }
    if (!st.over) playerStep(st, inp, dt);
    RR.In.consume();

    for (let i = 0; i < st.actors.length; i++) {
      const a = st.actors[i];
      if (a.isPlayer) continue;
      if (a.dead) {
        a.deadT += dt;
        if (a.isEnemy && a.deadT > 12) a.removed = true;
        continue;
      }
      RR.AI.update(st, a, dt);
    }
    C.updateBullets(st, dt);
    C.updateParts(st, dt);
    W.updateDoors(st.map, st.actors, dt);
    updatePickups(st, dt);
    updateCheckpoints(st, dt);

    if (!st.over) {
      if (st.mode === "campaign") campaignTick(st, dt);
      else if (st.mode === "horde") hordeTick(st, dt);
      else if (st.mode === "ffa" || st.mode === "tdm") dmTick(st, dt);
      else if (st.mode === "edtest") {
        const alive = aliveEnemies(st);
        st.objectiveText = alive > 0 ? "TEST · HOSTILES " + alive : "TEST · CLEAR";
        if (alive === 0 && !st._edClear) { st._edClear = true; banner("TEST CLEAR", "Esc returns to the editor", 2.6); }
      }
    }
    /* ------------------------------------------------------- player death ---
     * Dying in a campaign NEVER moves you to a different sector and never
     * throws the run away. You go back to the last checkpoint you touched in
     * the sector you are standing in; if you had not reached one yet, that
     * sector restarts from its own beginning.
     *
     * It used to end the run outright whenever no checkpoint was armed, which
     * dropped you on the end screen — and "Play again" there replayed
     * `lastStart`, the sector you originally launched from. Die on sector 12
     * of a run begun at sector 1 and you were sent back to sector 1.
     * ---------------------------------------------------------------------- */
    if (st.player.dead && (st.mode === "campaign" || st.mode === "horde") && !st.over) {
      if (st.mode === "campaign") {
        if (st.player.deadT > 1.6) {
          st.deaths = (st.deaths || 0) + 1;
          if (st.checkpoint) restoreCheckpoint(st);
          else restartSector(st);
        }
      } else if (st.player.deadT > 2.2) {
        st.over = true; st.outcome = "lose";
        RR.UI.endScreen(st, "OVERRUN", "Reached round " + st.round + (st.round >= st.best ? "  ·  NEW BEST" : "  ·  best " + st.best));
      }
    }
    /* purge removed actors occasionally without allocating every frame */
    st._purge = (st._purge || 0) + dt;
    if (st._purge > 2) {
      st._purge = 0;
      for (let i = st.actors.length - 1; i >= 0; i--) if (st.actors[i].removed) st.actors.splice(i, 1);
    }
    hudT -= dt;
    if (hudT <= 0) { hudT = 0.1; updateHud(st); }
  }

  /* ------------------------------------------------------------------- HUD */
  function updateHud(st) {
    const p = st.player;
    const hp = Math.max(0, Math.round(p.hp));
    RR.U.el("hHpNum").textContent = hp;
    RR.U.el("hHpBar").style.width = M.clamp((p.hp / p.maxHp) * 100, 0, 100) + "%";
    const arm = Math.max(0, Math.round(p.armor || 0));
    const ael = RR.U.el("hArmor");
    ael.style.display = arm > 0 ? "" : "none";
    if (arm > 0) {
      RR.U.el("hArmorNum").textContent = arm;
      RR.U.el("hArmorBar").style.width = M.clamp((arm / (p.armorMax || 100)) * 100, 0, 100) + "%";
    }
    const ws = p.ws;
    RR.U.el("hAmmo").innerHTML = ws
      ? RR.U.esc((ws.def.name || "").toUpperCase()) + " <b>" + ws.mag + "</b> / " + ws.reserve + (p.reloadT > 0 ? " ·R" : "")
      : "—";
    let right = "";
    if (st.mode === "campaign" || st.mode === "edtest") right = "HOSTILES <b>" + aliveEnemies(st) + "</b>";
    else if (st.mode === "horde") right = "ZOMBIES <b>" + aliveEnemies(st) + "</b> · BEST <b>" + st.best + "</b>";
    else if (st.mode === "tdm") right = "A <b>" + st.teamScore[0] + "</b> · B <b>" + st.teamScore[1] + "</b>" + (st.timeLimit ? " · " + RR.U.fmtTime(st.timeLimit - (st.matchTime || 0)) : "");
    else right = "FRAGS <b>" + p.score + "</b>" + (st.timeLimit ? " · " + RR.U.fmtTime(st.timeLimit - (st.matchTime || 0)) : "");
    RR.U.el("hEnemies").innerHTML = right;
    RR.U.el("hObj").textContent = st.objectiveText || st.objective || "";
    const kf = st.killfeed.filter((k) => st.time - k.t < 4.5);
    const html = kf.map((k) => RR.U.esc(k.text)).join("<br>");
    if (html !== lastHud) { RR.U.el("killfeed").innerHTML = html; lastHud = html; }
    /* Weapon buttons reflect what you actually carry. Match on the weapon's
       SLOT, the same way the 1-4 keys do, rather than on a bare id: a mod may
       hand you "core:pistol", and a bare-id lookup greyed out every button in
       that case even though you were holding all four. */
    const bySlot = [null, null, null, null];
    for (let i = 0; i < p.order.length; i++) {
      const d = RR.Content.weapon(p.order[i]);
      const slot = d && d.slot;
      if (slot >= 1 && slot <= 4 && !bySlot[slot - 1]) bySlot[slot - 1] = p.order[i];
    }
    for (let i = 0; i < 4; i++) {
      const el = RR.U.el("wb" + i); if (!el) continue;
      const id = bySlot[i];
      el.classList.toggle("no", !id);
      el.classList.toggle("sel", !!id && p.order[p.cur] === id);
    }
  }

  /* ------------------------------------------------------------------ draw */
  function draw(dt) {
    if (!S || RR.mode !== "play") return;
    RR.R.draw(S);
  }

  /* --------------------------------------------------------------- save/load */
  function saveProgress(st) {
    if (st.mode !== "campaign") return false;
    const w = {};
    for (const id in st.player.weapons) w[id] = { mag: st.player.weapons[id].mag, reserve: st.player.weapons[id].reserve };
    RR.Store.set("save", {
      v: 1, campaign: st.campaign, levelIndex: st.levelIndex,
      difficulty: RR.settings.difficulty, hp: Math.round(st.player.hp),
      weapons: w, stats: st.stats, at: Date.now(),
    });
    return true;
  }
  function hasSave() { const s = RR.Store.get("save", null); return !!(s && s.v === 1); }

  /* ------------------------------------------------------- mission select
   * Every sector is individually playable, so progress is tracked per sector
   * rather than as a single "how far did you get" number. Keyed by campaign
   * id so the two campaigns never overwrite each other's record. */
  function missionKey(cid, i) { return String(cid) + "#" + i; }
  function markMissionDone(cid, i) {
    if (!cid) return;
    const done = RR.Store.get("missionsDone", {}) || {};
    done[missionKey(cid, i)] = 1;
    RR.Store.set("missionsDone", done);
  }
  function missionDone(cid, i) {
    const done = RR.Store.get("missionsDone", {}) || {};
    return !!done[missionKey(cid, i)];
  }
  function missionsCleared(cid) {
    const cam = RR.Content.campaign(cid);
    if (!cam) return 0;
    let n = 0;
    for (let i = 0; i < cam.levels.length; i++) if (missionDone(cid, i)) n++;
    return n;
  }
  function loadProgress() {
    const s = RR.Store.get("save", null);
    if (!s || s.v !== 1) return null;
    RR.settings.difficulty = s.difficulty || RR.settings.difficulty;
    const st = start({ mode: "campaign", campaignId: s.campaign, levelIndex: s.levelIndex || 0 });
    if (!st) return null;
    if (s.weapons) {
      for (const id in s.weapons) {
        C.giveWeapon(st.player, id, true);
        const w = st.player.weapons[id];
        if (w) { w.mag = M.clamp(s.weapons[id].mag | 0, 0, w.def.mag); w.reserve = M.clamp(s.weapons[id].reserve | 0, 0, w.def.reserveMax || 999); }
      }
      C.selectSlot(st.player, 0);
    }
    if (s.hp) st.player.hp = M.clamp(s.hp, 1, st.player.maxHp);
    return st;
  }

  function stop() {
    RR.Hud.clear();
    RR.Audio.stopMusic();
    RR.mode = "menu";
    RR.U.el("hud").classList.remove("show");
    RR.In.refreshPadVisibility();
    RR.In.exitLock();
    hideBanner();
  }

  return {
    start, tick, draw, stop, feed, banner, hideBanner, runActions,
    saveProgress, loadProgress, hasSave, aliveEnemies, beginCampaignLevel,
    markMissionDone, missionDone, missionsCleared,
    respawnPlayer, updateHud,
    get S() { return S; },
    set S(v) { S = v; RR.S = v; },
  };
})();


/* ==== 84_hudx.js ==================================================== */
/* ============================================================================
 * MODULE: HUD EXTRAS
 * Minimap with objective routing, and floating nameplates that make it obvious
 * at a glance who is a team-mate and who is a target.
 * ========================================================================== */
RR.Hud = (function () {
  let mini = null, mctx = null, mw = 0, mh = 0;
  let plates = null;
  let routeT = 0, route = null;

  function init() {
    mini = RR.U.el("minimap");
    plates = RR.U.el("plates");
    resize();
  }
  function resize() {
    if (!mini) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const css = Math.min(190, Math.max(110, Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.26)));
    mini.style.width = css + "px"; mini.style.height = css + "px";
    mw = Math.round(css * dpr); mh = mw;
    mini.width = mw; mini.height = mh;
    mctx = mini.getContext("2d");
  }

  /* ------------------------------------------------------------- minimap */
  function draw(S) {
    if (!mctx || !S || !S.map) return;
    const map = S.map, p = S.player;
    const g = mctx;
    g.clearRect(0, 0, mw, mh);
    const zoom = RR.settings.minimapZoom || 9;           // cells visible each way
    const cell = mw / (zoom * 2);
    const cx = mw / 2, cy = mh / 2;
    const rot = -p.a - Math.PI / 2;                      // north = where you face
    g.save();
    g.beginPath(); g.arc(cx, cy, mw / 2 - 2, 0, M.TAU); g.clip();
    g.fillStyle = "rgba(6,10,16,.80)"; g.fillRect(0, 0, mw, mh);
    g.translate(cx, cy); g.rotate(rot); g.translate(-p.x * cell, -p.y * cell);

    const x0 = Math.max(0, (p.x - zoom - 2) | 0), x1 = Math.min(map.w - 1, (p.x + zoom + 2) | 0);
    const y0 = Math.max(0, (p.y - zoom - 2) | 0), y1 = Math.min(map.h - 1, (p.y + zoom + 2) | 0);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const i = y * map.w + x, f = map.flags[i];
      let col = null;
      if (!f) col = "rgba(96,124,158,.30)";                       // floor
      else if (f & 16) col = "#c8912f";                           // door
      else if (f & 8) col = "rgba(150,180,210,.72)";              // wall
      else col = "rgba(190,150,90,.62)";                          // see-over prop
      g.fillStyle = col;
      g.fillRect(x * cell, y * cell, cell + 0.5, cell + 0.5);
    }
    /* route to the objective */
    if (route && route.length > 1) {
      g.strokeStyle = "rgba(95,232,140,.85)"; g.lineWidth = Math.max(1.5, cell * 0.24);
      g.lineJoin = "round"; g.lineCap = "round";
      g.beginPath();
      g.moveTo((route[0][0] + 0.5) * cell, (route[0][1] + 0.5) * cell);
      for (let i = 1; i < route.length; i++) g.lineTo((route[i][0] + 0.5) * cell, (route[i][1] + 0.5) * cell);
      g.stroke();
    }
    /* pickups — a taken one stays on the map as a hollow ring that fills back
       up as it respawns, so you can time a return trip */
    for (const q of S.pickups) {
      if (q.inert) continue;
      const col = q.kind === "armor" ? "#7fd8ff" : q.kind === "ammo" ? "#d8c46a"
        : q.kind === "rocket" ? "#ff5a48" : "#ff9d2e";
      const qx = q.x * cell, qy = q.y * cell, r = cell * 0.22;
      if (!q.taken) {
        g.fillStyle = col;
        g.beginPath(); g.arc(qx, qy, r, 0, M.TAU); g.fill();
      } else if (q.respawnMax > 0) {
        const t = 1 - M.clamp(q.respawn / q.respawnMax, 0, 1);
        g.strokeStyle = "rgba(255,255,255,.20)"; g.lineWidth = Math.max(1, cell * 0.10);
        g.beginPath(); g.arc(qx, qy, r, 0, M.TAU); g.stroke();
        g.strokeStyle = col;
        g.beginPath(); g.arc(qx, qy, r, -Math.PI / 2, -Math.PI / 2 + M.TAU * t); g.stroke();
      }
    }
    /* checkpoints: hollow while dormant, solid once claimed */
    for (const q of S.pickups) {
      if (!q.inert) continue;
      const claimed = S.checkpoint && S.checkpoint.n >= q.n;
      const qx = q.x * cell, qy = q.y * cell, r = cell * 0.30;
      g.strokeStyle = "#5ee08a"; g.lineWidth = Math.max(1.4, cell * 0.12);
      g.beginPath(); g.arc(qx, qy, r, 0, M.TAU);
      if (claimed) { g.fillStyle = "#5ee08a"; g.fill(); } else g.stroke();
    }
    /* actors — other players are NOT drawn until they shoot. Firing paints
       them on the map for a moment and then they fade off it again, so the
       minimap tells you where the noise came from, not where everyone is. */
    for (const a of S.actors) {
      if (a.isPlayer || a.dead || a.removed) continue;
      const hostile = RR.Combat.canHurt(S, S.player, a);
      let alpha = 1;
      if (hostile && (S.mode === "ffa" || S.mode === "tdm")) {
        const ping = a._mapPing || 0;
        if (ping <= 0) continue;
        alpha = M.clamp(ping / PING_FADE, 0, 1);
      }
      g.globalAlpha = alpha;
      /* enemies red, teammates blue */
      g.fillStyle = hostile ? "#ff5b5b" : "#4fc9ff";
      g.beginPath(); g.arc(a.x * cell, a.y * cell, cell * 0.30, 0, M.TAU); g.fill();
      if (alpha < 1) {
        g.strokeStyle = "rgba(255,91,91,.5)"; g.lineWidth = 1;
        g.beginPath(); g.arc(a.x * cell, a.y * cell, cell * (0.30 + (1 - alpha) * 0.9), 0, M.TAU); g.stroke();
      }
      g.globalAlpha = 1;
    }
    /* exit marker */
    if (map.exit) {
      g.fillStyle = S.exitOpen ? "#5ee08a" : "rgba(94,224,138,.45)";
      const ex = map.exit.x * cell, ey = map.exit.y * cell, r = cell * 0.42;
      g.beginPath(); g.moveTo(ex, ey - r); g.lineTo(ex + r, ey); g.lineTo(ex, ey + r); g.lineTo(ex - r, ey);
      g.closePath(); g.fill();
    }
    g.restore();

    /* player arrow, always centred and pointing up */
    g.fillStyle = "#ffffff";
    g.beginPath();
    g.moveTo(cx, cy - mw * 0.05); g.lineTo(cx + mw * 0.035, cy + mw * 0.04);
    g.lineTo(cx, cy + mw * 0.018); g.lineTo(cx - mw * 0.035, cy + mw * 0.04);
    g.closePath(); g.fill();
    /* ring */
    g.strokeStyle = "rgba(140,170,205,.5)"; g.lineWidth = 2;
    g.beginPath(); g.arc(cx, cy, mw / 2 - 2, 0, M.TAU); g.stroke();

    /* off-screen objective chevron */
    if (map.exit) {
      const dx = map.exit.x - p.x, dy = map.exit.y - p.y;
      const d = Math.hypot(dx, dy);
      if (d > zoom) {
        const ang = Math.atan2(dy, dx) + rot;
        const rr = mw / 2 - 10;
        g.fillStyle = S.exitOpen ? "#5ee08a" : "rgba(94,224,138,.6)";
        g.save(); g.translate(cx + Math.cos(ang) * rr, cy + Math.sin(ang) * rr); g.rotate(ang + Math.PI / 2);
        g.beginPath(); g.moveTo(0, -6); g.lineTo(5, 5); g.lineTo(-5, 5); g.closePath(); g.fill();
        g.restore();
      }
    }
  }

  /* Recompute the path to the current objective every so often. Uses the same
     BFS the AI navigates with, walked backwards from the player. */
  function updateRoute(S, dt) {
    routeT -= dt;
    if (routeT > 0) return;
    routeT = 0.6;
    route = null;
    const map = S.map;
    if (!map) return;
    let goal = null;
    if (S.mode === "campaign" || S.mode === "edtest" || S.mode === "horde") {
      if (map.exit && S.exitOpen && S.mode !== "horde") goal = [map.exit.x | 0, map.exit.y | 0];
      else {
        let best = null, bd = 1e9;
        for (const a of S.actors) {
          if (!a.isEnemy || a.dead || a.removed) continue;
          const d = M.dist2(a.x, a.y, S.player.x, S.player.y);
          if (d < bd) { bd = d; best = a; }
        }
        if (best) goal = [best.x | 0, best.y | 0];
      }
    }
    if (!goal) return;
    const field = RR.World.buildField(map, goal[0], goal[1]);
    if (!field) return;
    let cx = S.player.x | 0, cy = S.player.y | 0;
    if (field[cy * map.w + cx] < 0) return;
    const out = [[cx, cy]];
    const N = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (let step = 0; step < 220; step++) {
      const here = field[cy * map.w + cx];
      if (here <= 0) break;
      let nx = -1, ny = -1, best = here;
      for (const [dx, dy] of N) {
        const ax = cx + dx, ay = cy + dy;
        if (ax < 0 || ay < 0 || ax >= map.w || ay >= map.h) continue;
        const d = field[ay * map.w + ax];
        if (d >= 0 && d < best) { best = d; nx = ax; ny = ay; }
      }
      if (nx < 0) break;
      cx = nx; cy = ny; out.push([cx, cy]);
    }
    route = out;
  }

  /* ---------------------------------------------------------- nameplates */
  let lastPlateHtml = "";
  function drawPlates(S) {
    if (!plates) return;
    if (!RR.settings.nameplates || S.mode === "campaign" || S.mode === "horde" || S.mode === "edtest") {
      if (lastPlateHtml) { plates.innerHTML = ""; lastPlateHtml = ""; }
      return;
    }
    const p = S.player, map = S.map;
    const dirX = Math.cos(p.a), dirY = Math.sin(p.a);
    const fov = p.fovNow || RR.settings.fov;
    const fovS = Math.tan((fov * Math.PI / 180) / 2);
    const planeX = -dirY * fovS, planeY = dirX * fovS;
    const invDet = 1.0 / (planeX * dirY - dirX * planeY);
    const W = window.innerWidth, H = window.innerHeight;
    let html = "";
    for (const a of S.actors) {
      if (a.isPlayer || a.dead || a.removed) continue;
      if (!a.isBot && !a.isNet) continue;
      const d2 = M.dist2(a.x, a.y, p.x, p.y);
      if (d2 > 900) continue;
      const sx = a.x - p.x, sy = a.y - p.y;
      const tX = invDet * (dirY * sx - dirX * sy);
      const tY = invDet * (-planeY * sx + planeX * sy);
      if (tY < 0.4) continue;
      const screenX = (W / 2) * (1 + tX / tY);
      if (screenX < -60 || screenX > W + 60) continue;
      if (!RR.World.los(map, p.x, p.y, a.x, a.y)) continue;
      const hgt = (H / tY) * (a.spriteScale || 1);
      const groundY = H / 2 + (H / tY) * 0.5;
      const topY = groundY - hgt;
      const ally = !RR.Combat.canHurt(S, p, a);
      const cls = ally ? "ally" : "foe";     /* .ally = blue, .foe = red */
      const scale = M.clamp(1.1 - Math.sqrt(d2) / 34, 0.6, 1.05);
      html += '<div class="plate ' + cls + '" style="left:' + screenX.toFixed(0) + 'px;top:' +
        (topY - 20).toFixed(0) + 'px;transform:translate(-50%,-100%) scale(' + scale.toFixed(2) + ')">' +
        RR.U.esc(a.name) + (ally ? '<i style="width:' + Math.round(M.clamp(a.hp / (a.maxHp || 100), 0, 1) * 100) + '%"></i>' : '') +
        '</div>';
    }
    if (html !== lastPlateHtml) { plates.innerHTML = html; lastPlateHtml = html; }
  }

  /* How long a shot keeps you visible on someone else's minimap. */
  const PING_FADE = 2.2;
  function decayPings(S, dt) {
    for (const a of S.actors) {
      if (a.isPlayer) continue;
      if (a._mapPing > 0) a._mapPing -= dt;
    }
  }
  function frame(S, dt) {
    if (!S) return;
    decayPings(S, dt);
    const on = RR.settings.minimap !== false;
    const el = RR.U.el("minimapWrap");
    if (el) el.style.display = on ? "" : "none";
    if (on) { updateRoute(S, dt); draw(S); }
    drawPlates(S);
  }
  function clear() {
    if (mctx) mctx.clearRect(0, 0, mw, mh);
