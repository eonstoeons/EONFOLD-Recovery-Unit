        const p = cat + "." + id;
        if (!ID_RE.test(id)) { R.errors.push(p + ": id must be 1-32 chars, letters/digits/-/_ only"); continue; }
        const lc = id.toLowerCase();
        if (seen[lc]) { R.errors.push(p + ": duplicate id (ids are case-insensitive here)"); continue; }
        seen[lc] = 1;
        const o = src[id];
        if (!o || typeof o !== "object" || Array.isArray(o)) { R.errors.push(p + ": expected an object"); continue; }
        const clean = { id };
        for (const req of SPEC[cat].req) if (o[req] === undefined) R.errors.push(p + ": missing required field \"" + req + "\"");
        for (const k in o) {
          if (k === "id") continue;
          const fs = SPEC[cat].f[k];
          if (!fs) { R.warnings.push(p + '.' + k + ": unknown field, ignored"); continue; }
          let v;
          if (fs === "grid") v = chkGrid(o[k], p + "." + k, R);
          else if (fs === "acts") v = chkActions(o[k], p + "." + k, R);
          else if (fs === "levels") v = chkLevels(o[k], p + "." + k, R);
        else if (fs === "lights") v = chkLights(o[k], p + "." + k, R);
          else v = chkField(o[k], fs, p + "." + k, R);
          if (v !== undefined) clean[k] = v;
        }
        dst[id] = clean;
      }
      pack[cat] = dst;
    }
    /* free-form-ish blocks with their own light checks */
    if (data.arenas && typeof data.arenas === "object") {
      pack.arenas = {};
      for (const k of ["ffa", "tdm", "coop"]) if (Array.isArray(data.arenas[k]))
        pack.arenas[k] = data.arenas[k].filter((s) => typeof s === "string").slice(0, 24);
    }
    if (data.horde && typeof data.horde === "object") {
      const h = data.horde, o = {};
      const nums = { baseCount: [1, 60], perRound: [0, 30], maxAlive: [1, 60], breakTime: [0, 60],
        ammoRefillFrac: [0, 1], speedPerRound: [0, 0.2], hpPerRound: [0, 0.5], dmgPerRound: [0, 0.5], capRound: [1, 200] };
      for (const k in nums) if (h[k] !== undefined) { const v = chkField(h[k], nums[k], "horde." + k, R); if (v !== undefined) o[k] = v; }
      if (Array.isArray(h.maps)) o.maps = h.maps.filter((s) => typeof s === "string").slice(0, 24);
      if (Array.isArray(h.unlock)) o.unlock = h.unlock.filter((u) => u && typeof u.round === "number" && Array.isArray(u.mix))
        .map((u) => ({ round: M.clamp(u.round | 0, 1, 200), mix: u.mix.filter((s) => typeof s === "string").slice(0, 10) })).slice(0, 20);
      pack.horde = o;
    }
    if (data.rules && typeof data.rules === "object") {
      const r = data.rules, o = {};
      const nums = { playerHp: [1, 999], regenDelay: [0, 30], regenRate: [0, 200],
        playerArmor: [0, 300], armorMax: [0, 300], armorAbsorb: [0, 0.95], armorPickup: [1, 300] };
      for (const k in nums) if (r[k] !== undefined) { const v = chkField(r[k], nums[k], "rules." + k, R); if (v !== undefined) o[k] = v; }
      if (Array.isArray(r.startWeapons)) o.startWeapons = r.startWeapons.filter((s) => typeof s === "string").slice(0, 6);
      /* bottomless clip for the player — the weapon never eats a round */
      if (r.infiniteAmmo !== undefined) o.infiniteAmmo = !!r.infiniteAmmo;
      if (r.pickupRespawn !== undefined) { const v = chkField(r.pickupRespawn, [0, 600], "rules.pickupRespawn", R); if (v !== undefined) o.pickupRespawn = v; }
      for (const m of ["ffa", "tdm", "coop"]) if (r[m] && typeof r[m] === "object") {
        const mm = {}, spec = { scoreLimit: [1, 500], timeLimit: [30, 3600], bots: [0, 11], respawn: [0.5, 20] };
        for (const k in spec) if (r[m][k] !== undefined) { const v = chkField(r[m][k], spec[k], "rules." + m + "." + k, R); if (v !== undefined) mm[k] = v; }
        o[m] = mm;
      }
      pack.rules = o;
    }
    R.pack = pack;
    return R;
  }

  /* ------------------------------------------------------------- registry */
  let packs = [];                      // [{pack, enabled, protected, order}]
  let resolved = null;

  function corePack() { return { pack: RR.CORE, enabled: true, protected: true, order: -1 }; }

  /* The demo mod ships INSIDE the game rather than being imported, so it is
     rebuilt from source at every load and never stored as user data. Only its
     on/off state is remembered. That means it cannot drift, cannot be
     corrupted by a bad save, and cannot be duplicated by importing it. */
  const BUILTIN_ID = "endless-corridor";

  function load() {
    packs = [corePack()];
    const saved = RR.Store.get("mods", []);
    if (Array.isArray(saved)) {
      for (const rec of saved) {
        if (!rec || !rec.pack) continue;
        /* an older save may contain a copy of the built-in: ignore it, the
           real one is added from source below */
        if (rec.pack.id === BUILTIN_ID) continue;
        const R = validatePack(rec.pack, {});
        if (R.pack) packs.push({ pack: R.pack, enabled: rec.enabled !== false, protected: false, order: rec.order || 0 });
      }
    }
    if (RR.DEMO_ENDLESS) {
      const D = validatePack(RR.DEMO_ENDLESS, {});
      if (D.pack) packs.push({ pack: D.pack, enabled: RR.Store.get("demoEndlessOn", true) !== false,
                               protected: false, builtin: true, order: -0.5 });
    }
    rebuild();
  }
  function persist() {
    const out = packs.filter((p) => !p.protected && !p.builtin)
      .map((p) => ({ pack: p.pack, enabled: p.enabled, order: p.order }));
    RR.Store.set("mods", out);
    const d = packs.find((p) => p.builtin);
    if (d) RR.Store.set("demoEndlessOn", d.enabled);
  }
  function ordered() {
    return packs.slice().sort((a, b) => (a.protected ? -1 : b.protected ? 1 : a.order - b.order));
  }

  const CATS = ["themes", "weapons", "aiWeapons", "enemies", "maps", "campaigns", "music", "sounds", "bots"];

  function rebuild() {
    const out = { conflicts: [], missing: [] };
    for (const c of CATS) out[c] = {};
    out.arenas = { ffa: [], tdm: [], coop: [] };
    out.horde = {}; out.rules = {};
    const baseHordeMaps = (RR.CORE.horde && RR.CORE.horde.maps) ? RR.CORE.horde.maps.slice() : [];
    const hordeAdded = [];
    const list = ordered();
    for (const rec of list) {
      if (!rec.enabled) continue;
      const P = rec.pack, ns = P.namespace;
      for (const c of CATS) {
        const src = P[c]; if (!src) continue;
        for (const id in src) {
          const obj = src[id];
          const full = ns + ":" + id;
          const tagged = Object.assign({}, obj, { _ns: ns, _pack: P.id, _full: full });
          out[c][full] = tagged;
          if (out[c][id] && out[c][id]._ns !== ns) out.conflicts.push(c + "/" + id + ": " + out[c][id]._ns + " overridden by " + ns);
          out[c][id] = tagged;
        }
      }
      if (P.arenas) for (const k in P.arenas) if (out.arenas[k]) out.arenas[k] = out.arenas[k].concat(P.arenas[k]);
      if (P.horde) {
        /* horde.maps ADDS to the rotation instead of replacing it — a mod that
           ships one horde map should not hide the five that came with the
           game. Every other horde field still overrides, so a mod can retune
           the wave numbers.

           hordeAdded accumulates ACROSS packs. It used to be rebuilt from the
           core list for each pack in turn, so with two horde mods enabled the
           second one silently erased the first one's map from the rotation. */
        const addMaps = Array.isArray(P.horde.maps) ? P.horde.maps : null;
        Object.assign(out.horde, P.horde);
        if (addMaps) for (const mid of addMaps)
          if ((baseHordeMaps || []).indexOf(mid) < 0 && hordeAdded.indexOf(mid) < 0) hordeAdded.push(mid);
        out.horde.maps = (baseHordeMaps || []).concat(hordeAdded);
      }
      if (P.rules) {
        for (const k in P.rules) {
          if (k === "ffa" || k === "tdm" || k === "coop") out.rules[k] = Object.assign({}, out.rules[k], P.rules[k]);
          else out.rules[k] = P.rules[k];
        }
      }
    }
    /* missing-reference detection ---------------------------------------- */
    const has = (c, id) => !!(id && out[c][id]);
    for (const id in out.maps) {
      const m = out.maps[id];
      if (m._full !== id) continue;
      if (m.theme && !has("themes", m.theme)) out.missing.push("map " + id + ' -> theme "' + m.theme + '" not found');
    }
    for (const id in out.campaigns) {
      const c = out.campaigns[id];
      if (c._full !== id || !c.levels) continue;
      for (const L of c.levels) {
        if (!has("maps", L.map)) out.missing.push("campaign " + id + ' -> map "' + L.map + '" not found');
        if (L.mix) for (const e of L.mix) if (!has("enemies", e)) out.missing.push("campaign " + id + ' -> enemy "' + e + '" not found');
      }
    }
    for (const id in out.enemies) {
      const e = out.enemies[id];
      if (e._full !== id) continue;
      if (e.weapon && !has("aiWeapons", e.weapon)) out.missing.push("enemy " + id + ' -> aiWeapon "' + e.weapon + '" not found');
    }
    for (const k in out.arenas) for (const mid of out.arenas[k]) if (!has("maps", mid)) out.missing.push("arena " + k + ' -> map "' + mid + '" not found');
    if (out.horde.maps) for (const mid of out.horde.maps) if (!has("maps", mid)) out.missing.push('horde -> map "' + mid + '" not found');
    if (out.horde.unlock) for (const u of out.horde.unlock) for (const e of u.mix) if (!has("enemies", e)) out.missing.push('horde -> enemy "' + e + '" not found');

    resolved = out;
    RR.Assets.clearCache();
    RR.bus.emit("content-changed");
    return out;
  }

  /* ------------------------------------------------------------------- API */
  function addPack(pack, enabled) {
    const existing = packs.findIndex((p) => !p.protected && p.pack.id === pack.id);
    const order = existing >= 0 ? packs[existing].order : (packs.length ? Math.max.apply(null, packs.map((p) => p.order)) + 1 : 0);
    const rec = { pack, enabled: enabled !== false, protected: false, order };
    if (existing >= 0) packs[existing] = rec; else packs.push(rec);
    persist(); rebuild();
    return rec;
  }
  function removePack(id) {
    const i = packs.findIndex((p) => !p.protected && p.pack.id === id);
    if (i < 0) return false;
    /* the built-in demo cannot be deleted — it is part of the game — but
       turning it off is exactly what "remove" means to the player */
    if (packs[i].builtin) { packs[i].enabled = false; persist(); rebuild(); return true; }
    packs.splice(i, 1); persist(); rebuild(); return true;
  }
  function setEnabled(id, on) {
    const p = packs.find((q) => !q.protected && q.pack.id === id);
    if (!p) return false;
    p.enabled = !!on; persist(); rebuild(); return true;
  }
  function move(id, dir) {
    const user = packs.filter((p) => !p.protected).sort((a, b) => a.order - b.order);
    const i = user.findIndex((p) => p.pack.id === id);
    if (i < 0) return false;
    const j = i + dir;
    if (j < 0 || j >= user.length) return false;
    const t = user[i].order; user[i].order = user[j].order; user[j].order = t;
    persist(); rebuild(); return true;
  }
  function parseText(text) {
    const R = Val();
    let raw;
    if (typeof text !== "string" || text.length > 3_000_000) { R.errors.push("File is empty or larger than 3 MB."); return R; }
    try { raw = JSON.parse(text); }
    catch (e) { R.errors.push("Not valid JSON: " + e.message); return R; }
    return validatePack(raw, {});
  }
  function hash() {
    const ids = ordered().filter((p) => p.enabled).map((p) => p.pack.namespace + "@" + p.pack.version);
    return RR.U.hash(ids.join("|") + "|s" + RR.SCHEMA);
  }

  return {
    ACTIONS, COND_KEYS, OPS, SPEC, LEGAL_CELLS,
    load, rebuild, addPack, removePack, setEnabled, move, parseText, validatePack, sanitize, hash, persist,
    get packs() { return ordered(); },
    get resolved() { return resolved; },
  };
})();

/* --------------------------------------------------------------------------
 * RR.Content — read-side view of the merged packs.
 * ------------------------------------------------------------------------- */
RR.Content = (function () {
  function R() { return RR.Mods.resolved || {}; }
  function pick(cat, id, fallback) {
    const r = R()[cat];
    if (!r) return fallback;
    return r[id] || (fallback !== undefined ? fallback : null);
  }
  return {
    map: (id) => pick("maps", id),
    theme: (id) => pick("themes", id) || pick("themes", "security"),
    weapon: (id) => pick("weapons", id),
    aiWeapon: (id) => pick("aiWeapons", id) || pick("aiWeapons", "sidearm"),
    enemy: (id) => pick("enemies", id),
    campaign: (id) => pick("campaigns", id),
    sound: (id) => pick("sounds", id),
    music: (id) => pick("music", id) || pick("music", "menu"),
    /* Prefer an explicit "roster" entry; otherwise take the first entry that
       actually looks like a roster. Never returns null. */
    botCfg() {
      const b = R().bots || {};
      const named = b.roster || b["core:roster"];
      if (named && Array.isArray(named.names) && named.names.length) return named;
      for (const k in b) {
        const o = b[k];
        if (o && Array.isArray(o.names) && o.names.length) return o;
      }
      return { names: ["BOT"], loadout: ["pistol"], hp: 100, speed: 2.3 };
    },
    arenas: () => R().arenas || { ffa: [], tdm: [], coop: [] },
    horde: () => R().horde || {},
    rules: () => R().rules || {},
    listMaps() {
      const out = [], seen = {};
      const m = R().maps || {};
      for (const k in m) { const o = m[k]; if (o._full !== k || seen[o._full]) continue; seen[o._full] = 1; out.push(o); }
      return out;
    },
    listCampaigns() {
      const out = [], c = R().campaigns || {};
      for (const k in c) { const o = c[k]; if (o._full !== k) continue; out.push(o); }
      return out;
    },
    problems() { const r = R(); return { conflicts: r.conflicts || [], missing: r.missing || [] }; },
  };
})();


/* ==== 36_geometry.js ================================================ */
/* ============================================================================
 * MODULE: GEOMETRY
 * The vertical-span model that makes this a 2.5D world instead of a flat maze.
 *
 * Every cell owns up to two solid vertical SPANS expressed in wall-height
 * units, where 0 is the floor and 1 is the ceiling. A full wall is [0,1]. A
 * crate is [0,0.58] — you see over it, and because a bullet flies at z=0.52 it
 * still stops your shot. A railing is [0,0.30] — blocks your feet, not your
 * bullets. A window is two spans with a gap at chest height, so you can shoot
 * through it but not walk through it.
 *
 * Three independent tests fall out of the same data:
 *   blocksMove  any span overlapping the body volume [0, BODY_TOP]
 *   blocksAtZ   any span containing a given height (bullets, line of sight)
 *   spans       what the renderer actually draws
 * ========================================================================== */
RR.Geo = (function () {
  const BODY_TOP = 0.80;      // how tall an actor is, for movement collision
  const EYE = 0.50;           // camera / line-of-sight height
  const SHOT = 0.52;          // height a bullet travels at

  /* char code -> { spans:[[lo,hi],...], tile, name, solidFull } */
  const CELLS = {
    35:  { c: "#", spans: [[0, 1]],               tile: 0,  name: "Wall A" },
    61:  { c: "=", spans: [[0, 1]],               tile: 1,  name: "Wall B" },
    37:  { c: "%", spans: [[0, 1]],               tile: 2,  name: "Wall C" },
    43:  { c: "+", spans: [[0, 1]],               tile: 3,  name: "Door", door: true },
    111: { c: "o", spans: [[0, 0.58]],            tile: 4,  name: "Crate" },
    98:  { c: "b", spans: [[0, 0.74]],            tile: 5,  name: "Barrel" },
    114: { c: "r", spans: [[0, 0.30]],            tile: 8,  name: "Railing" },
    119: { c: "w", spans: [[0, 0.42], [0.74, 1]], tile: 9,  name: "Window" },
    118: { c: "v", spans: [[0.82, 1]],            tile: 10, name: "Overhead beam" },
    110: { c: "n", spans: [[0, 0.46], [0.88, 1]], tile: 11, name: "Counter + soffit" },
  };
  /* derived flags, computed once */
  for (const k in CELLS) {
    const d = CELLS[k];
    d.code = +k;
    d.full = d.spans.length === 1 && d.spans[0][0] <= 0.001 && d.spans[0][1] >= 0.999;
    d.blocksMove = d.spans.some((s) => s[0] < BODY_TOP && s[1] > 0.02);
    d.blocksShot = d.spans.some((s) => s[0] <= SHOT && s[1] >= SHOT);
    d.blocksSight = d.spans.some((s) => s[0] <= EYE && s[1] >= EYE);
    d.top = Math.max.apply(null, d.spans.map((s) => s[1]));
  }
  const FLOOR = 46;                       // '.'
  const byChar = {};
  for (const k in CELLS) byChar[CELLS[k].c] = CELLS[k];

  function def(code) { return CELLS[code] || null; }
  function isSolidCode(code) { return !!CELLS[code]; }

  /* Doors slide sideways along their own plane. Orientation is decided once,
     at build time, from which neighbours are solid. */
  function doorAxis(cells, w, h, x, y) {
    const at = (cx, cy) => (cx < 0 || cy < 0 || cx >= w || cy >= h) ? 35 : cells[cy * w + cx];
    const solid = (cx, cy) => { const d = CELLS[at(cx, cy)]; return d && d.full; };
    const ew = solid(x - 1, y) && solid(x + 1, y);   // walls left+right -> corridor runs N/S
    const ns = solid(x, y - 1) && solid(x, y + 1);
    if (ew && !ns) return 1;      // slab lies across Y, slides along X
    if (ns && !ew) return 0;      // slab lies across X, slides along Y
    return ew ? 1 : 0;
  }

  return { CELLS, byChar, def, isSolidCode, doorAxis, FLOOR, BODY_TOP, EYE, SHOT,
    symbols: Object.keys(CELLS).map((k) => CELLS[k].c).join("") };
})();


/* ==== 38_viewmodel.js =============================================== */
/* ============================================================================
 * MODULE: VIEWMODEL
 * The weapon in your hands. Drawn to its own overlay canvas so both renderers
 * share exactly this code. Owns aim-down-sights blending, inertia sway,
 * recoil recovery, muzzle flash, the knife arc and screen-space shell casings.
 * ========================================================================== */
RR.VM = (function () {
  const A = RR.Assets;
  let cvs = null, ctx = null, W = 0, H = 0;
  const shells = [];
  const SHELL_MAX = 24;
  for (let i = 0; i < SHELL_MAX; i++) shells.push({ live: false, x: 0, y: 0, vx: 0, vy: 0, rot: 0, vr: 0, t: 0, col: "#c8a24a" });

  function init() {
    cvs = RR.U.el("vmcanvas");
    ctx = cvs.getContext("2d");
    ctx.imageSmoothingEnabled = false;
  }
  function resize(w, h) {
    if (!cvs) init();
    if (cvs.width === w && cvs.height === h) return;
    cvs.width = w; cvs.height = h; W = w; H = h;
    ctx = cvs.getContext("2d");
    ctx.imageSmoothingEnabled = false;
  }
  function ejectShell(kind) {
    for (let i = 0; i < SHELL_MAX; i++) {
      const s = shells[i];
      if (s.live) continue;
      s.live = true; s.t = 0;
      s.x = 0.56 + Math.random() * 0.04;
      s.y = 0.60 + Math.random() * 0.03;
      s.vx = 0.55 + Math.random() * 0.35;
      s.vy = -(0.9 + Math.random() * 0.4);
      s.rot = Math.random() * 6.28; s.vr = (Math.random() - 0.5) * 22;
      s.col = kind === "shotgun" ? "#b8332e" : "#c8a24a";
      s.big = kind === "shotgun";
      return;
    }
  }
  function stepShells(dt) {
    for (let i = 0; i < SHELL_MAX; i++) {
      const s = shells[i];
      if (!s.live) continue;
      s.t += dt;
      if (s.t > 1.1) { s.live = false; continue; }
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.vy += 3.4 * dt; s.vx *= 0.99;
      s.rot += s.vr * dt;
    }
  }

  /* Per-frame weapon state. Called from the sim so it stays framerate-locked. */
  function update(S, p, dt, inp) {
    const wantAds = !!(inp && inp.ads) && !p.dead && p.reloadT <= 0 && p.knifeT <= 0 && p.weapon && !p.weapon.melee;
    p.adsT = M.clamp((p.adsT || 0) + (wantAds ? dt * 7.5 : -dt * 9), 0, 1);
    const ease = p.adsT * p.adsT * (3 - 2 * p.adsT);
    p.adsEase = ease;
    /* narrower field of view while sighted, plus a punch when firing */
    const baseFov = RR.settings.fov;
    const target = baseFov - ease * 16 + (p.fovPunch || 0);
    p.fovNow = M.lerp(p.fovNow == null ? baseFov : p.fovNow, target, M.clamp(dt * 12, 0, 1));
    p.fovPunch = (p.fovPunch || 0) * Math.max(0, 1 - dt * 9);

    /* inertia: the gun lags behind the camera, then springs back */
    const dA = M.angDiff(p._lastA == null ? p.a : p._lastA, p.a);
    p._lastA = p.a;
    p.swayVX = (p.swayVX || 0) + (-dA * 34 - (p.swayX || 0) * 26) * dt;
    p.swayVX *= Math.max(0, 1 - dt * 7);
    p.swayX = (p.swayX || 0) + p.swayVX * dt;
    p.swayX = M.clamp(p.swayX, -0.9, 0.9);

    const moving = p._moveAmt || 0;
    p.bobPhase = (p.bobPhase || 0) + dt * 9.4 * moving;
    p.swayY = M.lerp(p.swayY || 0, moving * 0.55 * (1 - ease * 0.8), M.clamp(dt * 7, 0, 1));

    /* recoil: fast rise, spring recovery */
    p.recoilY = (p.recoilY || 0) * Math.max(0, 1 - dt * 11);
    p.kickPitch = (p.kickPitch || 0) * Math.max(0, 1 - dt * 9);
    p.pitch = M.lerp(p.pitch || 0, -(p.kickPitch || 0) * 0.05, M.clamp(dt * 16, 0, 1));
    if (p.fireFlash > 0) p.fireFlash -= dt * 7;
    stepShells(dt);
  }
  function onFire(p, def) {
    p.fireFlash = 1;
    p.recoilY = (p.recoilY || 0) + (def.recoil || 0.03) * 13 * (1 - (p.adsEase || 0) * 0.45);
    p.kickPitch = (p.kickPitch || 0) + (def.kick || 5) * 0.055 * (1 - (p.adsEase || 0) * 0.4);
    p.fovPunch = (p.fovPunch || 0) + (def.pellets > 1 ? 2.6 : 1.3);
    ejectShell(def.sprite);
  }

  /* ------------------------------------------------------------------ draw */
  function draw(S) {
    if (!ctx) init();
    ctx.clearRect(0, 0, W, H);
    if (!S) return;
    const p = S.player;
    if (!p || p.dead) return;
    const wp = p.weapon;
    const knifing = p.knifeT > 0;
    const kind = knifing ? "knife" : (wp && wp.sprite) || "pistol";
    const fr = A.viewmodel(kind);
    const ads = knifing ? 0 : (p.adsEase || 0);
    let f = 0;

/* ============================================================================
 * MODULE: RENDERER / SOFTWARE
 * CPU raymarcher. Marches each column front-to-back through the span geometry
 * and writes into a full-resolution depth buffer, so sprites, particles and
 * shadows all occlude correctly against waist-high cover, railings and
 * windows instead of just against full walls.
 *
 * Passes: floor+ceiling -> wall spans -> billboards -> post.
 * ========================================================================== */
RR.RSoft = (function () {
  const A = RR.Assets, G = RR.Geo;
  const TS = A.TS, AW = A.AW, LV = A.SHADE_LEVELS;
  const SR = A.SR, SG = A.SG, SB = A.SB, SA = A.SA;
  const INF = 1e9;

  let cvs = null, ctx = null, img = null, buf = null, dbuf = null;
  let W = 320, H = 180, cssW = 640, cssH = 360;
  let vig = null, bloomA = null, bloomB = null, bloomW = 0, bloomH = 0;
  const QUALITY = { low: 240, medium: 360, high: 520 };
  let baseW = 360, scale = 1, avgMs = 16, frames = 0;
  let hudFlash = 0;
  const list = [];
  const lm = [0, 0, 0];
  const dyn = [];                       // dynamic lights this frame

  /* Bayer 4x4 for cheap dithering */
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v / 16 - 0.5) * 7);

  function init() { cvs = RR.U.el("view"); resize(); }
  function alloc(w, h) {
    W = Math.max(120, w | 0); H = Math.max(80, h | 0);
    cvs.width = W; cvs.height = H;
    ctx = cvs.getContext("2d", { alpha: false, desynchronized: true });
    ctx.imageSmoothingEnabled = false;
    img = ctx.createImageData(W, H);
    buf = new Uint32Array(img.data.buffer);
    dbuf = new Float32Array(W * H);
    bloomW = Math.max(8, W >> 2); bloomH = Math.max(6, H >> 2);
    bloomA = new Float32Array(bloomW * bloomH * 3);
    bloomB = new Float32Array(bloomW * bloomH * 3);
    vig = new Float32Array(W * H);
    const cx = W / 2, cy = H / 2, maxr = Math.hypot(cx, cy);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const r = Math.hypot(x - cx, y - cy) / maxr;
      vig[y * W + x] = 1 - Math.pow(r, 2.6) * 0.55;

  }
  function resize() {
    cssW = Math.max(1, window.innerWidth); cssH = Math.max(1, window.innerHeight);
    baseW = QUALITY[RR.settings.quality] || QUALITY.medium;
    applyScale();
  }
  function applyScale() {
    const aspect = Math.max(0.4, cssW / cssH);
    let w = M.clamp(Math.round(baseW * scale), 160, 760);
    let h = M.clamp(Math.round(w / aspect), 100, 480);
    if (!buf || w !== W || h !== H) alloc(w, h);
  }
  function adapt(ms) {
    if (!RR.settings.dynamicRes) { if (scale !== 1) { scale = 1; applyScale(); } return; }
    avgMs = avgMs * 0.9 + ms * 0.1;
    if (++frames < 30) return;

      const a = S.actors[i];

        texX = texX < 0 ? 0 : texX > TS - 1 ? TS - 1 : texX;

        const decU = dec ? M.clamp((texU * RR.World.WD) | 0, 0, RR.World.WD - 1) : 0;

        const spans = spanB0 >= 0 ? 2 : 1;

      if (a.dead && a.deadT > 8) continue;

          gl.uniform1i(progBlur.u.uTex, 0);
          gl.uniform2f(progBlur.u.uStep, i === 0 ? 1 / bw : 0, i === 0 ? 0 : 1 / bh);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
      }

      /* --- composite --- */
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, W, H);
      gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);
      gl.useProgram(progComp);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneFBO.tex);
      gl.uniform1i(progComp.u.uScene, 0);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomFBO[0].tex);
      gl.uniform1i(progComp.u.uBloom, 1);
      const th = map.theme;
      gl.uniform3f(progComp.u.uGrade, th.gradeR == null ? 1 : th.gradeR, th.gradeG == null ? 1 : th.gradeG, th.gradeB == null ? 1 : th.gradeB);
      gl.uniform1f(progComp.u.uBloomAmt, bloomAmt);
      gl.uniform1f(progComp.u.uVig, 0.42);
      gl.uniform1f(progComp.u.uCA, RR.settings.quality === "low" ? 0 : 0.020);
      gl.uniform1f(progComp.u.uFlash, Math.max(0, hudFlash));
      gl.uniform1f(progComp.u.uTime, (S.time % 10));
      gl.uniform1f(progComp.u.uGrain, RR.settings.quality === "low" ? 0.0 : 0.022);
      gl.bindVertexArray(vao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindVertexArray(null);
      if (hudFlash > 0) hudFlash -= 0.06;

      RR.VM.draw(S);
      adapt(performance.now() - t0);
      return true;
    } catch (e) {
      reason = e && e.message || String(e);
      ok = false; failed = true;
      return false;
    }
  }

  /* Billboards: actors, pickups (depth-tested opaque) then particles
     (additive, no depth write). Batched by texture. */
  function drawBillboards(S, p, dirX, dirY, planeX, planeY, hz) {
    const map = S.map;
    const invDet = 1.0 / (planeX * dirY - dirX * planeY);
    const items = [];
    const consider = (o, d2) => { o._d = d2; items.push(o); };
    for (const a of S.actors) {
      if (a.isPlayer || a.removed) continue;
      if (a.dead && a.deadT > 8) continue;
      const d = M.dist2(a.x, a.y, p.x, p.y); if (d > 1600) continue;
      consider(a, d);
    }
    for (const q of S.pickups) { if (q.taken) continue; const d = M.dist2(q.x, q.y, p.x, p.y); if (d > 1000) continue; consider(q, d); }
    items.sort((a, b) => b._d - a._d);

    const FOGS = 4, FOGE = map.theme.fogEnd || 30;
    const batches = new Map();
    for (const o of items) {
      const sh = o.sheet; if (!sh) continue;
      const sx = o.x - p.x, sy = o.y - p.y;
      const tX = invDet * (dirY * sx - dirX * sy);
      const tY = invDet * (-planeY * sx + planeX * sy);
      if (tY < 0.18) continue;
      const scrX = (W / 2) * (1 + tX / tY);
      const hgt = o.spriteScale || 1;
      const sHt = (H / tY) * hgt, sWd = (H / tY) * hgt * 0.75;
      const groundY = hz + (H / tY) * 0.5;
      lm[0] = 0; lm[1] = 0; lm[2] = 0;
      RR.World.lightAt(map, o.x, o.y, lm);
      const em = sh.emissive || 0;
      let lr = lm[0] + em, lg = lm[1] + em, lb = lm[2] + em;
      /* No proximity fill. A close-range boost made every enemy look like it
         was carrying its own lamp; sprites now take the room's light and
         nothing else. */
      /* muzzle flashes still light nearby sprites, but softly — this used to
         be strong enough to look like a permanent aura */
      for (const L of S.actors) {
        if (L.dead || !(L.fireFlash > 0.02)) continue;   /* NaN/undefined-safe */
        const d = Math.hypot(L.x - o.x, L.y - o.y);
        if (d > 7) continue;
        const att = (1 - d / 7) * (1 - d / 7) * L.fireFlash * 0.75;
        lr += att; lg += att * 0.84; lb += att * 0.5;
      }
      /* Final backstop: Math.max(NaN, k) is NaN, and NaN reaching the shader
         paints the sprite pure black. Anything non-finite falls back to the
         floor so a bad light value can never turn a character into a
         silhouette again. */
      lr = lr > 0.22 ? lr : 0.22; lg = lg > 0.23 ? lg : 0.23; lb = lb > 0.26 ? lb : 0.26;
      if (o.hitT > 0) { lr = 2.2; lg *= 0.4; lb *= 0.4; }
      let dirRow = 0;
      if (sh.dirs > 1) {
        const toCam = Math.atan2(p.y - o.y, p.x - o.x);
        dirRow = Math.round(M.norm(toCam - (o.a || 0)) / (M.TAU / sh.dirs)) % sh.dirs;
        if (dirRow < 0) dirRow += sh.dirs;
      }
      const fogT = M.clamp((tY - FOGS) / (FOGE - FOGS), 0, 1);
      const u0 = (o.frame | 0) * sh.fw / sh.w, u1 = u0 + sh.fw / sh.w;
      const v0 = dirRow * sh.fh / sh.h, v1 = v0 + sh.fh / sh.h;
      const depth = 1 - 1 / (1 + tY * 0.06);
      const key = sheetTexture(sh);
      let arr = batches.get(key);
      if (!arr) { arr = []; batches.set(key, arr); }
      arr.push({ x0: scrX - sWd / 2, x1: scrX + sWd / 2, y0: groundY - sHt, y1: groundY,
        u0, u1, v0, v1, lr, lg, lb, fogT, depth });
    }

    gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.disable(gl.BLEND);
    gl.useProgram(progSprite);
    gl.bindVertexArray(spriteVAO);
    const fog = map.fogRGB;
    for (const [tex, arr] of batches) {
      let n = 0;
      for (const q of arr) {
        if (n + 6 > 300) break;
        const push = (px, py, uu, vv) => {
          const o2 = (n * 6 + 0) * 13;
          verts[o2] = px; verts[o2 + 1] = py;
        };
        const base = n * 6 * 13;
        const corners = [[q.x0, q.y0, q.u0, q.v0], [q.x1, q.y0, q.u1, q.v0], [q.x0, q.y1, q.u0, q.v1],
                         [q.x1, q.y0, q.u1, q.v0], [q.x1, q.y1, q.u1, q.v1], [q.x0, q.y1, q.u0, q.v1]];
        for (let k = 0; k < 6; k++) {
          const o2 = base + k * 13, c = corners[k];
          verts[o2] = c[0] / W * 2 - 1; verts[o2 + 1] = 1 - c[1] / H * 2;
          verts[o2 + 2] = c[2]; verts[o2 + 3] = c[3];
          verts[o2 + 4] = q.lr; verts[o2 + 5] = q.lg; verts[o2 + 6] = q.lb; verts[o2 + 7] = 1;
          verts[o2 + 8] = fog[0]; verts[o2 + 9] = fog[1]; verts[o2 + 10] = fog[2]; verts[o2 + 11] = q.fogT;
          verts[o2 + 12] = q.depth;
        }
        n++;
      }
      if (!n) continue;
      gl.bindBuffer(gl.ARRAY_BUFFER, spriteVBO);
      gl.bufferData(gl.ARRAY_BUFFER, verts.subarray(0, n * 6 * 13), gl.DYNAMIC_DRAW);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.uniform1i(progSprite.u.uTex, 0);
      gl.uniform1i(progSprite.u.uSDbg, sdbg);
      gl.drawArrays(gl.TRIANGLES, 0, n * 6);
    }

    /* particles + bullets: additive glow */
    const glows = [];
    for (const b of S.bullets) if (b.live) glows.push(b);
    for (const q of S.parts) if (q.live) glows.push(q);
    if (glows.length) {
      gl.useProgram(progGlow);
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.depthMask(false);
      let n = 0;
      for (const o of glows) {
        if (n + 1 > 300) break;
        const sx = o.x - p.x, sy = o.y - p.y;
        const tX = invDet * (dirY * sx - dirX * sy);
        const tY = invDet * (-planeY * sx + planeX * sy);
        if (tY < 0.18) continue;
        const scrX = (W / 2) * (1 + tX / tY);
        const sz = Math.max(2, (o.size || 0.07) * H / tY * 2.2);
        const cyy = hz + (H / tY) * (0.5 - (o.z == null ? 0.5 : o.z));
        const c = o.color;
        const cr = ((c >>> A.SR) & 255) / 255, cg = ((c >>> A.SG) & 255) / 255, cb = ((c >>> A.SB) & 255) / 255;
        const alpha = o.isBullet ? 1.0 : M.clamp(o.life / (o.ttl || 1), 0, 1) * 0.9;
        const depth = 1 - 1 / (1 + tY * 0.06);
        const corners = [[scrX - sz, cyy - sz, 0, 0], [scrX + sz, cyy - sz, 1, 0], [scrX - sz, cyy + sz, 0, 1],
                         [scrX + sz, cyy - sz, 1, 0], [scrX + sz, cyy + sz, 1, 1], [scrX - sz, cyy + sz, 0, 1]];
        const base = n * 6 * 13;
        for (let k = 0; k < 6; k++) {
          const o2 = base + k * 13, cc = corners[k];
          verts[o2] = cc[0] / W * 2 - 1; verts[o2 + 1] = 1 - cc[1] / H * 2;
          verts[o2 + 2] = cc[2]; verts[o2 + 3] = cc[3];
          verts[o2 + 4] = cr; verts[o2 + 5] = cg; verts[o2 + 6] = cb; verts[o2 + 7] = alpha;
          verts[o2 + 8] = 0; verts[o2 + 9] = 0; verts[o2 + 10] = 0; verts[o2 + 11] = 0;
          verts[o2 + 12] = depth;
        }
        n++;
      }
      if (n) {
        gl.bindBuffer(gl.ARRAY_BUFFER, spriteVBO);
        gl.bufferData(gl.ARRAY_BUFFER, verts.subarray(0, n * 6 * 13), gl.DYNAMIC_DRAW);
        gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texGlow);
        gl.uniform1i(progGlow.u.uTex, 0);
        gl.drawArrays(gl.TRIANGLES, 0, n * 6);
      }
      gl.depthMask(true); gl.disable(gl.BLEND);
    }
    gl.bindVertexArray(null);
  }

  /* TESTS: sample the framebuffer so the suite can prove a frame was drawn.
     Must be called in the same task as draw(), before the buffer is swapped. */
  function readbackStats() {
    if (!ok || !gl) return { lit: 0, avg: 0, w: W, h: H };
    const rw = Math.min(64, W), rh = Math.min(64, H);
    const px = new Uint8Array(rw * rh * 4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFBO ? sceneFBO.fb : null);
    gl.readPixels((W - rw) >> 1, (H - rh) >> 1, rw, rh, gl.RGBA, gl.UNSIGNED_BYTE, px);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    let lit = 0, sum = 0, sr = 0, sg = 0, sb = 0;
    for (let i = 0; i < px.length; i += 4) {
      const v = px[i] + px[i + 1] + px[i + 2];
      sum += v; sr += px[i]; sg += px[i + 1]; sb += px[i + 2];
      if (v > 18) lit++;
    }
    const n = px.length / 4;
    return { lit, avg: Math.round(sum / n), w: W, h: H,
      r: sr / n, g: sg / n, b: sb / n, chroma: (Math.max(sr, sg, sb) - Math.min(sr, sg, sb)) / n };
  }

  function clearBlack() {
    if (!ok || !gl) return;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    RR.VM.clear();
  }
  function dropMap() { curMap = null; mapRev = -1; atlasRev = -1; }
  RR.bus.on("atlas-changed", () => { atlasRev = -1; mapRev = -1; });

  return {
    name: "webgl", init, resize, draw, clearBlack, dropMap, readbackStats,
    debugMode(n) { dbgMode = n | 0; },
    spriteDebug(n) { sdbg = n | 0; },
    _dbgSprite() {
      if (!progSprite) return { err: "no program" };
      const loc = {};
      for (const a of ["aPos", "aUV", "aTint", "aFog", "aDepth"]) loc[a] = gl.getAttribLocation(progSprite, a);
      const enabled = [];
      gl.bindVertexArray(spriteVAO);
      for (let i = 0; i < 6; i++) enabled.push([i,
        gl.getVertexAttrib(i, gl.VERTEX_ATTRIB_ARRAY_ENABLED),
        gl.getVertexAttrib(i, gl.VERTEX_ATTRIB_ARRAY_SIZE),
        gl.getVertexAttrib(i, gl.VERTEX_ATTRIB_ARRAY_STRIDE),
        gl.getVertexAttribOffset(i, gl.VERTEX_ATTRIB_ARRAY_POINTER)]);
      gl.bindVertexArray(null);
      return { loc, enabled, v0: Array.from(verts.slice(0, 13)), err: gl.getError() };
    },
    flashScreen() { hudFlash = 0.35; },
    get ok() { return ok; }, get failed() { return failed; }, get reason() { return reason; },
    get W() { return W; }, get H() { return H; }, get scale() { return scale; },
  };
})();


/* ==== 42_render.js ================================================== */
/* ============================================================================
 * MODULE: RENDERER / FACADE
 * Chooses between the WebGL2 and software renderers and presents one API to
 * the rest of the engine. A canvas can only ever hold one context type, so
 * each renderer owns its own canvas and this module swaps which is visible.
 *
 * Selection: settings.renderer = "auto" | "webgl" | "software".
 * "auto" tries WebGL2 once and falls back permanently if it fails.
 * ========================================================================== */
RR.R = (function () {
  let active = null, announced = false;

  function want() {
    const w = RR.settings.renderer || "auto";
    if (w === "software") return "software";
    return "webgl";
  }
  function show(which) {
    const g = RR.U.el("viewgl"), s = RR.U.el("view");
    g.style.display = which === "webgl" ? "block" : "none";
    s.style.display = which === "webgl" ? "none" : "block";
  }
  function select() {
    const w = want();
    if (w === "webgl") {
      if (RR.RGL.ok || (!RR.RGL.failed && RR.RGL.init())) {
        if (active !== RR.RGL) { active = RR.RGL; show("webgl"); RR.RGL.resize(); }
        return active;
      }
      if (!announced && RR.settings.renderer === "webgl") {
        announced = true;
        RR.U.toast("WebGL unavailable — using software renderer");
      }
    }
    if (active !== RR.RSoft) { active = RR.RSoft; show("software"); RR.RSoft.init(); }
    return active;
  }

  return {
    init() { select(); },
    resize() { const r = select(); if (r) r.resize(); RR.VM.resize(r.W, r.H); },
    draw(S) {
      const r = select();
      if (!r) return;
      const okDraw = r.draw(S);
      if (okDraw === false && r === RR.RGL) {          /* GL died mid-frame */
        RR.U.toast("Renderer fell back to software");
        active = null; select(); RR.RSoft.draw(S);
      }
    },
    clearBlack() { const r = select(); if (r) r.clearBlack(); RR.VM.clear(); },
    flashScreen() { if (active) active.flashScreen(); },
    setQuality(q) { RR.settings.quality = q; this.resize(); },
    setRenderer(mode) {
      RR.settings.renderer = mode;
      RR.saveSettings();
      active = null;
      this.resize();
      if (RR.RGL.dropMap) RR.RGL.dropMap();
    },
    readbackStats() { const r = select(); return r && r.readbackStats ? r.readbackStats() : { lit: 0, avg: 0 }; },
    get name() { return active ? active.name : "none"; },
    get available() { return { webgl: RR.RGL.ok || !RR.RGL.failed, software: true }; },
    get glReason() { return RR.RGL.reason; },
    get W() { return active ? active.W : 0; },
    get H() { return active ? active.H : 0; },
    get scale() { return active ? active.scale : 1; },
  };
})();


/* ==== 45_world.js =================================================== */
/* ============================================================================
 * MODULE: WORLD
 * Turns a map definition (ASCII grid) into a runtime level: span geometry,
 * sliding doors, spawn tables, pickups, static lights and a baked lightmap.
 * Also owns height-aware line of sight and the BFS flow fields the AI uses.
 * ========================================================================== */
RR.World = (function () {
  const G = RR.Geo;
  const C_DOOR = 43;

  function packColor(hexs) {
    const v = parseInt(hexs.slice(1), 16);
    return RR.Assets.pack((v >> 16) & 255, (v >> 8) & 255, v & 255, 255);
  }
  function rgb(hexs) {
    const v = parseInt((hexs || "#ffffff").slice(1), 16);
    return [((v >> 16) & 255) / 255, ((v >> 8) & 255) / 255, (v & 255) / 255];
  }
  /* Light colours are tints, not magnitudes: normalise so a dark-looking hex
     still lights the room, it just lights it in that hue. */
  function tint(hexs, dflt, sat) {
    const c = rgb(hexs || dflt || "#ffffff");
    const m = Math.max(c[0], c[1], c[2], 0.001);
    const k = sat == null ? 0.55 : sat;      /* pull back toward white so a
       theme reads as tinted rather than monochrome */
    return [1 - (1 - c[0] / m) * k, 1 - (1 - c[1] / m) * k, 1 - (1 - c[2] / m) * k];
  }

  /* ---------------------------------------------------------------- build */
  function build(def) {
    if (!def || !def.grid || !def.grid.length) return null;
    const h = def.grid.length, w = def.grid[0].length;
    const n = w * h;
    const cells = new Uint8Array(n);          // char code, or 46 for floor
    const tile = new Uint8Array(n);           // texture tile index
    const lo1 = new Float32Array(n), hi1 = new Float32Array(n);
    const lo2 = new Float32Array(n), hi2 = new Float32Array(n);
    const flags = new Uint8Array(n);          // 1 move, 2 shot, 4 sight, 8 full, 16 door, 32 twoSpan
    const doorOpen = new Float32Array(n), doorHold = new Float32Array(n), doorAxis = new Uint8Array(n);
    const spawns = { player: [], enemy: [], zombie: [], dm: [], teamA: [], teamB: [] };
    const checkpoints = [];
    const items = [], lampCells = [];
    let exit = null;

    for (let y = 0; y < h; y++) {
      const row = def.grid[y];
      for (let x = 0; x < w; x++) {
        const ch = row[x] || "#";
        const i = y * w + x;
        const gd = G.byChar[ch];
        if (gd) {
          cells[i] = gd.code; tile[i] = gd.tile;
          lo1[i] = gd.spans[0][0]; hi1[i] = gd.spans[0][1];
          if (gd.spans[1]) { lo2[i] = gd.spans[1][0]; hi2[i] = gd.spans[1][1]; flags[i] |= 32; }
          else { lo2[i] = -1; hi2[i] = -1; }
          flags[i] |= (gd.blocksMove ? 1 : 0) | (gd.blocksShot ? 2 : 0) | (gd.blocksSight ? 4 : 0) |
                      (gd.full ? 8 : 0) | (gd.door ? 16 : 0);
          continue;
        }
        cells[i] = G.FLOOR; lo2[i] = -1; hi2[i] = -1;
        switch (ch) {
          case "P": spawns.player.push([x + 0.5, y + 0.5]); break;
          case "E": spawns.enemy.push([x + 0.5, y + 0.5]); break;
          case "Z": spawns.zombie.push([x + 0.5, y + 0.5]); break;
          case "m": spawns.dm.push([x + 0.5, y + 0.5]); break;
          case "1": spawns.teamA.push([x + 0.5, y + 0.5]); break;
          case "2": spawns.teamB.push([x + 0.5, y + 0.5]); break;
          case "X": exit = { x: x + 0.5, y: y + 0.5 }; break;
          /* Checkpoints are numbered by reading order, which is stable across
             a reload and matches the 1,2,3… the editor shows you. */
          case "C": checkpoints.push({ x: x + 0.5, y: y + 0.5, n: checkpoints.length + 1, cell: i }); break;
          case "s": items.push({ kind: "smg", x: x + 0.5, y: y + 0.5 }); break;
          case "g": items.push({ kind: "shotgun", x: x + 0.5, y: y + 0.5 }); break;
          case "a": items.push({ kind: "ammo", x: x + 0.5, y: y + 0.5 }); break;
          case "A": items.push({ kind: "armor", x: x + 0.5, y: y + 0.5 }); break;
          case "K": items.push({ kind: "rocket", x: x + 0.5, y: y + 0.5 }); break;
          case "*": lampCells.push([x + 0.5, y + 0.5]); break;
          default: break;
        }
      }
    }
    for (let i = 0; i < n; i++) {
      if (!(flags[i] & 16)) continue;
      doorAxis[i] = G.doorAxis(cells, w, h, i % w, (i / w) | 0);
    }

    const themeId = def.theme || "security";
    const theme = RR.Content.theme(themeId) || RR.CORE.themes.security;
    const map = {
      id: def._full || def.id, def, w, h, n, cells, tile, lo1, hi1, lo2, hi2, flags,
      doorOpen, doorHold, doorAxis, spawns, items, exit, checkpoints,
      theme, themeId, atlas: RR.Assets.atlas(themeId, theme), normals: RR.Assets.normals(themeId, theme),
      floorFlat: packColor(theme.floor || "#202020"),
      ceilFlat: packColor(theme.ceil || "#101010"),
      fogRGB: rgb(theme.fog || "#05070c"),
      ambRGB: tint(theme.ambient || theme.fog, "#20262f", 0.5),
      objective: def.objective || "",
      lights: [], lightR: null, lightG: null, lightB: null,
      decalFloor: null, decalWall: Object.create(null), decalCount: 0,
      _bfsQ: new Int32Array(n + 4), _dist: new Int16Array(n),
      _rev: 0,
    };

    /* --- static lights: explicit '*' lamps, plus mod-declared lights ------ */
    const lampCol = tint(theme.lampColor || theme.accent, "#ffd8a0", 0.7);
    const lampI = theme.lampPower == null ? 1.0 : theme.lampPower;
    for (const p of lampCells)
      map.lights.push({ x: p[0], y: p[1], z: 0.86, r: lampCol[0], g: lampCol[1], b: lampCol[2],
        rad: 7.0, power: lampI, flicker: 0, static: true });
    if (Array.isArray(def.lights)) {
      for (const L of def.lights.slice(0, 48)) {
        const c = tint(L.color || theme.lampColor, "#ffd8a0");
        map.lights.push({ x: (L.x || 0) + 0.5, y: (L.y || 0) + 0.5, z: L.z == null ? 0.85 : L.z,
          r: c[0], g: c[1], b: c[2], rad: L.radius || 7, power: L.power == null ? 1 : L.power,
          flicker: L.flicker || 0, static: true });
      }
    }
    /* If a map ships no lights at all, scatter a few so it is not pitch dark
       under the lit renderers. Purely a fallback for older mods. */
    if (!map.lights.length) autoLights(map, lampCol, lampI);

    bakeLight(map);

    if (!spawns.player.length) {
      for (let i = 0; i < n && !spawns.player.length; i++)
        if (!(flags[i] & 1)) spawns.player.push([(i % w) + 0.5, ((i / w) | 0) + 0.5]);
    }
    map.decalFloor = new Uint8Array(w * h * 16);   // 4x4 stain texels per cell
    return map;
  }

  /* Place lamps on a coarse lattice wherever there is open floor, so legacy

    const step = 5;

        for (let dy = -1; dy <= 1 && !best; dy++) for (let dx = -1; dx <= 1; dx++) {
          const cx = x + dx, cy = y + dy;

          if (map.flags[cy * map.w + cx] & 1) continue;

  /* --------------------------------------------------------------- queries */

    if (f & 16) return map.doorOpen[i] < 0.72;

    const r2 = rad * rad;

        const nx = x < cx ? cx : (x > cx + 1 ? cx + 1 : x);
        const ny = y < cy ? cy : (y > cy + 1 ? cy + 1 : y);

    let moved = false;
    if (dx && canStand(map, a.x + dx, a.y, r)) { a.x += dx; moved = true; }
    if (dy && canStand(map, a.x, a.y + dy, r)) { a.y += dy; moved = true; }
    /* last resort: slide along the wall at reduced speed so grazing a corner

    if (!moved) {

      else if (dy && canStand(map, a.x, a.y + dy * h, r)) { a.y += dy * h; moved = true; }
    }

  }

  /* Grid traversal at a fixed height. `z` lets the same routine answer
     "can I see you" (eye height) and "can I shoot you" (bullet height). */
  function losZ(map, x0, y0, x1, y1, z, ignoreDoors) {
    let dx = x1 - x0, dy = y1 - y0;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.0001) return true;

    const ddx = dx === 0 ? 1e30 : Math.abs(1 / dx), ddy = dy === 0 ? 1e30 : Math.abs(1 / dy);

      else { if (sy > dist) return true; sy += ddy; cy += stepY; }

      if (z >= map.lo1[i] && z <= map.hi1[i]) return false;

  /* ---------------------------------------------------------------- doors */
  function updateDoors(map, actors, dt) {
    const w = map.w;

      if (!(map.flags[i] & 16)) continue;

  }

  /* ---------------------------------------------------------------- decals */
  const DEC = 4;   // stain texels per cell edge
  function addFloorDecal(map, x, y, strength, radius) {
    if (!map.decalFloor) return;

    const x0 = Math.max(0, ((x - rad) * DEC) | 0), x1 = Math.min(map.w * DEC - 1, ((x + rad) * DEC) | 0);
    const y0 = Math.max(0, ((y - rad) * DEC) | 0), y1 = Math.min(map.h * DEC - 1, ((y + rad) * DEC) | 0);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {

  function nearestStandable(map, x, y, rad) {

      for (let i = 0; i < ring * 8; i++) {
        const ang = (i / (ring * 8)) * M.TAU;
        const px = x + Math.cos(ang) * ring * 0.5;
        const py = y + Math.sin(ang) * ring * 0.5;
        if (px < 0.5 || py < 0.5 || px > map.w - 0.5 || py > map.h - 0.5) continue;

  function anyOpenCell(map, rng, rad) {

  /* ------------------------------------------------------------ validation */

  const MODE_NEEDS = {
    campaign: { player: 1, exit: true, want: { enemy: 1 }, label: "Campaign level" },
    ffa:      { dm: 4, label: "Free For All arena" },
    tdm:      { teamA: 2, teamB: 2, label: "Team Deathmatch arena" },
    horde:    { player: 1, zombie: 2, label: "Zombie Horde map" },
  };
  function validateMap(def, mode) {
    const out = { ok: true, errors: [], warnings: [], stats: {} };
    const map = build(def);
    if (!map) { out.ok = false; out.errors.push("Map has no grid."); return out; }
    if (!map.spawns.player.length && !map.spawns.dm.length && !map.spawns.teamA.length) {
      out.ok = false; out.errors.push("No player spawn (P), deathmatch spawn (m) or team spawn (1/2).");
    }

    const field = buildField(map, start[0] | 0, start[1] | 0);

    };

    check(map.spawns.zombie, "zombie spawn(s)");

    check(map.spawns.teamA, "team A spawn(s)");

    }

    for (let i = 0; i < map.n; i++) {

    /* --- game-type requirements --------------------------------------- */
    const need = MODE_NEEDS[mode];
    if (need) {
      const have = {
        player: map.spawns.player.length, enemy: map.spawns.enemy.length,
        zombie: map.spawns.zombie.length, dm: map.spawns.dm.length,
        teamA: map.spawns.teamA.length, teamB: map.spawns.teamB.length,
      };
      const NAME = { player: "player spawn (P)", enemy: "enemy spawn (E)", zombie: "zombie spawn (Z)",
        dm: "deathmatch spawn (m)", teamA: "team A spawn (1)", teamB: "team B spawn (2)" };
      for (const k in need) {
        if (k === "label" || k === "want" || k === "exit") continue;
        if (have[k] < need[k]) {
          out.ok = false;
          out.errors.push(need.label + " needs at least " + need[k] + " " + NAME[k] +
            " \u2014 this map has " + have[k] + ".");
        }
      }
      if (need.exit && !map.exit) {
        out.ok = false;
        out.errors.push(need.label + " needs an exit (X) for the player to finish on.");
      }
      for (const k in (need.want || {}))
        if (have[k] < need.want[k]) out.warnings.push(need.label + " usually wants at least " +
          need.want[k] + " " + NAME[k] + "; this map has " + have[k] + ".");
      out.stats.gameType = need.label;
    }

    let doors = 0;
    for (let i = 0; i < map.n; i++) if (map.flags[i] & 16) doors++;
    out.stats = { w: map.w, h: map.h, open, unreachable, doors,
      enemies: map.spawns.enemy.length, zombies: map.spawns.zombie.length,
      dm: map.spawns.dm.length, teamA: map.spawns.teamA.length, teamB: map.spawns.teamB.length,
      items: map.items.length, exit: !!map.exit, lights: map.lights.length,
      seeOverProps: seeOver, twoSpanCells: twoSpan };
    return out;
  }

  return { build, cellAt, idx, solidAt, sightBlocked, shotBlocked, blocksAtZ, walkableStatic,
    canStand, move, los, losZ, doorSlabAt, updateDoors, openAllDoors,
    fieldFor, buildField, stepDir, farFrom, anyOpenCell, nearestStandable, validateMap, MODE_NEEDS, resetBudget,
    lightAt, bakeLight, addFloorDecal, floorDecalAt, addWallDecal, wallDecalTile,
    isWallCode: (c) => G.isSolidCode(c), C_DOOR, DEC, WD };
})();


/* ==== 50_input.js =================================================== */
/* ============================================================================
 * MODULE: INPUT
 * Keyboard + mouse + multitouch + Gamepad API, all normalised into one
 * `RR.In` state object the sim reads. Listeners are attached exactly once at
 * boot, so opening/closing menus can never duplicate them.
 * ========================================================================== */
RR.In = (function () {
  const st = {
    mx: 0, my: 0, mz: 0,          // strafe, forward, turn (analog -1..1)
    look: 0, lookY: 0,            // accumulated look delta this frame
    fire: false, firePress: false, ads: false,
    reload: false, knife: false, use: false,
    pause: false, score: false,
    slot: -1, wheel: 0,
    anyInput: false,
  };
  const keys = Object.create(null);
  let padVisible = false, locked = false, initDone = false;
  let touchEnabled = false;
  /* TESTS hook: when set, these fields are merged over the sampled state so
     the suite can drive the real simulation without a human at the controls. */
  let scripted = null;

  /* ------------------------------------------------------------- keyboard */
  const KMAP = {
    KeyW: "fwd", ArrowUp: "fwd", KeyS: "back", ArrowDown: "back",
    KeyA: "left", KeyD: "right", KeyQ: "left", KeyE: "use",
    ArrowLeft: "turnL", ArrowRight: "turnR",
    Space: "fire", KeyR: "reload", KeyF: "knife",
    Digit1: "w1", Digit2: "w2", Digit3: "w3", Digit4: "w4",
    Escape: "pause", Enter: "pause", NumpadEnter: "pause", Tab: "score", ShiftLeft: "run", KeyM: "map",
    KeyC: "ads", ShiftRight: "ads",
  };
  function onKey(e, down) {
    const act = KMAP[e.code];
    if (!act) return;
    if (down && !keys[act]) {
      if (act === "reload") st.reload = true;
      if (act === "knife") st.knife = true;
      if (act === "use") st.use = true;
      if (act === "fire") st.firePress = true;
      if (act === "pause") {
        st.pause = true;
        /* Enter and Esc TOGGLE the pause. While paused the simulation is not
           ticking, so nothing would ever consume st.pause and the key could
           only ever pause, never resume — you had to reach for the Resume
           button. Un-pausing is handled here for that reason. */
        if (RR.mode === "play" && RR.paused && RR.UI && RR.UI.resume) { RR.UI.resume(); st.pause = false; }
      }
      if (act === "w1") st.slot = 0;
      if (act === "w2") st.slot = 1;
      if (act === "w3") st.slot = 2;
      if (act === "w4") st.slot = 3;
      if (act === "map") {
        RR.settings.minimap = !RR.settings.minimap;
        RR.saveSettings();
        RR.U.toast("Minimap " + (RR.settings.minimap ? "on" : "off"));
      }
    }
    keys[act] = down;
    st.anyInput = true;
    if (RR.mode === "play" && !RR.paused) {
      if (e.code === "Tab" || e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    }
    /* Enter must pause and un-pause, not press whichever menu button happens
       to still hold focus behind the pause screen. */
    if (RR.mode === "play" && act === "pause" && (e.code === "Enter" || e.code === "NumpadEnter")) e.preventDefault();
    if (e.code === "Tab") e.preventDefault();
  }

  /* ---------------------------------------------------------------- mouse */
  function wantLock() {
    return RR.mode === "play" && !RR.paused && !RR.U.isHandheld();
  }
  function requestLock() {
    const c = RR.U.el("app");
    if (!c || !c.requestPointerLock || document.pointerLockElement) return;
    /* unadjustedMovement bypasses OS pointer acceleration, which is what makes
       desktop aim consistent. Not every browser supports the options form, and
       in some it returns a promise that rejects — both fall back to plain. */
    try {
      const r = c.requestPointerLock({ unadjustedMovement: true });
      if (r && r.catch) r.catch(() => { try { c.requestPointerLock(); } catch (e) {} });
    } catch (e) { try { c.requestPointerLock(); } catch (e2) {} }
  }
  function exitLock() { try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {} }

  /* ---------------------------------------------------------------- touch ---
   * ON-SCREEN CONTROLS — rebuilt from scratch.
   *
   * WHY THIS IS BUILT ON TouchEvent AND NOT PointerEvent
   * ----------------------------------------------------
   * The previous version listened only for pointerdown / pointermove on the
   * pad layer. On a real touch device the pointer event the browser
   * synthesises from a touch can arrive with clientX/clientY of 0,0 while the
   * underlying TouchEvent carries the true coordinates. When that happened the
   * stick anchored itself at the top-left CORNER of the screen, so every later
   * move measured zero deflection and the controls did precisely nothing — in
   * BOTH orientations, portrait and landscape alike. Rotating the device and
   * rotating back only ever appeared to fix it because orientationchange tore
   * the stick state down and rebuilt it; the very next touch could break the
   * same way again. That is the bug behind "vertical doesn't work" and behind
   * "after I die I have to flip the camera twice".
   *
   * So the pad is driven by NATIVE TOUCHES, which always carry coordinates,
   * plus a mouse path so the same controls stay usable on a desktop. No
   * pointer events are involved anywhere in this layer.
   *
   * LAYOUT
   * ------
   * Every control is positioned and sized by layout() from the live viewport,
   * so portrait and landscape are both first-class. Sizes derive from the
   * SHORT edge — identical for 390x844 and 844x390 — and are additionally
   * capped by the width the bottom row actually has, so the same arrangement
   * holds at any aspect ratio without the right-hand cluster ever landing on
   * top of the left stick.
   *
   * MAPPING — deliberately identical to the keyboard/mouse scheme
   * ------------------------------------------------------------
   *   left stick    W / A / S / D    forward, strafe left, back, strafe right
   *   right stick   mouse look       turn
   *   FIRE          Space / left click
   *   AIM           Shift / right click
   *   RELOAD        R
   *   USE           E
   *   KNIFE         F
   *   1-4           weapon slots
   * ------------------------------------------------------------------------ */
  const sticks = { L: null, R: null };
  /* Monotonic count of "a touch made something happen". One-shot input flags
     are cleared by the game loop within a frame, so a test cannot read them
     reliably; this counter can. */
  let activity = 0;
  const btnState = Object.create(null);
  /* Live grabs, keyed by touch identifier (or the string "mouse" on desktop).
     A grab is either a button press or an analog stick. */
  const grabs = Object.create(null);
  const BTNS = [
    ["bFire", "fire"], ["bAds", "ads"], ["bReload", "reload"], ["bKnife", "knife"],
    ["bUse", "use"], ["bPause", "pause"],
    ["wb0", "w1"], ["wb1", "w2"], ["wb2", "w3"], ["wb3", "w4"],
  ];
  /* A press that travels further than this stops being a press and becomes a
     stick: people plant a thumb on a button and slide, and that must steer. */
  const SLIDE = 24;

  function viewW() { return window.innerWidth || document.documentElement.clientWidth || 1; }
  function viewH() { return window.innerHeight || document.documentElement.clientHeight || 1; }

  let padLayout = null, homeL = null, homeR = null, stickSize = 120, padTop = 0;
  /* Stick throw scales with the screen: a fixed pixel count is a long reach on
     a small phone and twitchy on a tablet. */
  function stickRadius() { return M.clamp(stickSize * 0.46, 36, 88); }
  function padLive() { return padVisible && RR.mode === "play" && !RR.paused; }

  /* ------------------------------------------------------------- layout --- */
  let safeProbe = null;
  function safeInsets() {
    if (!safeProbe) {
      safeProbe = document.createElement("div");
      safeProbe.style.cssText = "position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;" +
        "padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);";
      document.body.appendChild(safeProbe);
    }
    const cs = getComputedStyle(safeProbe);
    return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
             b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  }

  function place(id, cx, cy, w, h) {
    const el = RR.U.el(id);
    if (!el) return null;
    const hh = h == null ? w : h;
    el.style.width = Math.round(w) + "px";
    el.style.height = Math.round(hh) + "px";
    el.style.left = Math.round(cx - w / 2) + "px";
    el.style.top = Math.round(cy - hh / 2) + "px";
    el.style.right = "auto";
    el.style.bottom = "auto";
    return { left: cx - w / 2, top: cy - hh / 2, right: cx + w / 2, bottom: cy + hh / 2 };
  }

  /* forceW/forceH let the test suite drive the layout at sizes we cannot
     actually resize the window to. */
  function layout(forceW, forceH) {
    const W = forceW || viewW(), H = forceH || viewH();
    const sa = forceW ? { t: 0, r: 0, b: 0, l: 0 } : safeInsets();
    const availW = W - sa.l - sa.r, availH = H - sa.t - sa.b;
    const S = Math.min(availW, availH);

    const m = M.clamp(S * 0.035, 10, 22);
    const g = M.clamp(S * 0.025, 7, 12);

    /* The bottom row is [stick] gap [fire] gap [stick]. Solving the stick size
       against the width that row ACTUALLY has is what makes portrait work: a
       size picked only from the short edge overflows a narrow screen and puts
       the fire button through the left stick. */
    const rowBudget = availW - 2 * m - 2 * g;
    const stick = M.clamp(Math.min(S * 0.30, rowBudget / 2.62), 70, 132);
    const fire  = M.clamp(stick * 0.72, 54, 104);
    const btn   = M.clamp(stick * 0.52, 42, 76);
    const pb    = M.clamp(S * 0.115, 36, 54);
    const wbh   = M.clamp(S * 0.115, 34, 50);
    const wgap  = M.clamp(S * 0.018, 5, 10);
    /* The weapon row must never grow into the pause button on either side. */
    const wRoom = availW - 2 * (m + pb + g);
    let wbw = M.clamp(S * 0.155, 44, 70);
    if (wbw * 4 + wgap * 3 > wRoom) wbw = Math.max(38, (wRoom - wgap * 3) / 4);

    const rightX = (d) => W - sa.r - d;
    const bottomY = (d) => H - sa.b - d;

    /* --- the two thumbs: one stick in each bottom corner --- */
    const Lc = { x: sa.l + m + stick / 2, y: bottomY(m + stick / 2) };
    const Rc = { x: rightX(m + stick / 2), y: bottomY(m + stick / 2) };
    /* --- fire: between the sticks, lifted just clear of the bottom edge --- */
    const Fc = { x: rightX(m + stick + g + fire / 2), y: bottomY(m + fire / 2 + stick * 0.10) };
    /* --- aim at 11 o'clock from fire, but never over the left stick --- */
    const off = (fire + btn) / 2 + g;
    const leftStickRight = Lc.x + stick / 2;
    const minAx = leftStickRight + g + btn / 2;
    const Ac = { x: Math.max(Fc.x - off * 0.55, minAx), y: Fc.y - off * 1.05 };
    /* --- knife directly above the look stick --- */
    const Kc = { x: rightX(m + btn / 2), y: bottomY(m + stick + g + btn / 2) };

    /* Reload and use run along the bottom inboard of fire when there is room;
       on a narrow screen that would sit them over the left stick, so they
       stack up the right-hand column above the knife instead. */
    let RLc = { x: Fc.x - (fire / 2 + g + btn / 2), y: bottomY(m + btn / 2) };
    let Uc  = { x: RLc.x - (btn + g), y: RLc.y };
    if (Uc.x - btn / 2 < leftStickRight + g) {
      RLc = { x: Kc.x, y: Kc.y - (btn + g) };
      Uc  = { x: RLc.x, y: RLc.y - (btn + g) };
    }

    /* --- pause tucks under the top-right corner --- */
    const pauseC = { x: rightX(m + pb / 2), y: sa.t + M.clamp(S * 0.10, 32, 52) + pb * 0.39 };

    /* --- weapons along the top centre, clear of the Controls toggle ---
       Browsers apply "touch adjustment" and will snap a finger to a nearby
       <button>, so a row that merely does not overlap the toggle still gets
       stolen by it on a small screen — and stealing that tap switches the
       whole pad off. Keep a real gap. */
    /* Park the Controls toggle just under the top HUD bar. Pinned to the very
       top it collided with the HUD pills on a narrow portrait screen, which
       both looked broken and put a real button under a tap target. */
    const tgl = RR.U.el("padToggle");
    if (tgl && !forceW) {
      const bar = RR.U.el("hudTop");
      const barBottom = bar ? (bar.getBoundingClientRect().bottom || 0) : 0;
      tgl.style.top = Math.round(Math.max(sa.t + 6, barBottom + 6)) + "px";
    }
    const tglBottom = tgl && !forceW ? (tgl.getBoundingClientRect().bottom || 0) : (sa.t + 38);
    /* The weapon row is centred, so on a narrow screen its left end runs under
       the minimap in the top-left corner. If they would overlap horizontally,
       drop the row below the minimap instead of through it. */
    const rowTotal = 4 * wbw + 3 * wgap;
    const rowLeft = W / 2 - rowTotal / 2;
    let minimapBottom = 0;
    if (!forceW) {
      const mm = RR.U.el("minimapWrap");
      if (mm && mm.offsetParent !== null) {
        const r = mm.getBoundingClientRect();
        if (r.width > 0 && rowLeft < r.right + 6) minimapBottom = r.bottom;
      }
    }
    const wtY = Math.max(sa.t + M.clamp(S * 0.11, 34, 56), tglBottom + g * 2 + 6, minimapBottom + g) + wbh / 2;

    const boxes = {};
    boxes.stickL = place("stickL", Lc.x, Lc.y, stick);
    boxes.stickR = place("stickR", Rc.x, Rc.y, stick);
    boxes.bFire  = place("bFire", Fc.x, Fc.y, fire);
    boxes.bAds   = place("bAds", Ac.x, Ac.y, btn);
    boxes.bKnife = place("bKnife", Kc.x, Kc.y, btn);
    boxes.bReload= place("bReload", RLc.x, RLc.y, btn);
    boxes.bUse   = place("bUse", Uc.x, Uc.y, btn);
    boxes.bPause = place("bPause", pauseC.x, pauseC.y, pb, pb * 0.78);

    const row = RR.U.el("wbtns") || document.querySelector(".wbtns");
    if (row) {
      const kids = row.children;
      const total = kids.length * wbw + (kids.length - 1) * wgap;
      const rl = W / 2 - total / 2, rt = wtY - wbh / 2;
      row.style.left = Math.round(rl) + "px";
      row.style.top = Math.round(rt) + "px";
      row.style.right = "auto"; row.style.bottom = "auto";
      row.style.transform = "none";
      row.style.gap = Math.round(wgap) + "px";
      for (let i = 0; i < kids.length; i++) {
        kids[i].style.width = Math.round(wbw) + "px";
        kids[i].style.height = Math.round(wbh) + "px";
        boxes["wb" + i] = { left: rl + i * (wbw + wgap), top: rt,
                            right: rl + i * (wbw + wgap) + wbw, bottom: rt + wbh };
      }
    }

    /* Everything above the sticks' band is chrome. A touch there must not yank
       the view, so sticks are only born below this line. Derived, not guessed,
       so it is correct in portrait and landscape without a special case. */
    const wbBottom = boxes.wb0 ? boxes.wb0.bottom : (sa.t + 60);
    padTop = Math.max(wbBottom, boxes.bPause ? boxes.bPause.bottom : 0) + g;

    padLayout = { W, H, S, stick, fire, btn, m, g, padTop, boxes };
    homeL = Lc; homeR = Rc; stickSize = stick;
    return padLayout;
  }

  /* --------------------------------------------------------- hit testing --- */
  /* Buttons are deliberate targets and win the hit test. The layout keeps them
     out of the stick rings, so a thumb planted to move can never land on one. */
  function hitButton(x, y) {
    for (let i = 0; i < BTNS.length; i++) {
      const el = RR.U.el(BTNS[i][0]);
      if (!el || el.offsetParent === null) continue;
      const r = el.getBoundingClientRect();
      if (r.width <= 0) continue;
      const pad = 10;             /* fingers are wide and imprecise */
      if (x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad)
        return { el, act: BTNS[i][1] };
    }
    return null;
  }
  /* Which stick a touch belongs to. Anything in the lower band is a thumb;
     the top strip belongs to the HUD and the weapon row. */
  function zoneOf(x, y) {
    if (y < padTop) return null;
    return x < viewW() * 0.5 ? "L" : "R";
  }

  /* -------------------------------------------------------------- visual --- */
  function stickEl(which) { return RR.U.el(which === "L" ? "stickL" : "stickR"); }
  function setStickVisual(which, dx, dy, ox, oy) {
    const el = stickEl(which);
    if (!el) return;
    if (ox != null) {
      const w = el.offsetWidth || stickSize, h = el.offsetHeight || stickSize;
      el.style.left = Math.round(ox - w / 2) + "px";
      el.style.top = Math.round(oy - h / 2) + "px";
      el.style.right = "auto";
      el.style.bottom = "auto";
      el.classList.add("live");
    }
    const knob = el.firstElementChild;
    const throw_ = stickSize * 0.26;
    if (knob) knob.style.transform = "translate(" + (dx * throw_).toFixed(1) + "px," + (dy * throw_).toFixed(1) + "px)";
  }
  function resetStickVisual(which) {
    const el = stickEl(which);
    if (!el) return;
    const home = which === "L" ? homeL : homeR;
    if (home) {
      el.style.left = Math.round(home.x - stickSize / 2) + "px";
      el.style.top = Math.round(home.y - stickSize / 2) + "px";
    } else { el.style.left = ""; el.style.top = ""; }
    el.style.right = "auto"; el.style.bottom = "auto";
    el.classList.remove("live");
    const knob = el.firstElementChild;
    if (knob) knob.style.transform = "";
  }

  /* --------------------------------------------------------------- sticks --- */
  /* Any stick whose owning grab has vanished is free. Called on every touch
     down and every sampled frame, so a lost touchend can cost at most one
     frame instead of the rest of the match. */
  function reclaim() {
    for (const which of ["L", "R"]) {
      const s = sticks[which];
      if (s && !grabs[s.id]) { sticks[which] = null; resetStickVisual(which); }
    }
  }
  function beginStick(which, id, x, y) {
    activity++;
    sticks[which] = { id, ox: x, oy: y, dx: 0, dy: 0 };
    grabs[id] = { kind: "stick", which };
    setStickVisual(which, 0, 0, x, y);
  }
  function updateStick(which, cx, cy) {
    const s = sticks[which];
    if (!s) return;
    const R = stickRadius();
    let dx = (cx - s.ox) / R, dy = (cy - s.oy) / R;
    const mag = Math.hypot(dx, dy);
    if (mag > 1) {
      dx /= mag; dy /= mag;
      /* Past full deflection the origin trails the finger, so a long drag
         never runs out of stick and a wandering thumb keeps steering. */
      s.ox = cx - dx * R; s.oy = cy - dy * R;
      s.dx = dx; s.dy = dy;
      setStickVisual(which, dx, dy, s.ox, s.oy);
      return;
    }
    s.dx = dx; s.dy = dy;
    setStickVisual(which, dx, dy);
  }

  /* --------------------------------------------------------------- buttons --- */
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function pressButton(act) {
    activity++;
    btnState[act] = true;
    buzz(act === "fire" ? 8 : 14);
    if (act === "ads" && !RR.settings.adsHold) btnState.adsToggle = !btnState.adsToggle;
    if (act === "reload") st.reload = true;
    if (act === "knife") st.knife = true;
    if (act === "use") st.use = true;
    if (act === "fire") st.firePress = true;
    if (act === "pause") st.pause = true;
    if (act === "w1") st.slot = 0;
    if (act === "w2") st.slot = 1;
    if (act === "w3") st.slot = 2;
    if (act === "w4") st.slot = 3;
    RR.Audio.resume();
  }
  function releaseButton(act) { btnState[act] = false; }

  /* ------------------------------------------------------ the three verbs ---
   * Every input path — touch or mouse — funnels through these, so there is
   * exactly one implementation of what a grab means.
   * ------------------------------------------------------------------------ */
  function grabDown(id, x, y) {
    reclaim();
    const b = hitButton(x, y);
    if (b) {
      grabs[id] = { kind: "btn", act: b.act, el: b.el, ox: x, oy: y };
      b.el.classList.add("hit");
      pressButton(b.act);
      return;
    }
    const side = zoneOf(x, y);
    if (!side) return;                      /* HUD strip: not a control */
    if (!sticks[side]) beginStick(side, id, x, y);
  }
  function grabMove(id, x, y) {
    const rec = grabs[id];
    if (!rec) return;
    if (rec.kind === "stick") { updateStick(rec.which, x, y); return; }
    /* a button press that travels far enough, or leaves the control, hands
       the finger to a stick rather than dropping it on the floor */
    const still = hitButton(x, y);
    const leftIt = !still || still.act !== rec.act;
    if (leftIt || Math.hypot(x - rec.ox, y - rec.oy) > SLIDE) {
      rec.el.classList.remove("hit");
      releaseButton(rec.act);
      delete grabs[id];
      const side = zoneOf(rec.ox, rec.oy) || (rec.ox < viewW() * 0.5 ? "L" : "R");
      reclaim();
      if (!sticks[side]) {
        /* Anchor where the finger STARTED so the travel already made counts.
           Anchoring at the current point throws the drag away. */
        beginStick(side, id, rec.ox, rec.oy);
        updateStick(side, x, y);
      }
    }
  }
  function grabUp(id) {
    const rec = grabs[id];
    delete grabs[id];
    if (rec) {
      if (rec.kind === "stick") {
        const s = sticks[rec.which];
        if (s && s.id === id) { s.dx = 0; s.dy = 0; sticks[rec.which] = null; resetStickVisual(rec.which); }
      } else if (rec.el) {
        rec.el.classList.remove("hit");
        releaseButton(rec.act);
      }
    }
    reclaim();
  }

  function clearTouch() {
    for (const id in grabs) delete grabs[id];
    sticks.L = null; sticks.R = null;
    resetStickVisual("L"); resetStickVisual("R");
    for (const k in btnState) btnState[k] = false;
    for (const b of BTNS) { const el = RR.U.el(b[0]); if (el) el.classList.remove("hit"); }
    const ads = RR.U.el("bAds"); if (ads) ads.classList.remove("latched");
  }

  /* ----------------------------------------------------- native listeners --- */
  /* TouchEvent carries reliable coordinates; that is the entire reason this
     layer exists in this form. changedTouches is the set that actually moved,
     so multitouch (move + look + fire at once) falls out for free. */
  function onTouchStart(e) {
    if (!padLive()) return;
    const ts = e.changedTouches;
    for (let i = 0; i < ts.length; i++) grabDown(ts[i].identifier, ts[i].clientX, ts[i].clientY);
    if (e.cancelable) e.preventDefault();
  }
  function onTouchMove(e) {
    if (!padLive()) return;
    const ts = e.changedTouches;
    for (let i = 0; i < ts.length; i++) grabMove(ts[i].identifier, ts[i].clientX, ts[i].clientY);
    if (e.cancelable) e.preventDefault();
  }
  function onTouchEnd(e) {
    const ts = e.changedTouches;

    if (e.cancelable) e.preventDefault();

     without a touchscreen. stopPropagation keeps a pad click from also asking
     for pointer lock on the app surface underneath. */
  function onMouseDown(e) {
    if (!padLive() || e.button !== 0) return;
    grabDown("mouse", e.clientX, e.clientY);
    e.preventDefault(); e.stopPropagation();
  }
  function onMouseMove(e) {
    if (!grabs.mouse) return;
    grabMove("mouse", e.clientX, e.clientY);
    e.preventDefault(); e.stopPropagation();
  }
  function onMouseUp(e) {
    if (!grabs.mouse) return;
    grabUp("mouse");

    if (!navigator.getGamepads) return;

      out.mx += dz(g.axes[0] || 0); out.my += -dz(g.axes[1] || 0);
      out.look += dz(g.axes[2] || 0) * 3.0 * RR.settings.lookSens * dt;

      const down = (n) => !!(B[n] && B[n].pressed);
      const edge = (n, key) => { const d = down(n); const was = padPrev[key]; padPrev[key] = d; return d && !was; };
      if (down(6)) out.ads = true;
      if (down(7) || down(0)) out.fire = true;
      if (edge(7, "rt") || edge(0, "a")) out.firePress = true;
      if (edge(2, "x")) out.reload = true;
      if (edge(1, "b")) out.knife = true;
      if (edge(3, "y")) out.use = true;
      if (edge(9, "start")) out.pause = true;
      if (edge(5, "rb")) out.wheel = 1;

    if (keys.ads) ads = true;
    if (keys.left) st.mx -= 1;
    if (keys.right) st.mx += 1;
    if (keys.fwd) st.my += 1;
    if (keys.back) st.my -= 1;
    if (keys.turnL) st.mz -= 1;
    if (keys.turnR) st.mz += 1;
    if (keys.fire) fire = true;

         reads as the player sliding on their own. */

      const dz = (v) => {
        const a = Math.abs(v);

        return M.sign(v) * ((a - DZ) / (1 - DZ));

         UP is a negative dy and has to become POSITIVE forward. */
      if (L) { st.mx += dz(L.dx); st.my += -dz(L.dy); }

         aim, and the old "push up to creep forward" behaviour on the look
         stick just walked you into walls while you were trying to aim. */

           centre give fine aim, the outer ring still turns fast. A flat linear
           stick is the single biggest reason touch aiming feels bad. */
        const rx = dz(R.dx);

      /* AIM = Shift / right click, honouring the hold-vs-toggle setting */

      const adsEl = RR.U.el("bAds");
      if (adsEl) adsEl.classList.toggle("latched", !RR.settings.adsHold && !!btnState.adsToggle);

    pollPad(g, dt);

    if (g.fire) fire = true;
    if (g.firePress) st.firePress = true;
    if (g.reload) st.reload = true;
    if (g.knife) st.knife = true;
    if (g.use) st.use = true;
    if (g.pause) st.pause = true;
    if (g.wheel) st.wheel += g.wheel;
    if (g.ads) ads = true;

    const m = Math.hypot(st.mx, st.my);
    if (m > 1) { st.mx /= m; st.my /= m; }
    st.fire = fire;
    st.ads = ads;
    st.turn = st.mz;
    if (scripted) for (const k in scripted) st[k] = scripted[k];

    st.firePress = false; st.reload = false; st.knife = false; st.use = false;

  /* ------------------------------------------------------------------ init */

     required `touchEnabled` — which was false on any non-touch device — so the
     controls never appeared during gameplay. */
