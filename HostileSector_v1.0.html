    if (plates) { plates.innerHTML = ""; lastPlateHtml = ""; }
    route = null;
  }
  return { init, resize, frame, clear, updateRoute, drawPlates, PING_FADE,
    /* firing lights you up on every other minimap for PING_FADE seconds */
    ping(a) { if (a && !a.isPlayer) a._mapPing = PING_FADE; },
    get route() { return route; } };
})();


/* ==== 85_ui.js ====================================================== */
/* ============================================================================
 * MODULE: UI
 * Every menu is a string of HTML swapped into one container, driven by ONE
 * delegated click listener bound once at boot. Opening the same screen twice
 * therefore cannot duplicate cards, controls or listeners.
 * ========================================================================== */
RR.UI = (function () {
  const el = RR.U.el, esc = RR.U.esc;
  let current = "main", boundOnce = false, pendingImport = null;

  function show(name, arg) {
    current = name;
    const m = el("menu");
    m.innerHTML = render(name, arg);
    m.classList.add("show");
    m.scrollTop = 0;
    el("edWrap").classList.remove("show");
    RR.In.refreshPadVisibility();
    /* Opening Online should put you IN a lobby, not in front of a form. It
       names you if you have no name, connects (to a real server if one is set,
       to the built-in one otherwise) and opens a room you can start on your
       own. Leaving for any other screen re-arms that. */
    if (name === "online" && RR.feature("online")) RR.Online.enterOnline();
    else RR.Online.resetAutoLobby();
  }
  function hide() { el("menu").classList.remove("show"); }
  function modal(html) { el("modalBox").innerHTML = html; el("modal").classList.add("show"); }
  function closeModal() { el("modal").classList.remove("show"); el("modalBox").innerHTML = ""; }

  const btn = (act, label, cls, arg) =>
    `<button class="btn ${cls || ""}" data-act="${act}"${arg != null ? ` data-arg="${esc(arg)}"` : ""}>${esc(label)}</button>`;
  const sel = (id, opts, val) =>
    `<select id="${id}">` + opts.map((o) => `<option value="${esc(o[0])}"${String(o[0]) === String(val) ? " selected" : ""}>${esc(o[1])}</option>`).join("") + "</select>";
  const row = (label, inner) => `<label class="row"><span>${esc(label)}</span>${inner}</label>`;
  const num = (id, v, min, max, step) => `<input type="number" id="${id}" value="${v}" min="${min}" max="${max}" step="${step || 1}">`;
  const range = (id, v, min, max, step) => `<input type="range" id="${id}" value="${v}" min="${min}" max="${max}" step="${step}">`;
  const toggle = (id, on, label) => `<button class="btn sm ${on ? "on" : ""}" data-act="toggle" data-arg="${id}">${esc(label || (on ? "ON" : "OFF"))}</button>`;

  const DIFFS = [["easy", "Easy"], ["medium", "Medium"], ["hard", "Hard"]];

  /* ------------------------------------------------------------- renderers */
  function render(name, arg) {
    switch (name) {
      case "main": return mainScreen();
      case "story": return storyScreen();
      case "brief": return briefScreen(arg);
      case "campaign": return campaignScreen();
      case "horde": return hordeScreen();
      case "dm": return dmScreen(arg || "ffa");
      case "settings": return settingsScreen();
      case "mods": return modsScreen();
      /* Switched off: RR.FEATURES.online. The screen itself is untouched below
         and renders normally the moment the flag comes back. */
      case "online": return RR.feature("online") ? onlineScreen() : mainScreen();
      case "help": return helpScreen();
      case "pause": return pauseScreen();
      case "end": return endScreenHtml(arg);
      case "inter": return interHtml(arg);
      default: return mainScreen();
    }
  }

  function mainScreen() {
    const probs = RR.Content.problems();
    const warn = (probs.missing.length ? `<div class="card" style="border-color:var(--bad)"><b style="color:var(--bad)">MOD REFERENCE WARNINGS</b><p class="note">${probs.missing.slice(0, 4).map(esc).join("<br>")}</p></div>` : "");
    return `<div class="wrap">
      <h1 class="logo">HOSTILE SECTOR<span class="l2">V<i>01</i>D</span><small>MOD ENGINE · v${esc(RR.VERSION)}</small></h1>
      ${warn}
      <div class="card">
        <h3>Single player</h3>
        <div class="grid g2 mainpick">
          ${btn("go", "Campaign", "pri", "campaign")}
          ${btn("go", "Zombie Horde", "", "horde")}
          ${btn("dm", "Free For All", "", "ffa")}
          ${btn("dm", "Team Deathmatch", "", "tdm")}
        </div>
      </div>
      <div class="card">
        <h3>Create &amp; connect</h3>
        <div class="grid g2 mainpick">
          ${btn("editor", "Map / Mod Editor", "")}
          ${btn("go", "Mods", "", "mods")}
          ${RR.feature("online") ? btn("go", "Online", "", "online") : ""}
          ${btn("go", "Settings", "", "settings")}
        </div>
      </div>
      <div class="card">
        <h3>Story</h3>
        <div class="grid g2 mainpick">
          ${btn("go", "📖 Storyline", "", "story")}
          ${btn("go", "How to mod", "", "help")}
        </div>
      </div>
      <p class="note center">${RR.Store.persistent ? "" : "Storage is unavailable in this context — progress and mods last for this session only.<br>"}
        Difficulty: <b>${esc(RR.settings.difficulty)}</b> · Quality: <b>${esc(RR.settings.quality)}</b></p>
    </div>`;
  }

  /* ------------------------------------------------------------- storyline */
  /* The premise, spelled out, plus where each act sits. Written to be read
     before you have played anything, so it sets up the turn without giving
     away the sectors it happens in. */
  function storyScreen() {
    const cam = RR.Content.campaign("core:main");
    const n = cam ? cam.levels.length : 16;
    const done = RR.Store.get("campaignDone", false);
    return `<div class="wrap">
      <h2>Storyline</h2>

      <div class="card" style="border-color:var(--acc)">
        <h3 style="color:var(--acc);margin-top:0">HOSTILE SECTOR: V01D</h3>
        <p class="note" style="color:var(--ink);font-size:13px;line-height:1.65">
        You are <b>SPECTRE-9</b>, a special operations agent dropped into hostile territory with no
        transponder, no backup and no way out until the job is done.<br><br>
        The target is an enemy compound deep inside their border that draws far more power than it should
        and appears on no survey. Your orders are not to watch it. Your orders are to go in and take it.<br><br>
        So you do. Room by room, level by level, you fight the garrison for every metre of it — security,
        tunnels, offices, the detention block, the command centre, and then a sub-level network that your
        own people never knew existed.<br><br>
        And when the last of the garrison is dead and the shooting finally stops, you find out why they
        were really there.<br><br>
        <b>They were not defending the compound. They were the lid on it.</b><br><br>
        Behind forty centimetres of observation glass, in a containment ring that has been screaming its
        quarantine alarm for eight days with nobody left alive to answer it, several hundred subjects are
        standing in the dark. Every one of them flatlined over a week ago. Every one of them turns to look
        at you.<br><br>
        You killed the only people holding the door shut.
        </p>
      </div>

      <div class="card">
        <h3>The three acts</h3>
        <div class="kv"><span><b>Act I · Sectors 1–5</b><div class="note">The invasion. Breach the compound and fight down through the garrison.</div></span><b>${esc(RR.Content.map("core:c1") ? "Compound" : "-")}</b></div>
        <div class="hr"></div>
        <div class="kv"><span><b>Act II · Sectors 6–10</b><div class="note">The sub-levels. Six floors nobody admits exist, and a garrison dying to hold one door.</div></span><b>Sub-levels</b></div>
        <div class="hr"></div>
        <div class="kv"><span><b>Act III · Sectors 11–16</b><div class="note">The discovery. Research Wing B is still powered, and the containment ring is open.</div></span><b>Outbreak</b></div>
      </div>

      <div class="card">
        <h3>And afterwards</h3>
        <p class="note">The campaign runs <b>${n} sectors</b>, each opening with a briefing between you and Control.
        When it ends, it does not end well — and that is where <b>Zombie Horde</b> picks up: the same compound,
        the same uniforms, and no extraction coming. ${done ? "<b style=\"color:var(--acc)\">You have already seen how it ends.</b>" : "Play the campaign to find out how you get there."}</p>
        <div class="grid g2">
          ${btn("go", "▶ Start the campaign", "pri", "campaign")}
          ${btn("go", "Zombie Horde", "", "horde")}
        </div>
      </div>
      <div class="hr"></div>${btn("go", "Back", "sm", "main")}
    </div>`;
  }

  /* ------------------------------------------------- pre-mission briefing */
  /* Every sector opens with the exchange between Control and Spectre-9 that
     carries the story. It is a real screen rather than a HUD banner because a
     banner cannot hold four lines and cannot be read at your own pace. */
  let pendingBrief = null;
  function briefScreen(arg) {
    const a = arg || pendingBrief || {};
    const cam = RR.Content.campaign(a.campaignId);
    const L = cam && cam.levels[a.levelIndex];
    if (!L) return storyScreen();
    const m = RR.Content.map(L.map);
    const total = cam.levels.length;
    const act = a.levelIndex < 5 ? "ACT I · INVASION"
              : a.levelIndex < 10 ? "ACT II · THE SUB-LEVELS"
              : "ACT III · OUTBREAK";
    const lines = (L.story || []).map(([who, text]) => {
      const me = who === "SPECTRE-9";
      return `<div style="margin:0 0 10px">
        <div style="font-size:10px;letter-spacing:.16em;color:${me ? "var(--acc)" : "#6fa8d8"}">${esc(who)}</div>
        <div style="font-size:13px;line-height:1.55;color:var(--ink)">${esc(text)}</div>
      </div>`;
    }).join("");
    const head = (L.brief || "").split("\n")[0] || ("SECTOR " + (a.levelIndex + 1));
    return `<div class="wrap">
      <p class="note" style="letter-spacing:.2em;margin:0">${esc(act)}</p>
      <h2 style="margin-top:4px">${esc(head)}</h2>
      <div class="card">
        <div class="kv"><span>Sector</span><b>${a.levelIndex + 1} of ${total}</b></div>
        <div class="kv"><span>Location</span><b>${esc(m ? m.name : L.map)}</b></div>
        <div class="kv"><span>Objective</span><b>${esc((m && m.objective) || "Clear the sector.")}</b></div>
      </div>
      ${lines ? `<div class="card">${lines}</div>` : ""}
      <div class="grid g2">
        ${btn("briefGo", "▶ Begin sector", "pri")}
        ${btn("go", "Abort", "", a.first ? "campaign" : "main")}
      </div>
    </div>`;
  }

  /* Which act a sector belongs to. Only the core story campaign has acts; a
     mod campaign just gets its sector number. */
  function actOf(cid, i, total) {
    if (cid !== "core:main" || total < 12) return "";
    return i < 5 ? "ACT I · INVASION" : i < 10 ? "ACT II · SUB-LEVELS" : "ACT III · OUTBREAK";
  }

  /* ------------------------------------------------------- mission select
   * Every sector of every campaign is its own selectable mission. Picking one
   * runs that sector on its own, with its briefing, rather than forcing a run
   * from sector 1. "New Game" and "Continue" are still there for playing it
   * straight through. */
  function campaignScreen() {
    const cams = RR.Content.listCampaigns();
    const cid = RR.settings.lastCampaign && cams.some((c) => c._full === RR.settings.lastCampaign)
      ? RR.settings.lastCampaign : (cams[0] && cams[0]._full);
    const cam = RR.Content.campaign(cid);

    /* campaign picker as tabs, so choosing one re-renders its mission list */
    const tabs = cams.map((c) => `<button class="btn sm ${c._full === cid ? "on" : ""}"
      data-act="pickCampaign" data-arg="${esc(c._full)}">${esc(c.name)}</button>`).join("");

    let list = "<p class=note>No campaign found.</p>";
    let cleared = 0, total = 0;
    if (cam) {
      total = cam.levels.length;
      cleared = RR.Game.missionsCleared(cid);
      let lastAct = "";
      list = cam.levels.map((L, i) => {
        const m = RR.Content.map(L.map);
        const built = m ? RR.World.build(m) : null;
        const foes = built ? built.spawns.enemy.length : 0;
        const done = RR.Game.missionDone(cid, i);
        const act = actOf(cid, i, total);
        const head = act && act !== lastAct
          ? `<div class="palhead" style="margin:10px 0 6px">${esc(act)}</div>` : "";
        lastAct = act || lastAct;
        return head + `<button class="btn" data-act="startMission" data-arg="${esc(cid + "|" + i)}"
          style="width:100%;display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:6px;padding:9px 11px">
          <span style="flex:0 0 30px;font:700 15px/1 ui-monospace,monospace;color:${done ? "var(--ok)" : "var(--acc)"}">${String(i + 1).padStart(2, "0")}</span>
          <span style="flex:1;min-width:0">
            <span style="display:block;font-size:13px">${esc(m ? m.name : L.map)}</span>
            <span class="note" style="display:block;margin:2px 0 0">${foes} hostiles${m && m.theme ? " · " + esc(String(m.theme)) : ""}</span>
          </span>
          <span style="flex:0 0 auto;font-size:10px;letter-spacing:.12em;color:${done ? "var(--ok)" : "var(--dim)"}">${done ? "✓ CLEARED" : "▶ PLAY"}</span>
        </button>`;
      }).join("");
    }

    return `<div class="wrap">
      <h2>Campaign</h2>
      <div class="card">
        <div class="note" style="margin-bottom:6px">Campaign</div>
        <div class="chips" style="margin-bottom:10px">${tabs}</div>
        ${row("Difficulty", sel("uDiff", DIFFS, RR.settings.difficulty))}
        ${cam ? `<div class="kv"><span>Progress</span><b>${cleared} of ${total} sectors cleared</b></div>` : ""}
      </div>

      <div class="grid g2">
        ${btn("startCampaign", "▶ Play from the start", "pri")}
        ${RR.Game.hasSave() ? btn("continueCampaign", "Continue save") : ""}
      </div>

      <div class="card">
        <h3>Missions</h3>
        <p class="note">Every sector is playable on its own — pick any one.</p>
        ${list}
      </div>

      <div class="grid g2">
        ${btn("editorFor", "✎ Make a map for this mode", "sm", "campaign")}
        ${btn("go", "Back", "sm", "main")}
      </div>
    </div>`;
  }

  function hordeScreen() {
    const h = RR.Content.horde();
    const maps = (h.maps || []).map((id) => { const m = RR.Content.map(id); return [id, m ? m.name : id]; });
    return `<div class="wrap">
      <h2>Zombie Horde</h2>
      <div class="card">
        ${row("Map", sel("uHmap", maps.length ? maps : [["c1", "default"]], maps[0] && maps[0][0]))}
        ${row("Difficulty", sel("uDiff", DIFFS, RR.settings.difficulty))}
        <div class="hr"></div>
        <div class="kv"><span>Personal best</span><b>Round ${RR.Store.get("hordeBest", 0)}</b></div>
        <div class="kv"><span>Start / round</span><b>${h.baseCount || 6} + ${h.perRound || 3}</b></div>
        <div class="kv"><span>Break between rounds</span><b>${h.breakTime || 9}s</b></div>
        <p class="note">Melee-only undead. Ammunition is topped up between rounds — there are no health packs, health regenerates when you stop taking hits.</p>
      </div>
      ${btn("startHorde", "Start Horde", "pri")}
      <div class="hr"></div>
      <div class="grid g2">
        ${btn("editorFor", "✎ Make a map for this mode", "sm", "horde")}
        ${btn("go", "Back", "sm", "main")}
      </div>
    </div>`;
  }

  function dmScreen(mode) {
    const ar = RR.Content.arenas();
    const pool = (ar[mode] && ar[mode].length ? ar[mode] : ["m1"]).map((id) => { const m = RR.Content.map(id); return [id, m ? m.name : id]; });
    const r = (RR.Content.rules()[mode]) || {};
    return `<div class="wrap">
      <h2>${mode === "ffa" ? "Free For All" : "Team Deathmatch"}</h2>
      <div class="card">
        ${row("Map", sel("uMap", pool, pool[0][0]))}
        ${row("Bot difficulty", sel("uDiff", DIFFS, RR.settings.difficulty))}
        ${row("Bots", num("uBots", r.bots || 5, 0, 11))}
        ${row("Score limit", num("uScore", r.scoreLimit || (mode === "ffa" ? 15 : 30), 1, 200))}
        ${row("Time limit (s)", num("uTime", r.timeLimit || 300, 30, 3600, 30))}
        ${row("Respawn delay (s)", num("uResp", r.respawn || 2.5, 0.5, 20, 0.5))}
        ${mode === "tdm" ? row("Your team", sel("uTeam", [["0", "Team A (blue)"], ["1", "Team B (orange)"]], "0")) : ""}
      </div>
      ${btn("startDm", "Start Match", "pri", mode)}
      <div class="hr"></div>
      <div class="grid g2">
        ${btn("editorFor", "✎ Make a map for this mode", "sm", mode)}
        ${btn("go", "Back", "sm", "main")}
      </div>
    </div>`;
  }

  function settingsScreen() {
    const s = RR.settings;
    return `<div class="wrap">
      <h2>Settings</h2>
      <div class="card">
        <h3>Graphics</h3>
        ${row("Renderer", sel("sRend", [["auto", "Auto (WebGL, fall back)"], ["webgl", "WebGL 2 — lit"], ["software", "Software — retro"]], s.renderer))}
        <p class="note">Active: <b>${esc(RR.R.name)}</b>${RR.RGL.failed ? " · WebGL unavailable: " + esc(RR.RGL.reason || "unknown") : ""}.
        WebGL gives per-pixel dynamic lights, normal-mapped walls and bloom. Software runs anywhere.</p>
        ${row("Quality", sel("sQual", [["low", "Low"], ["medium", "Medium"], ["high", "High"]], s.quality))}
        ${row("Dynamic resolution", toggle("dynamicRes", s.dynamicRes))}
        ${row("Textured floors", toggle("floorCast", s.floorCast))}
        ${row("Ray resolution", sel("sRay", [["1", "Full (1 ray / column)"], ["2", "Half"], ["3", "Third"]], s.rayStep))}
        ${row("Field of view", range("sFov", s.fov, 55, 100, 1))}
        ${row("View bobbing", toggle("bobbing", s.bobbing))}
        ${row("Post-processing", toggle("postFx", s.postFx))}
        ${row("8-direction sprites", toggle("sprite8", s.sprite8))}
        ${row("Blood &amp; bullet holes", toggle("gore", s.gore))}
        ${row("Show FPS", toggle("showFps", s.showFps))}
      </div>
      <div class="card">
        <h3>Controls</h3>
        ${row("Mouse sensitivity", range("sLook", s.lookSens, 0.2, 3, 0.1))}
        ${row("Touch sensitivity", range("sTouch", s.touchSens, 0.2, 3, 0.1))}
        ${row("Auto-detect touch", toggle("autoTouch", s.autoTouch))}
        ${row("Hold to aim", toggle("adsHold", s.adsHold))}
        ${row("Mouse turns view", toggle("mouseTurn", s.mouseTurn))}
        ${row("On-screen controls", toggle("touchOn", RR.In.padVisible))}
        <div class="kv"><span>Detected device</span><b>${esc(RR.U.device().kind)} <span class="note">(${esc(RR.U.device().why)})</span></b></div>
        <p class="note"><b>Desktop:</b> WASD or arrows to move, <b>mouse to turn left and right</b> (with or without pointer lock), <b>left click to shoot</b>, <b>right click to aim down sight</b> — Space, Shift and C do the same. R reload, E use, F knife, 1-4 or wheel to switch, Enter or Esc to pause, Tab scores, M minimap.<br>
        <b>On-screen controls appear automatically on phones and tablets</b> and stay off on desktops — including desktops with a touchscreen. Override it with the toggle above at any time.<br>
        <b>On-screen controls</b> mirror that scheme exactly: the <b>left stick is WASD</b> — push up to go forward, down to back up, left and right to strafe. The <b>right side is look</b>: put a thumb down anywhere on the right half and drag to turn; the stick appears where you touch and keeps tracking if your thumb wanders off it. <b>FIRE</b> is Space / left click, <b>AIM</b> is Shift / right click, <b>RELOAD</b> is R, <b>USE</b> is E, <b>KNIFE</b> is F, and the top row is weapons 1-4.<br>
        The pad lays itself out for whatever shape your screen is, so <b>portrait and landscape both work</b> — you never need to rotate the device to make the controls respond. The <b>▲ Controls</b> button at the top centre shows or hides the whole pad. Gamepads work too.</p>
      </div>
      <div class="card">
        <h3>Audio</h3>
        ${row("Sound", range("sSfx", s.sfxVol, 0, 1, 0.05))}
        ${row("Music", range("sMus", s.musVol, 0, 1, 0.05))}
      </div>
      <div class="card">
        <h3>HUD</h3>
        ${row("Minimap", toggle("minimap", s.minimap))}
        ${row("Minimap zoom", range("sMini", s.minimapZoom, 5, 16, 1))}
        ${row("Name tags", toggle("nameplates", s.nameplates))}
        <p class="note">The minimap points at the exit in campaign levels and at the round objective everywhere else. Name tags mark <b style="color:#ff5b5b">teammates in red</b> and <b style="color:#4fc9ff">enemies in blue</b> in deathmatch and online.</p>
      </div>
      <div class="card">
        <h3>Game</h3>
        ${row("Difficulty", sel("sDiff", DIFFS, s.difficulty))}
        ${row("Your name", `<input type="text" id="sName" maxlength="16" placeholder="PLAYER" value="${esc(s.playerName || "")}">`)}
        <p class="note">Difficulty changes enemy accuracy, reaction time, damage, aggression, enemy count and how long you must avoid damage before health regenerates. On Easy, bots also take more damage and deal less.</p>
      </div>
      <div class="grid g2">${btn("applySettings", "Apply", "pri")}${btn("resetSettings", "Reset defaults", "dang")}</div>
      <div class="hr"></div>
      ${btn("go", "Back", "sm", current === "pause" ? "pause" : "main")}
    </div>`;
  }

  function helpScreen() {
    return `<div class="wrap">
      <h2>Modding in 60 seconds</h2>
      <div class="card">
        <p class="note">A <b>.raymod</b> file is plain JSON. It cannot contain code — only data the engine already knows how to read. Drop one on this page (or use Mods → Import) to load it.</p>
        <pre class="out">${esc(RR.Starter.miniExample())}</pre>
        <h3>Grid symbols</h3>
        <pre class="out">${esc(RR.Starter.legend())}</pre>
      </div>
      <div class="grid g2">
        ${btn("copyPrompt", "Copy Claude Mod Prompt")}
        ${btn("downloadStarter", "Download Starter_Mod.raymod")}
      </div>
      <div class="hr"></div>${btn("go", "Back", "sm", "main")}
    </div>`;
  }

  function modsScreen() {
    const packs = RR.Mods.packs;
    const probs = RR.Content.problems();
    const cards = packs.map((p) => {
      const d = p.pack;
      const counts = ["maps", "weapons", "enemies", "themes", "campaigns"]
        .map((c) => d[c] ? Object.keys(d[c]).length : 0);
      return `<div class="card">
        <div class="rowflex" style="justify-content:space-between">
          <div><b>${esc(d.name)}</b> <span class="tag ${p.protected ? "core" : p.enabled ? "on" : "off"}">${p.protected ? "core" : p.enabled ? "on" : "off"}</span>
          <div class="note">${esc(d.namespace)} · v${esc(d.version)} · by ${esc(d.author || "?")}</div></div>
        </div>
        <div class="note">maps ${counts[0]} · weapons ${counts[1]} · enemies ${counts[2]} · themes ${counts[3]} · campaigns ${counts[4]}</div>
        ${d.description ? `<p class="note">${esc(d.description)}</p>` : ""}
        ${playable(d).length
          ? `<div class="note" style="margin-top:6px">Playable: ${esc(playable(d).slice(0, 6).map((e) => e.where + " · " + e.label).join(" | "))}${playable(d).length > 6 ? " … and " + (playable(d).length - 6) + " more" : ""}</div>
             <div style="margin-top:8px">${btn("modPlay", "▶ Play this mod", "pri", d.id)}</div>`
          : `<p class="note" style="margin-top:6px">No playable content — this mod only changes existing things (weapons, enemies, themes). Start any normal mode to see its effect.</p>`}
        <div class="rowflex" style="margin-top:8px">
          ${p.protected ? `<span class="note">Protected — always loaded, cannot be removed.</span>`
            : `${btn("modToggle", p.enabled ? "Disable" : "Enable", "sm " + (p.enabled ? "" : "on"), d.id)}
               ${btn("modUp", "▲", "sm", d.id)}${btn("modDown", "▼", "sm", d.id)}
               ${btn("modExport", "Export", "sm", d.id)}
               ${btn("modRemove", "Remove", "sm dang", d.id)}`}
        </div>
      </div>`;
    }).join("");
    const issues = (probs.missing.length || probs.conflicts.length)
      ? `<div class="card"><h3>Reference report</h3><pre class="out">${esc([...probs.missing.map((s) => "MISSING  " + s), ...probs.conflicts.map((s) => "OVERRIDE " + s)].join("\n") || "clean")}</pre></div>` : "";
    return `<div class="wrap">
      <h2>Mods</h2>
      <div class="card">
        <div class="grid g2">
          ${btn("importPick", "Import .raymod", "pri")}
          ${btn("downloadStarter", "Starter mod")}
          ${btn("cloneCore", "Clone core to editable mod")}
          ${btn("copyPrompt", "Copy Claude Mod Prompt")}
        </div>
        <p class="note">You can also drag a <b>.raymod</b> file anywhere onto this page. Mods load in order, top to bottom; later mods override earlier ids of the same name. Load order and enable state persist.</p>
      </div>
      ${cards}
      ${issues}
      <div class="hr"></div>${btn("go", "Back", "sm", "main")}
    </div>`;
  }

  function onlineScreen() {
    const url = (RR.settings.serverUrl || "").trim();
    const stat = RR.Online.status();
    const name = (RR.settings.playerName || "").trim();

    /* There is no name gate any more. Online names you automatically and puts
       you straight into a lobby — asking a single player to fill in a form
       before they can play on their own was pure friction. "Change name" is
       one tap away on the screen below. */

    /* Step 2 — in a lobby: the code is the whole screen. */
    const lob = RR.Online.lobby;
    if (lob) return lobbyScreen(lob);

    const dot = stat.code === "open" ? "var(--ok)" : stat.code === "error" ? "var(--bad)" : "var(--dim)";
    const local = RR.Online.isLocal;
    return `<div class="wrap">
      <h2>Online</h2>
      <div class="card">
        <div class="kv"><span>Playing as</span><b>${esc(name)}</b></div>
        <div class="kv"><span>Lobby server</span><b id="oStat" style="color:${dot}">${esc(stat.text)}</b></div>
        <div class="rowflex">${btn("oChangeName", "Change name", "sm")}${btn("oServer", "Server settings", "sm")}
          ${stat.code === "open" ? btn("disconnect", "Disconnect", "sm dang") : btn("oConnect", "Connect", "sm pri")}</div>
      </div>

      <div class="card">
        <h3>Open a lobby</h3>
        <p class="note">One tap and you are in. A lobby of one is a real lobby — start whenever you like, and anyone who turns up drops straight into the match.</p>
        <div class="grid g2">
          ${btn("oNewLobby", "▶ New lobby — Free For All", "pri", "ffa")}
          ${btn("oNewLobby", "New lobby — Team Deathmatch", "", "tdm")}
          ${btn("oNewLobby", "New lobby — Co-op Zombies", "", "coop")}
          ${btn("oJoinPick", "🔑 Join with a code")}
        </div>
      </div>

      ${local ? `<div class="card">
        <h3>Playing with other people</h3>
        <p class="note">You are on the <b>built-in lobby</b>, which lives in this tab — perfect for playing on your own, but nobody else can reach it. To play with other people, run <code>node HostileSector_Server.js</code> and put its address in <b>Server settings</b>. Everything you see here works exactly the same way once you do.</p>
      </div>` : `<div class="card">
        <h3>Play with someone specific</h3>
        <div class="grid g2">
          ${btn("oHostPick", "🏠 Host with options")}
          ${btn("oRefresh", "Refresh list", "sm")}
        </div>
        <p class="note">Hosting gives you a 6-character code plus a link. Anyone with either joins you — no accounts, no sign-in.</p>
      </div>

      <div class="card"><h3>Public lobbies</h3><div id="oLobbies"><p class="note">${stat.code === "open" ? "Looking…" : "Connect to list public lobbies."}</p></div></div>`}
      <div class="hr"></div>${btn("go", "Back", "sm", "main")}
    </div>`;
  }

  const MODEN = { ffa: "Free For All", tdm: "Team Deathmatch", coop: "Co-op Zombies" };

  /* The lobby answers three questions, in this order and without being asked:
     who is here, what happens next, and what should I press. The primary
     button is whatever will actually move things forward for THIS player —
     never a control that silently does nothing. */
  function lobbyScreen(l) {
    const me = RR.Online.selfId;
    const players = l.players || [];
    const isHost = l.owner === me;
    const mine = players.find((p) => p.id === me) || {};
    const readyN = players.filter((p) => p.ready).length;
    const alone = players.length < 2;

    const local = RR.Online.isLocal;
    let status, primary;
    if (l.state === "playing") {
      status = "Match in progress — rejoining…";
      primary = btn("oStart", "▶ Rejoin the match", "pri");
    } else if (isHost && alone) {
      status = local
        ? "Your lobby is open and you are good to go — press Start."
        : "You are the only one here. Press Start whenever you like, or share the code first.";
      primary = btn("oStart", "▶ Start match", "pri");
    } else if (isHost) {
      status = readyN >= players.length
        ? "Everyone is ready. Starting…"
        : readyN + " of " + players.length + " ready — you can start whenever you like.";
      primary = btn("oStart", "▶ Start match", "pri");
    } else {
      status = mine.ready
        ? "You are ready. Waiting for " + esc(hostName(l)) + " to start."
        : "Press ready when you are. " + readyN + " of " + players.length + " ready.";
      primary = btn("oReady", mine.ready ? "✓ Ready — tap to cancel" : "I'm ready", "pri");
    }

    const rows = players.map((p) =>
      `<div class="kv"><span>${esc(p.name)}${p.id === l.owner ? " ★ host" : ""}${p.id === me ? " (you)" : ""}</span>
        <b style="color:${p.ready ? "var(--ok)" : "var(--dim)"}">${l.mode === "tdm" ? "Team " + (p.team === 0 ? "A" : "B") + " · " : ""}${p.ready ? "READY" : "waiting"}</b></div>`).join("");

    return `<div class="wrap">
      <h2>${esc(MODEN[l.mode] || l.mode)}</h2>

      <div class="card" style="border-color:var(--acc)">
        <p class="note" style="color:var(--ink);margin:0 0 8px">${status}</p>
        <div class="grid g2">
          ${primary}
          ${isHost && !alone ? btn("oReady", mine.ready ? "✓ Ready" : "Mark ready") : ""}
          ${l.mode === "tdm" ? btn("oTeam", "Switch team") : ""}
          ${btn("oLeave", "Leave", "dang")}
        </div>
      </div>

      <div class="card" style="text-align:center">
        <div class="note">${local ? "Your lobby code" : "Invite someone — code, link, or both"}</div>
        <div class="joincode">${esc(l.code)}</div>
        <div class="grid g2">
          ${btn("oCopyCode", "Copy code", "pri")}
          ${local ? "" : btn("oCopyLink", "Copy join link")}
          ${local ? "" : btn("oCopyInvite", "Copy invite code")}
        </div>
        ${local ? `<p class="note" style="margin-bottom:0">This lobby is the built-in one, so the code only means something on this device. Add a server under <b>Server settings</b> to make it shareable.</p>` : ""}
      </div>

      <div class="card">
        <div class="kv"><span>Players</span><b>${players.length}/${l.max || 8}</b></div>
        <div class="kv"><span>Mode</span><b>${esc(MODEN[l.mode] || l.mode)}</b></div>
        <div class="kv"><span>Map</span><b>${esc(mapLabel(l.map))}</b></div>
        <div class="hr"></div>${rows}
      </div>

      <div class="card">
        <h3>Change it up</h3>
        <div class="grid g2">
          ${btn("oNewLobby", "Free For All", l.mode === "ffa" ? "sm on" : "sm", "ffa")}
          ${btn("oNewLobby", "Team Deathmatch", l.mode === "tdm" ? "sm on" : "sm", "tdm")}
          ${btn("oNewLobby", "Co-op Zombies", l.mode === "coop" ? "sm on" : "sm", "coop")}
        </div>
      </div>
      <p class="note">${local ? "Bots fill out the map so a solo match is a real fight." : "The match keeps running if the host leaves — someone else becomes host automatically."}</p>
    </div>`;
  }
  function hostName(l) {
    const h = (l.players || []).find((p) => p.id === l.owner);
    return h ? h.name : "the host";
  }
  function mapLabel(id) {
    if (!id) return "auto";
    const m = RR.Content.map(id);
    return (m && m.name) || id;
  }

  function pauseScreen() {
    const S = RR.Game.S;
    return `<div class="wrap">
      <h1 class="logo" style="font-size:34px">PAUSED</h1>
      <div class="card">
        <div class="kv"><span>Mode</span><b>${esc(S ? S.mode : "-")}</b></div>
        <div class="kv"><span>Difficulty</span><b>${esc(RR.settings.difficulty)}</b></div>
        ${S ? `<div class="kv"><span>Kills / shots / hits</span><b>${S.stats.kills} / ${S.stats.shots} / ${S.stats.hits}</b></div>` : ""}
      </div>
      <div class="grid g2">
        ${btn("resume", "Resume", "pri")}
        ${btn("restart", "Restart")}
        ${RR.feature("online") && RR.Online.connected ? btn("oInvite", "Invite a player") : ""}
        ${btn("go", "Settings", "", "settings")}
        ${S && S.mode === "campaign" ? btn("saveGame", "Save progress") : ""}
        ${RR.Game.hasSave() ? btn("loadGame", "Load save") : ""}
        ${btn("quit", "Quit to menu", "dang")}
      </div>
    </div>`;
  }

  function scoreTable(S) {
    const rows = S.actors.filter((a) => a.isPlayer || a.isBot)
      .sort((a, b) => b.score - a.score)
      .map((a) => `<tr><td class="${a.isPlayer ? "me" : S.mode === "tdm" ? (a.team === 0 ? "tA" : "tB") : ""}">${esc(a.name)}</td>
        <td>${a.score}</td><td>${a.kills || 0}</td><td>${a.deaths || 0}</td></tr>`).join("");
    return `<table><tr><th>Player</th><th>Score</th><th>Kills</th><th>Deaths</th></tr>${rows}</table>`;
  }

  function endScreenHtml(arg) {
    const S = arg.S;
    const acc = S.stats.shots ? Math.round((S.stats.hits / S.stats.shots) * 100) : 0;
    const board = (S.mode === "ffa" || S.mode === "tdm") ? `<div class="card">${scoreTable(S)}</div>` : "";
    return `<div class="wrap">
      <h1 class="logo" style="font-size:clamp(24px,7vw,40px)">${esc(arg.title)}</h1>
      <p class="note center">${esc(arg.sub || "")}</p>
      ${board}
      <div class="card">
        <div class="kv"><span>Kills</span><b>${S.stats.kills}</b></div>
        <div class="kv"><span>Shots fired</span><b>${S.stats.shots}</b></div>
        <div class="kv"><span>Accuracy</span><b>${acc}%</b></div>
        <div class="kv"><span>Deaths</span><b>${S.stats.deaths}</b></div>
        ${S.mode === "horde" ? `<div class="kv"><span>Round reached</span><b>${S.round}</b></div><div class="kv"><span>Personal best</span><b>${S.best}</b></div>` : ""}
      </div>
      <div class="grid g2">${btn("restart", "Play again", "pri")}${btn("quit", "Main menu")}</div>
    </div>`;
  }

  function interHtml(arg) {
    const S = arg.S;
    const cam = RR.Content.campaign(S.campaign);
    const L = cam && cam.levels[S.levelIndex];
    const m = L && RR.Content.map(L.map);
    return `<div class="wrap">
      <h1 class="logo" style="font-size:30px">SECTOR CLEAR</h1>
      <div class="card">
        <div class="kv"><span>Next</span><b>${esc(m ? m.name : "-")}</b></div>
        <div class="kv"><span>Kills so far</span><b>${S.stats.kills}</b></div>
        <div class="kv"><span>Health</span><b>${Math.round(S.player.hp)}</b></div>
        ${L && L.brief ? `<p class="note" style="white-space:pre-wrap">${esc(L.brief)}</p>` : ""}
      </div>
      <div class="grid g2">${btn("nextLevel", "Continue", "pri")}${btn("quit", "Main menu")}</div>
    </div>`;
  }

  /* ------------------------------------------------------------ transitions */
  function pause() {
    if (RR.mode !== "play") return;
    if (RR.Game.S && RR.Game.S.fromEditor) { RR.Editor.returnFromTest(); return; }
    RR.paused = true;
    RR.In.exitLock(); RR.In.clearTouch();
    el("touch").classList.remove("show");
    show("pause");
  }
  function resume() {
    RR.paused = false; hide();
    RR.In.refreshPadVisibility();
    RR.Audio.resume();
  }
  function endScreen(S, title, sub) {
    RR.paused = true;
    RR.In.exitLock(); RR.In.clearTouch();
    el("touch").classList.remove("show");
    el("hud").classList.remove("show");
    show("end", { S, title, sub });
  }
  function interLevel(S) {
    RR.paused = true;
    RR.In.exitLock(); RR.In.clearTouch();
    el("touch").classList.remove("show");
    el("hud").classList.remove("show");
    show("inter", { S });
  }
  function quitToMenu() {
    RR.Game.stop();
    RR.paused = false;
    RR.R.clearBlack();
    show("main");
    RR.Audio.startMusic(RR.Content.music("menu"));
  }

  /* ---------------------------------------------------------------- actions */
  let lastStart = null;
  /* Any sector start — first, next, or a restart after death — re-points the
     restart target at that sector, so "Play again" can never rewind the run. */
  RR.bus.on("sector-begin", (e) => {
    if (!e) return;
    lastStart = Object.assign({}, lastStart || { mode: "campaign" },
      { mode: "campaign", campaignId: e.campaignId, levelIndex: e.levelIndex });
  });
  /* EVERY route back into gameplay funnels through here.
     The pause screen, the end screen and the between-sector screen all strip
     the on-screen pad on the way out (`#touch` loses .show). Routes that go
     through RR.Game.start() got it back, because start() re-asserts pad
     visibility — but beginCampaignLevel() does NOT go through start(), so
     pressing Continue between campaign sectors dropped you into the next
     mission with no on-screen controls at all, for the whole mission. That is
     the "controls disappear when I start a new mission" bug. Putting the
     re-assert in one shared place means a future route cannot forget it. */
  function enterPlay() {
    hide();
    el("hud").classList.add("show");
    RR.paused = false;
    RR.In.refreshPadVisibility();
    RR.In.requestLock();
  }
  function beginPlay(opts) {
    lastStart = opts;
    const S = RR.Game.start(opts);
    if (!S) { RR.U.toast("Could not start: content missing"); return; }
    enterPlay();
  }

  const ACT = {
    go: (arg) => show(arg),
    editor: () => RR.Editor.open(),
    /* Open the editor already configured for the mode you came from, so the
       palette, the validator and the Play button all match what you are
       building. */
    editorFor(mode) { RR.Editor.openFor(mode || "campaign"); },
    /* switch which campaign's mission list is on screen */
    pickCampaign(cid) {
      RR.settings.lastCampaign = cid;
      if (el("uDiff")) RR.settings.difficulty = el("uDiff").value;
      RR.saveSettings();
      show("campaign");
    },
    startCampaign() {
      const cams = RR.Content.listCampaigns();
      const cid = (RR.settings.lastCampaign && cams.some((c) => c._full === RR.settings.lastCampaign))
        ? RR.settings.lastCampaign : (cams[0] && cams[0]._full);
      if (el("uDiff")) RR.settings.difficulty = el("uDiff").value;
      RR.settings.lastCampaign = cid; RR.saveSettings();
      /* the story opens the mission, not the other way round */
      pendingBrief = { campaignId: cid, levelIndex: 0, first: true };
      show("brief", pendingBrief);
    },
    /* Play one sector on its own. arg is "campaignId|index". The sector still
       opens with its briefing, and finishing it rolls into the next one exactly
       as it would in a full run. */
    startMission(arg) {
      const bar = String(arg || "").lastIndexOf("|");
      if (bar < 0) return;
      const cid = String(arg).slice(0, bar);
      const idx = parseInt(String(arg).slice(bar + 1), 10) || 0;
      const cam = RR.Content.campaign(cid);
      if (!cam || !cam.levels[idx]) { RR.U.toast("That sector is missing"); return; }
      if (el("uDiff")) RR.settings.difficulty = el("uDiff").value;
      RR.settings.lastCampaign = cid; RR.saveSettings();
      pendingBrief = { campaignId: cid, levelIndex: idx, first: true };
      show("brief", pendingBrief);
    },
    /* "Begin sector" on the briefing screen. First sector starts the campaign;
       every later one continues the run already in progress. */
    briefGo() {
      const a = pendingBrief;
      pendingBrief = null;
      if (!a) return quitToMenu();
      if (a.first) { beginPlay({ mode: "campaign", campaignId: a.campaignId, levelIndex: a.levelIndex }); return; }
      const S = RR.Game.S;
      if (S && RR.Game.beginCampaignLevel(S)) enterPlay();
      else quitToMenu();
    },
    continueCampaign() {
      const S = RR.Game.loadProgress();
      if (!S) { RR.U.toast("No save found"); return; }
      lastStart = { mode: "campaign", campaignId: S.campaign, levelIndex: S.levelIndex };
      enterPlay();
    },
    startHorde() {
      RR.settings.difficulty = el("uDiff").value; RR.saveSettings();
      beginPlay({ mode: "horde", mapId: el("uHmap").value });
    },
    startDm(mode) {
      RR.settings.difficulty = el("uDiff").value; RR.saveSettings();
      beginPlay({
        mode, mapId: el("uMap").value,
        bots: M.clamp(parseInt(el("uBots").value, 10) || 0, 0, 11),
        scoreLimit: M.clamp(parseInt(el("uScore").value, 10) || 15, 1, 200),
        timeLimit: M.clamp(parseInt(el("uTime").value, 10) || 300, 30, 3600),
        respawnDelay: M.clamp(parseFloat(el("uResp").value) || 2.5, 0.5, 20),
        team: el("uTeam") ? (parseInt(el("uTeam").value, 10) || 0) : 0,
      });
    },
    dm: (arg) => show("dm", arg),
    resume, restart() {
      if (!lastStart) { quitToMenu(); return; }
      /* Restart the sector you are ACTUALLY on. lastStart records where the
         run began, and it never moved as you advanced — so restarting from
         sector 12 of a run you started at sector 1 sent you back to sector 1.
         The live state is the truth about where you are. */
      const S0 = RR.Game.S;
      const opts = (S0 && S0.mode === "campaign" && lastStart.mode === "campaign")
        ? Object.assign({}, lastStart, { campaignId: S0.campaign, levelIndex: S0.levelIndex })
        : lastStart;
      lastStart = opts;
      el("hud").classList.add("show");
      const S = RR.Game.start(opts);
      if (S) enterPlay();
    },
    quit: quitToMenu,
    nextLevel() {
      const S = RR.Game.S;
      if (!S) return quitToMenu();
      const cam = RR.Content.campaign(S.campaign);
      const L = cam && cam.levels[S.levelIndex];
      /* a sector with story to tell gets its briefing; anything else (a mod
         campaign with no story written) goes straight in as before */
      if (L && L.story && L.story.length) {
        pendingBrief = { campaignId: S.campaign, levelIndex: S.levelIndex, first: false };
        show("brief", pendingBrief);
        return;
      }
      if (RR.Game.beginCampaignLevel(S)) enterPlay();
      else quitToMenu();
    },
    saveGame() { RR.U.toast(RR.Game.saveProgress(RR.Game.S) ? "Progress saved" : "Nothing to save"); },
    loadGame() {
      const S = RR.Game.loadProgress();
      if (!S) { RR.U.toast("No save found"); return; }
      enterPlay();
    },
    toggle(id) {
      if (id === "touchOn") { RR.In.setPad(!RR.In.padVisible); show(current); return; }
      RR.settings[id] = !RR.settings[id];
      RR.saveSettings();
      if (id === "floorCast" || id === "dynamicRes" || id === "postFx") RR.R.resize();
      if (id === "sprite8") RR.Assets.clearCache();
      if (id === "showFps") el("hFps").style.display = RR.settings.showFps ? "" : "none";
      if (id === "autoTouch") RR.In.setTouchEnabled(RR.settings.autoTouch ? RR.U.isHandheld() : true);
      show(current);
    },
    applySettings() {
      const s = RR.settings;
      const prevRend = s.renderer;
      s.quality = el("sQual").value;
      if (el("sRend")) s.renderer = el("sRend").value;
      s.rayStep = parseInt(el("sRay").value, 10) || 1;
      s.fov = M.clamp(parseInt(el("sFov").value, 10) || 66, 55, 100);
      s.lookSens = parseFloat(el("sLook").value) || 1;
      s.touchSens = parseFloat(el("sTouch").value) || 1;
      s.sfxVol = parseFloat(el("sSfx").value);
      s.musVol = parseFloat(el("sMus").value);
      s.difficulty = el("sDiff").value;
      if (el("sMini")) s.minimapZoom = M.clamp(parseInt(el("sMini").value, 10) || 9, 5, 16);
      if (el("sName")) {
        const nm = (el("sName").value || "").trim().replace(/[^\w .\-]/g, "").slice(0, 16);
        if (nm !== s.playerName) { s.playerName = nm; if (RR.feature("online")) RR.Online.setName(nm); }
      }
      RR.saveSettings();
      RR.Audio.setVol();
      if (s.renderer !== prevRend) RR.R.setRenderer(s.renderer); else RR.R.resize();
      el("hFps").style.display = s.showFps ? "" : "none";
      RR.U.toast("Settings applied — renderer: " + RR.R.name);
    },
    resetSettings() {
      Object.assign(RR.settings, RR.DEFAULT_SETTINGS);
      RR.saveSettings(); RR.R.resize(); RR.Audio.setVol();
      show("settings"); RR.U.toast("Defaults restored");
    },
    /* --- mods --- */
    importPick() { el("fileIn").click(); },
    modToggle(id) { RR.Mods.setEnabled(id, !RR.Mods.packs.find((p) => p.pack.id === id).enabled); show("mods"); },
    modUp(id) { RR.Mods.move(id, -1); show("mods"); },
    modDown(id) { RR.Mods.move(id, 1); show("mods"); },
    modRemove(id) {
      modal(`<h2>Remove mod</h2><p class="note">Remove <b>${esc(id)}</b>? The base game is unaffected.</p>
        <div class="grid g2">${btn("modRemoveOk", "Remove", "dang", id)}${btn("closeModal", "Cancel")}</div>`);
    },
    modRemoveOk(id) { RR.Mods.removePack(id); closeModal(); show("mods"); RR.U.toast("Mod removed"); },
    modExport(id) {
      const p = RR.Mods.packs.find((q) => q.pack.id === id);
      if (!p) return;
      RR.U.download(p.pack.id + ".raymod", JSON.stringify(p.pack, null, 1));
      RR.U.toast("Exported " + p.pack.id + ".raymod");
    },
    /* Press play on a mod: enable it if needed, then offer everything it can
       actually launch. One entry launches straight away. */
    modPlay(id) {
      const rec = RR.Mods.packs.find((q) => q.pack.id === id);
      if (!rec) return RR.U.toast("Mod not found");
      if (!rec.enabled) { RR.Mods.setEnabled(id, true); RR.U.toast("Enabled " + rec.pack.name); }
      const list = playable(rec.pack);
      if (!list.length) return RR.U.toast("This mod has nothing to launch on its own");
      if (list.length === 1) return ACT.modLaunch(id + "|0");
      modal(`<h2>Play ${esc(rec.pack.name)}</h2>
        <p class="note">Everything this mod adds. Difficulty and bot settings come from Settings and the normal mode screens.</p>
        ${list.map((e, i) => `<div class="card"><div class="rowflex" style="justify-content:space-between">
          <div><b>${esc(e.label)}</b><div class="note">${esc(e.where)}${e.levels ? " · " + e.levels + " level(s)" : ""}</div></div>
          <button class="btn sm pri" data-act="modLaunch" data-arg="${esc(id + "|" + i)}">▶ Play</button>
        </div></div>`).join("")}
        ${btn("closeModal", "Cancel")}`);
    },
    modLaunch(arg) {
      const cut = String(arg).lastIndexOf("|");
      const id = arg.slice(0, cut), idx = parseInt(arg.slice(cut + 1), 10) || 0;
      const rec = RR.Mods.packs.find((q) => q.pack.id === id);
      if (!rec) return RR.U.toast("Mod not found");
      const e = playable(rec.pack)[idx];
      if (!e) return RR.U.toast("Nothing to launch");
      closeModal();
      const opts = e.kind === "campaign"
        ? { mode: "campaign", campaignId: e.id, levelIndex: 0 }
        : e.kind === "horde"
          ? { mode: "horde", mapId: e.id }
          : { mode: e.kind, mapId: e.id, team: 0 };
      beginPlay(opts);
    },
    cloneCore() { RR.Editor.cloneCore(); },
    downloadStarter() {
      RR.U.download("Starter_Mod.raymod", RR.Starter.json());
      RR.U.toast("Starter_Mod.raymod downloaded");
    },
    async copyPrompt() {
      const ok = await RR.U.copy(RR.Starter.claudePrompt());
      RR.U.toast(ok ? "Prompt copied — paste it to Claude with your .raymod attached" : "Copy failed; open Help to read it");
    },
    closeModal,
    importOk() {
      if (!pendingImport) return closeModal();
      const p = pendingImport;
      RR.Mods.addPack(p, true);
      pendingImport = null; closeModal();
      const gt = gameTypes(p);
      if (gt.length) {
        /* take them straight to the screen the new content lives on */
        const first = gt[0];
        modal(`<h2>${esc(p.name)} enabled</h2>
          <div class="card">${gt.map((g) => `<div class="kv"><span>${esc(GT_LABEL[g.type][0])}</span><b>+${g.count} ${esc(g.unit)}${g.count > 1 ? "s" : ""}</b></div>`).join("")}</div>
          <div class="grid g2">

    oStart() { RR.Online.startMatch(); },
  };

  /* ------------------------------------------------------------------- bind */
  function bind() {
    if (boundOnce) return; boundOnce = true;
    const handler = (e) => {
      const t = e.target.closest("[data-act]");
      if (!t) return;
      e.preventDefault();
      if (API._probeOn) { API._probe++; return; }   // TESTS: count handler firings
      RR.Audio.resume();
      RR.Audio.play("ui_click");
      const fn = ACT[t.dataset.act];
      if (fn) fn(t.dataset.arg);
    };
    el("menu").addEventListener("click", handler);
    el("modalBox").addEventListener("click", handler);
    el("edTop").addEventListener("click", handler);

    el("fileIn").addEventListener("change", (e) => {
      const f = e.target.files && e.target.files[0];
      e.target.value = "";
      if (f) readModFile(f);
    });
    /* drag & drop anywhere */
    const drop = el("drop");
    let dragDepth = 0;
    window.addEventListener("dragenter", (e) => { e.preventDefault(); if (++dragDepth === 1) drop.classList.add("show"); });
    window.addEventListener("dragover", (e) => e.preventDefault());
    window.addEventListener("dragleave", (e) => { if (--dragDepth <= 0) { dragDepth = 0; drop.classList.remove("show"); } });
    window.addEventListener("drop", (e) => {
      e.preventDefault(); dragDepth = 0; drop.classList.remove("show");
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) readModFile(f);
    });
  }

  function readModFile(file) {
    const fr = new FileReader();
    fr.onload = () => previewImport(String(fr.result || ""), file.name);
    fr.onerror = () => RR.U.toast("Could not read that file");
    fr.readAsText(file);
  }
  function previewImport(text, filename) {
    const R = RR.Mods.parseText(text);
    if (!R.pack) {
      modal(`<h2 style="color:var(--bad)">Import rejected</h2>
        <p class="note">${esc(filename || "")} was not loaded. The base game is untouched.</p>
        <pre class="out">${esc(R.errors.join("\n"))}</pre>
        ${btn("closeModal", "Close", "pri")}`);
      return;
    }
    pendingImport = R.pack;
    const p = R.pack;
    const counts = ["maps", "weapons", "enemies", "themes", "campaigns", "sounds", "music"]
      .map((c) => `${c} ${p[c] ? Object.keys(p[c]).length : 0}`).join(" · ");
    modal(`<h2>Import preview</h2>
      <div class="card"><b>${esc(p.name)}</b>
        <div class="note">${esc(p.namespace)} · v${esc(p.version)} · by ${esc(p.author)}</div>
        ${p.description ? `<p class="note">${esc(p.description)}</p>` : ""}
        <div class="note">${esc(counts)}</div></div>
      ${gameTypeCard(p)}
      ${R.warnings.length ? `<pre class="out">${esc(R.warnings.slice(0, 30).join("\n"))}</pre>` : ""}
      <p class="note">Mods cannot contain code. This file was parsed as data only.</p>
      <div class="grid g2">${btn("importOk", "Enable this mod", "pri")}${btn("closeModal", "Cancel")}</div>`);
  }

  /* Everything in a pack you can actually press play on, with the fully
     namespaced ids the game needs to launch it. */
  function playable(pack) {
    const ns = pack.namespace || "";
    const full = (id) => (String(id).indexOf(":") >= 0 ? id : ns + ":" + id);
    const mapName = (id) => {
      const m = (pack.maps && (pack.maps[id] || pack.maps[String(id).split(":").pop()]));
      return (m && m.name) || id;
    };
    const out = [];
    for (const cid in (pack.campaigns || {}))
      out.push({ kind: "campaign", id: full(cid), label: (pack.campaigns[cid].name || cid),
        where: "Campaign", levels: (pack.campaigns[cid].levels || []).length });
    const ar = pack.arenas || {};
    for (const mode of ["ffa", "tdm"])
      for (const mid of (ar[mode] || []))
        out.push({ kind: mode, id: full(mid), label: mapName(mid),
          where: mode === "ffa" ? "Free For All" : "Team Deathmatch" });
    for (const mid of ((pack.horde && pack.horde.maps) || []))
      out.push({ kind: "horde", id: full(mid), label: mapName(mid), where: "Zombie Horde" });
    return out;
  }

  /* Answer the only question that matters after an import: where do I find
     this? Reads the pack's own blocks rather than guessing from the maps. */
  const GT_LABEL = {
    campaign: ["Campaign", "campaign"],
    ffa: ["Bot Match → Free For All", "dm"],
    tdm: ["Bot Match → Team Deathmatch", "dm"],
    horde: ["Zombie Horde", "horde"],
  };
  function gameTypes(p) {
    const out = [];
    const n = (o) => (o ? Object.keys(o).length : 0);
    if (n(p.campaigns)) out.push({ type: "campaign", count: n(p.campaigns), unit: "run" });
    const ar = p.arenas || {};
    if (ar.ffa && ar.ffa.length) out.push({ type: "ffa", count: ar.ffa.length, unit: "map" });
    if (ar.tdm && ar.tdm.length) out.push({ type: "tdm", count: ar.tdm.length, unit: "map" });
    if (p.horde && p.horde.maps && p.horde.maps.length) out.push({ type: "horde", count: p.horde.maps.length, unit: "map" });
    return out;
  }
  function gameTypeCard(p) {
    const gt = gameTypes(p);
    if (!gt.length) {
      const maps = p.maps ? Object.keys(p.maps).length : 0;
      if (!maps) return "";
      return `<div class="card"><b>Where it lands</b><p class="note">This mod carries ${maps} map(s) but no game type,
        so nothing new appears in the menus. Open it in the editor and set a Game type, or add a
        <code>campaigns</code>, <code>arenas</code> or <code>horde</code> block.</p></div>`;
    }
    return `<div class="card"><b>Where it lands</b>` + gt.map((g) =>
      `<div class="kv"><span>${esc(GT_LABEL[g.type][0])}</span><b>+${g.count} ${esc(g.unit)}${g.count > 1 ? "s" : ""}</b></div>`).join("") +
      `<p class="note">Enable it and it shows up there straight away.</p></div>`;
  }

  const API = { show, hide, bind, pause, resume, endScreen, interLevel, quitToMenu, modal, closeModal,
    previewImport, scoreTable, beginPlay, _probe: 0, _probeOn: false,
    get current() { return current; } };
  return API;
})();

    { ch: "w", name: "Window", col: "#7fd4ff" },
    { ch: "v", name: "Beam", col: "#6e7684" },
    { ch: "n", name: "Counter", col: "#c9a06a" },
    { ch: "*", name: "Lamp", col: "#ffe08a" },
    { ch: "X", name: "Exit", col: "#5ee08a" },
    { ch: "P", name: "Player", col: "#4fd0ff" },
    { ch: "E", name: "Enemy", col: "#ff5a48" },
    { ch: "Z", name: "Zombie", col: "#8fd44f" },
    { ch: "m", name: "DM spawn", col: "#d8d8d8" },
    { ch: "1", name: "Team A", col: "#3aa8e0" },
    { ch: "2", name: "Team B", col: "#e0803a" },
    { ch: "s", name: "SMG", col: "#d98b3a" },
    { ch: "g", name: "Shotgun", col: "#ff9d2e" },
    { ch: "K", name: "Rocket", col: "#ff5a48" },
    { ch: "a", name: "Ammo", col: "#d8c46a" },
    { ch: "A", name: "Armour", col: "#4a9cc4" },
    { ch: "C", name: "Checkpoint", col: "#5ee08a" },
  ];
  const COLOF = {}; for (const t of TOOLS) COLOF[t.ch] = t.col;

  /* One list drives the editor selector, the top-bar badge and the sentence
     that tells you which menu the finished mod turns up in. */
  const GAMETYPES = [
    ["campaign", "Campaign level"],
    ["ffa", "Free For All arena"],
    ["tdm", "Team Deathmatch arena"],
    ["horde", "Zombie Horde map"],
  ];
  const LANDS = {
    campaign: "Appears under Campaign as its own run, once the mod is enabled.",
    ffa:      "Appears in the map list under Bot Match → Free For All.",
    tdm:      "Appears in the map list under Bot Match → Team Deathmatch.",
    horde:    "Joins the Zombie Horde map rotation alongside the built-in maps.",
  };
  function gameTypeName(m) { const f = GAMETYPES.find((g) => g[0] === m); return f ? f[1] : m; }
  function whereItLands(m) { return LANDS[m] || ""; }

  function blank(w, h) {
    const g = [];
    for (let y = 0; y < h; y++) {
      let r = "";
      for (let x = 0; x < w; x++) r += (x === 0 || y === 0 || x === w - 1 || y === h - 1) ? "#" : ".";
      g.push(r);
    }
    g[Math.floor(h / 2)] = setCh(g[Math.floor(h / 2)], 2, "P");
    return g;
  }
  function setCh(s, i, ch) { return s.slice(0, i) + ch + s.slice(i + 1); }

  /* Enemy roster split by sprite family so the two spawn pickers below can
     offer the right list: E markers get shooters, Z markers get undead. */
  function roster() {
    const R = RR.Mods.resolved || {};
    const out = { human: [], undead: [] };
    for (const k in (R.enemies || {})) {
      const e = R.enemies[k];
      if (!e || e._full !== k) continue;
      (e.sprite === "undead" || e.melee ? out.undead : out.human).push([k, e.name || k]);
    }
    out.human.sort(); out.undead.sort();
    return out;
  }
  function mix()  { if (!Array.isArray(E.mix)  || !E.mix.length)  E.mix  = ["core:guard"];     return E.mix; }
  function zmix() { if (!Array.isArray(E.zmix) || !E.zmix.length) E.zmix = ["core:shambler"];  return E.zmix; }
  /* The mix a test drive should use: horde maps fight the undead list. */
  function testMix() { return E.mode === "horde" ? zmix().slice() : mix().slice(); }

  /* Chip picker. Each chip toggles one enemy id in or out of the list; the
     list is exactly what ends up in the exported .raymod, so what you tick
     here is what the map ships with. */
  function mixBox(kind) {
    const rs = roster();
    const list = kind === "z" ? rs.undead : rs.human;
    const other = kind === "z" ? rs.human : rs.undead;
    const cur = kind === "z" ? zmix() : mix();
    const chip = (k, name) =>
      `<button class="palbtn chip ${cur.indexOf(k) >= 0 ? "sel" : ""}" data-eact="mixTog" data-earg="${esc(kind + "|" + k)}">${esc(name)}</button>`;
    return `<div class="chips">${list.map((t) => chip(t[0], t[1])).join("")}</div>` +
      (other.length ? `<details style="margin-top:6px"><summary class="note">Also allow ${kind === "z" ? "shooters" : "undead"} here</summary>
        <div class="chips" style="margin-top:6px">${other.map((t) => chip(t[0], t[1])).join("")}</div></details>` : "") +
      `<div class="note" style="margin-top:6px">Selected: <b>${esc(cur.join(", ") || "none")}</b>${kind === "z" ? " · used by Zombie Horde rounds and by every Z marker" : " · cycled across every E marker"}</div>`;
  }
  function spawnSummary() {
    const q = quickStats();
    const notes = [];
    if (E.mode === "horde") notes.push(q.Z ? q.Z + " zombie spawn point(s)" : "no Z markers — the horde will fall back to E markers");
    else notes.push(q.E ? q.E + " enemy spawn point(s)" : "no E markers — paint some with the Enemy tool");
    if (E.mode !== "horde" && q.Z) notes.push(q.Z + " Z marker(s) (ignored outside Horde)");
    if (!q.P) notes.push("no player spawn");
    return notes.join(" · ");
  }

  function newProject(w, h) {
    return {
      id: "my-map", name: "My Map", ns: "mymod", modName: "My Mod", author: "you",
      theme: "core:security", objective: "Clear it, then reach the exit.",
      mode: "campaign", grid: blank(w || 24, h || 20),
      tool: "#", zoom: 0, panX: 0, panY: 0,
      rules: { bots: 5, scoreLimit: 15, timeLimit: 300, respawn: 2.5,
        baseCount: 6, perRound: 3, breakTime: 9 },
      mix: ["core:guard"],          /* which enemies use the E markers      */
      zmix: ["core:shambler"],      /* which undead use the Z markers       */
    };
  }

  /* ------------------------------------------------------------------ draw */
  function fit() {
    if (!E || !cvs) return;
    const box = el("edCanvasBox");
    const w = box.clientWidth, h = box.clientHeight;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cvs.width = Math.max(1, (w * dpr) | 0); cvs.height = Math.max(1, (h * dpr) | 0);
    ctx = cvs.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!E.zoom) {
      E.zoom = Math.max(6, Math.min(Math.floor(w / E.grid[0].length), Math.floor(h / E.grid.length)));
      E.panX = (w - E.grid[0].length * E.zoom) / 2;
      E.panY = (h - E.grid.length * E.zoom) / 2;
    }
    paintCanvas();
  }
  let cpIndex = Object.create(null);
  function paintCanvas() {
    if (!ctx || !E) return;
    cpIndex = Object.create(null);
    { let k = 0;
      for (let y = 0; y < E.grid.length; y++)
        for (let x = 0; x < E.grid[y].length; x++)
          if (E.grid[y][x] === "C") cpIndex[y * 1000 + x] = ++k; }
    const w = cvs.clientWidth || el("edCanvasBox").clientWidth;
    const h = cvs.clientHeight || el("edCanvasBox").clientHeight;
    ctx.fillStyle = "#04060a"; ctx.fillRect(0, 0, w, h);
    const z = E.zoom, gx = E.panX, gy = E.panY;
    const rows = E.grid.length, cols = E.grid[0].length;
    ctx.font = Math.max(7, Math.floor(z * 0.6)) + "px ui-monospace,monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (let y = 0; y < rows; y++) {
      const sy = gy + y * z;
      if (sy + z < 0 || sy > h) continue;
      for (let x = 0; x < cols; x++) {
        const sx = gx + x * z;
        if (sx + z < 0 || sx > w) continue;
        const ch = E.grid[y][x];
        const solid = "#=%".indexOf(ch) >= 0;
        ctx.fillStyle = solid ? COLOF[ch] : "#161c26";
        ctx.fillRect(sx, sy, z - 1, z - 1);
        if (!solid && ch !== ".") {
          ctx.fillStyle = COLOF[ch] || "#fff";
          if (ch === "+" || ch === "o" || ch === "b" || ch === "n") ctx.fillRect(sx + 1, sy + 1, z - 3, z - 3);
          else if (ch === "r") { ctx.fillRect(sx + 1, sy + z * 0.35, z - 3, Math.max(2, z * 0.3)); }
          else if (ch === "w") { ctx.fillRect(sx + 1, sy + 1, z - 3, Math.max(2, z * 0.28)); ctx.fillRect(sx + 1, sy + z * 0.62, z - 3, Math.max(2, z * 0.28)); }
          else if (ch === "v") { ctx.globalAlpha = 0.5; ctx.fillRect(sx + 1, sy + 1, z - 3, z - 3); ctx.globalAlpha = 1; }
          else {
            ctx.beginPath(); ctx.arc(sx + z / 2, sy + z / 2, Math.max(2, z * 0.3), 0, M.TAU); ctx.fill();
            if (z > 13) {
              ctx.fillStyle = "#04060a";
              /* checkpoints show their number, not their symbol */
              ctx.fillText(ch === "C" ? String(cpIndex[y * 1000 + x] || "C") : ch, sx + z / 2, sy + z / 2 + 1);
            }
          }
        }
      }
    }
    if (z > 9) {
      ctx.strokeStyle = "rgba(90,120,160,.10)"; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= cols; x++) { ctx.moveTo(gx + x * z, gy); ctx.lineTo(gx + x * z, gy + rows * z); }
      for (let y = 0; y <= rows; y++) { ctx.moveTo(gx, gy + y * z); ctx.lineTo(gx + cols * z, gy + y * z); }
      ctx.stroke();
    }
    ctx.strokeStyle = "#39506e"; ctx.lineWidth = 2;
    ctx.strokeRect(gx - 1, gy - 1, cols * z + 2, rows * z + 2);
  }

  /* --------------------------------------------------------------- painting */
  function cellAtPx(px, py) {
    const r = cvs.getBoundingClientRect();
    const x = Math.floor((px - r.left - E.panX) / E.zoom);
    const y = Math.floor((py - r.top - E.panY) / E.zoom);
    if (x < 0 || y < 0 || y >= E.grid.length || x >= E.grid[0].length) return null;
    return [x, y];
  }
  function paintAt(px, py) {
    const c = cellAtPx(px, py);
    if (!c) return;
    const key = c[0] + "," + c[1];
    if (key === lastPaint) return;
    lastPaint = key;
    const [x, y] = c;
    let ch = E.tool;
    /* unique markers: only one player spawn / exit at a time */
    if (ch === "P" || ch === "X") {
      for (let yy = 0; yy < E.grid.length; yy++)
        if (E.grid[yy].indexOf(ch) >= 0) E.grid[yy] = E.grid[yy].replace(new RegExp("\\" + ch, "g"), ".");
    }
    E.grid[y] = setCh(E.grid[y], x, ch);
    paintCanvas();
    if ("PEZXm12C".indexOf(ch) >= 0) el("edSide").innerHTML = sideHtml();
    if (ch === "C" || E._hadC) status(cpStatus());
    else status();
  }
  /* Checkpoints are numbered by reading order — the same order the engine
     assigns at load — so what the editor labels 1,2,3 is what you reach 1,2,3. */
  function checkpointList() {
    const out = [];
    for (let y = 0; y < E.grid.length; y++)
      for (let x = 0; x < E.grid[y].length; x++)
        if (E.grid[y][x] === "C") out.push([x, y, out.length + 1]);
    E._hadC = out.length > 0;
    return out;
  }
  function cpStatus() {
    const cps = checkpointList();
    if (!cps.length) return "No checkpoints — paint one with the Checkpoint tool";
    return "Checkpoint " + cps.map((c) => c[2]).join(", ") + " · numbered top-left to bottom-right, " +
      "so checkpoint 1 is the one nearest the start of the level as you read the grid";
  }
  function onDown(e) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    const n = Object.keys(pointers).length;
    if (n === 2) {
      const p = Object.values(pointers);
      pinch = { d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), z: E.zoom,
        cx: (p[0].x + p[1].x) / 2, cy: (p[0].y + p[1].y) / 2, panX: E.panX, panY: E.panY };
      lastPaint = "x";
      return;
    }
    if (n === 1 && !panMode) { lastPaint = ""; paintAt(e.clientX, e.clientY); }
    e.preventDefault();
  }
  function onMove(e) {
    const rec = pointers[e.pointerId]; if (!rec) return;
    const prev = { x: rec.x, y: rec.y };
    rec.x = e.clientX; rec.y = e.clientY;
    const n = Object.keys(pointers).length;
    if (n >= 2 && pinch) {
      const p = Object.values(pointers);
      const d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      const nz = M.clamp(Math.round(pinch.z * (d / Math.max(1, pinch.d))), 5, 44);
      const cx = (p[0].x + p[1].x) / 2, cy = (p[0].y + p[1].y) / 2;
      const r = cvs.getBoundingClientRect();
      const gxBefore = (pinch.cx - r.left - pinch.panX) / pinch.z;
      const gyBefore = (pinch.cy - r.top - pinch.panY) / pinch.z;
      E.zoom = nz;
      E.panX = (cx - r.left) - gxBefore * nz;
      E.panY = (cy - r.top) - gyBefore * nz;
      paintCanvas();
      e.preventDefault(); return;
    }
    if (panMode) {
      E.panX += rec.x - prev.x; E.panY += rec.y - prev.y;
      paintCanvas();
    } else paintAt(e.clientX, e.clientY);
    e.preventDefault();
  }
  function onUp(e) {
    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinch = null;
    lastPaint = "";
  }

  /* -------------------------------------------------------------- side bar */
  /* Which spawn tools matter for the current game type, so the palette leads
     with the ones this map actually needs instead of a flat list of 25. */
  const TYPE_TOOLS = {
    campaign: [["P", "Player start"], ["E", "Enemy spawn"], ["X", "Exit"], ["C", "Checkpoint"]],
    ffa:      [["m", "DM spawn"]],
    tdm:      [["1", "Team A spawn"], ["2", "Team B spawn"], ["m", "DM spawn"]],
    horde:    [["P", "Player start"], ["Z", "Zombie spawn"]],
  };
  function needHtml() {
    const need = (RR.World.MODE_NEEDS || {})[E.mode];
    if (!need) return "";
    const q = quickStats();
    const rows = (TYPE_TOOLS[E.mode] || []).map((t) => {
      const ch = t[0];
      const count = ch === "X" ? (q.X ? 1 : 0) : (q[ch] || 0);
      const min = ch === "P" ? (need.player || 0) : ch === "E" ? ((need.want && need.want.enemy) || 0)
        : ch === "Z" ? (need.zombie || 0) : ch === "m" ? (need.dm || 0)
        : ch === "1" ? (need.teamA || 0) : ch === "2" ? (need.teamB || 0)
        : ch === "X" ? (need.exit ? 1 : 0) : 0;
      const ok = count >= min;
      return `<button class="palbtn ${E.tool === ch ? "sel" : ""}" data-eact="tool" data-earg="${esc(ch)}">
        <span class="sw" style="background:${COLOF[ch] || "#888"}"></span>${esc(t[1])}
        <b style="margin-left:auto;color:${ok ? "var(--ok)" : "var(--bad)"}">${count}${min ? "/" + min : ""}</b></button>`;
    }).join("");
    return `<div class="palhead">${esc(need.label)}</div>${rows}<div class="hr"></div>`;
  }
  function sideHtml() {
    return needHtml() + `<div class="palhead">All tools</div>` + TOOLS.map((t) =>
      `<button class="palbtn ${E.tool === t.ch ? "sel" : ""}" data-eact="tool" data-earg="${esc(t.ch)}">
        <span class="sw" style="background:${t.col}"></span>${esc(t.name)}</button>`).join("") +
      `<div class="hr"></div>
       <button class="palbtn ${panMode ? "sel" : ""}" data-eact="pan">✋ Pan mode</button>
       <button class="palbtn" data-eact="zin">＋ Zoom in</button>
       <button class="palbtn" data-eact="zout">－ Zoom out</button>
       <button class="palbtn" data-eact="fill">▦ Fill floor</button>
       <button class="palbtn" data-eact="border">▣ Seal border</button>`;
  }
  function topHtml() {
    return `<span class="ttl">EDITOR</span><span class="gtbadge" data-eact="props">${esc(gameTypeName(E.mode).toUpperCase())}</span>
      ${b("test", "▶ Test", "pri")}${b("validate", "✓ Validate")}${b("props", "⚙ Map")}
      ${b("save", "💾 Save")}${b("load", "📂 Drafts")}${b("newmap", "＋ New")}
      ${b("export", "⇩ Export")}${b("import", "⇧ Import")}${b("prompt", "🤖 Claude")}
      ${b("close", "✕ Exit", "dang")}`;
  }
  function b(act, label, cls) { return `<button class="btn sm ${cls || ""}" data-eact="${act}">${esc(label)}</button>`; }

  function status(msg) {
    const stats = quickStats();
    el("edStatus").textContent = msg ? msg :
      `${E.name} · ${E.grid[0].length}×${E.grid.length} · ${gameTypeName(E.mode)} · theme ${E.theme} · ` +
      `P${stats.P} E${stats.E} Z${stats.Z} m${stats.m} 1/2 ${stats["1"]}/${stats["2"]} doors ${stats["+"]} ` +
      `rail ${stats.r} win ${stats.w} lamp ${stats["*"]} cp ${stats.C} exit ${stats.X ? "yes" : "no"}`;
  }
  function quickStats() {
    const s = { P: 0, E: 0, Z: 0, m: 0, "1": 0, "2": 0, "+": 0, X: 0, r: 0, w: 0, v: 0, "*": 0,
      C: 0, s: 0, g: 0, a: 0, A: 0, K: 0 };
    for (const r of E.grid) for (const ch of r) if (s[ch] !== undefined) s[ch]++;
    return s;
  }

  /* ------------------------------------------------------------- build mod */
  function mapDef() {
    return { id: E.id, _full: E.ns + ":" + E.id, name: E.name, theme: E.theme,
      objective: E.objective, grid: E.grid.slice() };
  }
  function buildPack() {
    const p = {
      schema: RR.SCHEMA, id: E.ns + "-" + E.id, namespace: E.ns, name: E.modName || E.name,
      author: E.author || "you", version: "1.0.0",
      description: "Built with the in-game editor.",
      maps: { [E.id]: { name: E.name, theme: E.theme, objective: E.objective, grid: E.grid.slice() } },
    };
    if (E.mode === "campaign") {
      p.campaigns = { [E.id + "-run"]: { name: E.name, levels: [{ map: E.id, mix: E.mix.slice() }] } };
    } else if (E.mode === "ffa" || E.mode === "tdm") {
      p.arenas = { [E.mode]: [E.id] };
      p.rules = { [E.mode]: { bots: E.rules.bots, scoreLimit: E.rules.scoreLimit, timeLimit: E.rules.timeLimit, respawn: E.rules.respawn } };
    } else if (E.mode === "horde") {
      p.horde = { maps: [E.id], baseCount: E.rules.baseCount, perRound: E.rules.perRound,
        breakTime: E.rules.breakTime, unlock: [{ round: 1, mix: zmix().slice() }] };
    }
    return p;
  }

  /* --------------------------------------------------------------- actions */
  const EACT = {
    tool(ch) { E.tool = ch; el("edSide").innerHTML = sideHtml(); },
    pan() { panMode = !panMode; el("edSide").innerHTML = sideHtml(); status(panMode ? "Pan mode ON — drag to move the view" : ""); },
    zin() { E.zoom = M.clamp(E.zoom + 3, 5, 44); paintCanvas(); },
    zout() { E.zoom = M.clamp(E.zoom - 3, 5, 44); paintCanvas(); },
    fill() {
      for (let y = 1; y < E.grid.length - 1; y++) {
        let r = E.grid[y];
        for (let x = 1; x < r.length - 1; x++) if ("#=%".indexOf(r[x]) >= 0) r = setCh(r, x, ".");
        E.grid[y] = r;
      }
      paintCanvas(); status("Interior cleared to floor");
    },
    border() {
      const w = E.grid[0].length, h = E.grid.length;
      for (let x = 0; x < w; x++) { E.grid[0] = setCh(E.grid[0], x, "#"); E.grid[h - 1] = setCh(E.grid[h - 1], x, "#"); }
      for (let y = 0; y < h; y++) { E.grid[y] = setCh(E.grid[y], 0, "#"); E.grid[y] = setCh(E.grid[y], w - 1, "#"); }
      paintCanvas(); status("Border sealed");
    },
    validate() {
      const R = RR.World.validateMap(mapDef(), E.mode);
      const s = R.stats || {};
      RR.UI.modal(`<h2>${R.ok ? "<span style='color:var(--ok)'>Map is valid</span>" : "<span style='color:var(--bad)'>Problems found</span>"}</h2>
        <pre class="out">${esc(
          (R.errors.length ? "ERRORS\n" + R.errors.map((e) => " • " + e).join("\n") + "\n\n" : "") +
          (R.warnings.length ? "WARNINGS\n" + R.warnings.map((e) => " • " + e).join("\n") + "\n\n" : "") +
          "STATS\n" + Object.keys(s).map((k) => " " + k.padEnd(12) + s[k]).join("\n"))}</pre>
        <button class="btn pri" data-act="closeModal">Close</button>`);
    },
    test() {
      const R = RR.World.validateMap(mapDef(), E.mode);
      if (!R.ok) { EACT.validate(); return; }
      RR.UI.closeModal();
      close();
      const S = RR.Game.start({ mode: "edtest", mapDef: mapDef(), mix: testMix(), simMode: E.mode });
      if (!S) { open(); RR.U.toast("Could not start test"); return; }
      S.fromEditor = true;
      RR.paused = false;
      el("hud").classList.add("show");
      RR.In.requestLock();
    },
    mixTog(arg) {
      const i = String(arg || "").indexOf("|");
      if (i < 0) return;
      const kind = arg.slice(0, i), id = arg.slice(i + 1);
      const cur = kind === "z" ? zmix() : mix();
      const at = cur.indexOf(id);
      if (at >= 0) { if (cur.length > 1) cur.splice(at, 1); else return RR.U.toast("Keep at least one"); }
      else cur.push(id);
      const box = el(kind === "z" ? "pZmixBox" : "pMixBox");
      if (box) box.innerHTML = mixBox(kind);
    },
    propsTest() { EACT.propsOk(); EACT.test(); },
    props() {
      const themes = [];
      const R = RR.Mods.resolved || {};
      for (const k in (R.themes || {})) { const t = R.themes[k]; if (t._full === k) themes.push([k, (t.name || k) + " (" + t._ns + ")"]); }
      RR.UI.modal(`<h2>Map settings</h2>
        <label class="row"><span>Map name</span><input type="text" id="pName" value="${esc(E.name)}"></label>
        <label class="row"><span>Map id</span><input type="text" id="pId" value="${esc(E.id)}"></label>
        <label class="row"><span>Mod name</span><input type="text" id="pMod" value="${esc(E.modName)}"></label>
        <label class="row"><span>Namespace</span><input type="text" id="pNs" value="${esc(E.ns)}"></label>
        <label class="row"><span>Author</span><input type="text" id="pAuthor" value="${esc(E.author)}"></label>
        <label class="row"><span>Theme</span><select id="pTheme">${themes.map((t) => `<option value="${esc(t[0])}"${t[0] === E.theme ? " selected" : ""}>${esc(t[1])}</option>`).join("")}</select></label>

  function resize(w, h) {
    const old = E.grid, oh = old.length, ow = old[0].length;

    for (let y = 0; y < h; y++) {
      let r = "";
      for (let x = 0; x < w; x++) {
        const border = (x === 0 || y === 0 || x === w - 1 || y === h - 1);
        if (y < oh && x < ow) r += border ? "#" : old[y][x];
        else r += border ? "#" : ".";

    el("modalBox").addEventListener("click", handler);

  function cloneCore() {
    const core = RR.CORE;
    const pack = {
      schema: RR.SCHEMA, id: "core-clone", namespace: "myclone", name: "Core Clone",
      author: "you", version: "1.0.0",
      description: "Editable copy of the default content. Change anything; the protected core pack is untouched.",

      weapons: JSON.parse(JSON.stringify(core.weapons)),
      aiWeapons: JSON.parse(JSON.stringify(core.aiWeapons)),
      enemies: JSON.parse(JSON.stringify(core.enemies)),
      maps: {}, music: JSON.parse(JSON.stringify(core.music)),
      campaigns: {}, bots: JSON.parse(JSON.stringify(core.bots)),

    for (const id in core.maps) {
      const m = core.maps[id];
      pack.maps[id] = { name: m.name, theme: m.theme, objective: m.objective, grid: m.grid.slice() };
    }
    for (const id in core.campaigns) {
      const c = core.campaigns[id];

    RR.UI.modal(`<h2>Clone core content</h2>

    EACT.cloneInstall = () => {
      const V = RR.Mods.validatePack(pack, {});

      RR.Mods.addPack(V.pack, true);
      RR.UI.closeModal(); RR.UI.show("mods");
      RR.U.toast("Core clone installed");

    set project(v) { E = v || newProject(24, 20); } };
