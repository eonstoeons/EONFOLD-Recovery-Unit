<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HOSTILE SECTOR: V01D</title>
<link rel="icon" href="data:,">
<style>
/* ============================================================================
   HOSTILE SECTOR: V01D :: STYLE
   Single-file, no external fonts, no network. Everything below is layout only.
   ========================================================================= */
:root{
  --bg:#07080c; --ink:#c8d4e0; --dim:#6b7a8c; --acc:#ff9d2e; --acc2:#4fd0ff;
  --ok:#5ee08a; --bad:#ff4d5e; --panel:#0e1119; --panel2:#141926; --line:#26304a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --ui:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#000;
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  color:var(--ink);overscroll-behavior:none;
  /* NOT touch-action:none — that is inherited by every panel and made the
     menus, settings, mod list and modals impossible to SCROLL on a phone, so
     anything below the fold could never be reached. The game surface opts
     out individually below. */
  touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#app{position:fixed;inset:0;background:var(--bg);}
canvas#view,canvas#viewgl,canvas#vmcanvas{position:absolute;inset:0;width:100%;height:100%;
  display:block;background:#000;touch-action:none;}
canvas#view{image-rendering:pixelated;image-rendering:crisp-edges;}
canvas#viewgl{display:none;background:#000;}
canvas#vmcanvas{background:transparent;pointer-events:none;z-index:15;
  image-rendering:pixelated;image-rendering:crisp-edges;}

/* ---------- generic controls ---------- */
button,select,input{font:inherit;color:inherit;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:6px;
  background:linear-gradient(180deg,#1b2233,#10141e);color:var(--ink);
  font-size:var(--ui);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;}
.btn:active{background:#232c42;transform:translateY(1px);}
.btn.pri{border-color:var(--acc);color:#fff;background:linear-gradient(180deg,#a2560f,#5c3008);}
.btn.dang{border-color:var(--bad);color:#ffd6da;background:linear-gradient(180deg,#5c1620,#2a0a10);}
.btn.sm{min-height:34px;padding:6px 10px;font-size:12px;}
.btn.on{border-color:var(--ok);color:#dfffe9;background:linear-gradient(180deg,#154d2c,#0a2417);}
.btn[disabled]{opacity:.4;pointer-events:none;}
select,input[type=text],input[type=number],textarea{
  background:#080b12;border:1px solid var(--line);border-radius:5px;padding:9px;
  min-height:40px;width:100%;font-size:var(--ui);}
textarea{min-height:120px;resize:vertical;line-height:1.4;}
input[type=range]{width:100%;height:36px;background:transparent;}
label.row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 0;font-size:13px;color:var(--dim);letter-spacing:.05em;}
label.row > span{flex:0 0 46%;text-transform:uppercase;}
label.row > *:last-child{flex:1;}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:none;overflow-y:auto;overscroll-behavior:contain;
  touch-action:pan-y;-webkit-overflow-scrolling:touch;
  -webkit-overflow-scrolling:touch;z-index:40;
  padding:calc(14px + var(--sat)) calc(14px + var(--sar)) calc(20px + var(--sab)) calc(14px + var(--sal));
  background:radial-gradient(120% 90% at 50% 0%,#101828 0%,#05060a 70%);}
.screen.show{display:block;}
.wrap{max-width:760px;margin:0 auto;}
h1.logo{margin:14px 0 2px;font-size:clamp(24px,7.6vw,46px);letter-spacing:.10em;
  color:var(--acc);text-shadow:0 0 18px rgba(255,157,46,.35);text-align:center;line-height:1.05;}
h1.logo .l2{display:block;font-size:clamp(28px,9.4vw,58px);letter-spacing:.16em;color:#fff;
  text-shadow:0 0 22px rgba(255,157,46,.55),0 2px 0 #000;}
h1.logo .l2 i{font-style:normal;color:var(--acc);}
h1.logo small{display:block;font-size:11px;letter-spacing:.4em;color:var(--dim);
  margin-top:8px;text-shadow:none;}
h2{font-size:15px;letter-spacing:.18em;color:var(--acc2);text-transform:uppercase;
  margin:20px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px;}
h3{font-size:13px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin:14px 0 6px;}
p.note{font-size:12px;line-height:1.6;color:var(--dim);margin:6px 0;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;margin:10px 0;}
.grid{display:grid;gap:9px;}
.g2{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:520px){.g3,.g4{grid-template-columns:repeat(2,1fr);}}
.stack{display:flex;flex-direction:column;gap:9px;}
.rowflex{display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--dim);}
.kv b{color:var(--ink);font-weight:400;}
.tag{display:inline-block;font-size:10px;letter-spacing:.1em;padding:2px 6px;border-radius:3px;
  border:1px solid var(--line);color:var(--dim);text-transform:uppercase;}
.tag.core{border-color:var(--acc);color:var(--acc);}
.tag.on{border-color:var(--ok);color:var(--ok);}
.tag.off{border-color:var(--bad);color:var(--bad);}
pre.out{background:#04060a;border:1px solid var(--line);border-radius:6px;padding:10px;
  font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:44vh;overflow:auto;}
.hr{height:1px;background:var(--line);margin:14px 0;}
.center{text-align:center;}
.scroll-x{overflow-x:auto;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20;display:none;
  padding:calc(6px + var(--sat)) calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));}
#hud.show{display:block;}
.hudbar{position:absolute;left:calc(10px + var(--sal));right:calc(10px + var(--sar));
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-size:12px;}
#hudTop{top:calc(8px + var(--sat));}
#hudBot{bottom:calc(10px + var(--sab));align-items:flex-end;}
.pill{background:rgba(6,9,14,.72);border:1px solid var(--line);border-radius:5px;
  padding:5px 9px;letter-spacing:.08em;white-space:nowrap;flex:0 0 auto;max-width:46%;
  overflow:hidden;text-overflow:ellipsis;}
.pill b{color:#fff;font-weight:400;}
.hp .bar{width:110px;height:7px;background:#2a0d12;border:1px solid #48202a;margin-top:4px;border-radius:2px;overflow:hidden;}
.hp .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff4d5e,#ff9d2e);transition:width .12s linear;}
.hp .bar.arm{background:#0d2836;border-color:#1e4c63;}
.hp .bar.arm i{background:linear-gradient(90deg,#2f8fc4,#7fd8ff);}
#hArmor{display:block;margin-top:3px;}
#crosshair{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:.85;}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#e8f4ff;box-shadow:0 0 3px #000;}
#crosshair:before{left:50%;top:0;width:1.5px;height:100%;margin-left:-.75px;}
#crosshair:after{top:50%;left:0;height:1.5px;width:100%;margin-top:-.75px;}
#dmgFlash{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,transparent 45%,rgba(255,20,40,.55));
  opacity:0;transition:opacity .18s;}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:clamp(18px,5vw,30px);
  letter-spacing:.2em;color:var(--acc);text-shadow:0 2px 0 #000,0 0 22px rgba(255,157,46,.5);opacity:0;transition:opacity .25s;}
#banner small{display:block;font-size:12px;letter-spacing:.18em;color:var(--ink);margin-top:8px;text-shadow:0 1px 0 #000;}
#killfeed{position:absolute;right:calc(10px + var(--sar));top:calc(86px + var(--sat));text-align:right;font-size:11px;line-height:1.7;color:var(--dim);}
#minimapWrap{position:absolute;left:calc(10px + var(--sal));top:calc(78px + var(--sat));
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));}
canvas#minimap{display:block;border-radius:50%;}
#plates{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.plate{position:absolute;white-space:nowrap;font-size:11px;letter-spacing:.08em;
  padding:2px 7px;border-radius:4px;background:rgba(6,9,14,.72);border:1px solid;
  text-shadow:0 1px 0 #000;line-height:1.25;}
.plate i{display:block;height:3px;margin-top:2px;background:currentColor;border-radius:2px;opacity:.85;}
/* teammates blue, enemies red */
.plate.ally{color:#4fc9ff;border-color:rgba(79,201,255,.6);}
.plate.foe{color:#ff5b5b;border-color:rgba(255,91,91,.6);}
@media(max-height:430px){#minimapWrap{top:calc(66px + var(--sat));}}
#scorebd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:min(420px,86vw);
  background:rgba(6,9,14,.92);border:1px solid var(--line);border-radius:8px;padding:12px;display:none;}
#scorebd.show{display:block;}
#scorebd table{width:100%;border-collapse:collapse;font-size:12px;}
#scorebd td,#scorebd th{padding:4px 6px;text-align:left;border-bottom:1px solid #1b2233;}
#scorebd th{color:var(--dim);font-weight:400;letter-spacing:.1em;font-size:10px;text-transform:uppercase;}
.tA{color:#4fd0ff;} .tB{color:#ff8a5c;} .me{color:var(--acc);}

/* ---------- on-screen controls (rebuilt) ----------------------------------
 * Appearance only. Every control is POSITIONED AND SIZED IN JS by
 * RR.Touch.layout(), which solves for whatever shape the viewport actually
 * is. Nothing here assumes landscape, and nothing here assumes a phone.
 * ------------------------------------------------------------------------ */
#padToggle{position:absolute;left:50%;transform:translateX(-50%);top:calc(6px + var(--sat));
  z-index:35;min-height:32px;padding:6px 13px;font-size:10px;letter-spacing:.14em;
  border:1px solid var(--line);border-radius:15px;background:rgba(10,14,22,.85);color:var(--dim);
  text-transform:uppercase;cursor:pointer;display:none;touch-action:manipulation;}
#padToggle.show{display:block;}
#padToggle.on{color:var(--acc);border-color:var(--acc);}

/* The pad layer never scrolls, never zooms, and never lets the browser turn a
   drag into a gesture. touch-action:none is essential on the layer itself. */
#touch{position:absolute;inset:0;z-index:30;display:none;touch-action:none;
  -webkit-user-select:none;user-select:none;}
#touch.show{display:block;}

.stick{position:absolute;border-radius:50%;
  border:2px solid rgba(130,165,205,.34);background:rgba(10,16,26,.26);
  transition:opacity .12s linear;opacity:.78;}
.stick.live{opacity:1;border-color:rgba(150,190,235,.60);background:rgba(12,20,32,.36);transition:none;}
.stick i{position:absolute;left:50%;top:50%;width:40%;height:40%;margin:-20% 0 0 -20%;border-radius:50%;
  background:rgba(150,190,230,.32);border:2px solid rgba(180,215,255,.48);}
.stick u{position:absolute;left:0;right:0;top:-17px;text-align:center;font-size:9px;
  letter-spacing:.16em;color:rgba(165,195,225,.75);text-decoration:none;
  text-shadow:0 1px 2px rgba(0,0,0,.8);}
.stick.live u{opacity:0;}

.tbtn{position:absolute;display:flex;align-items:center;justify-content:center;
  border-radius:50%;border:2px solid rgba(120,150,190,.32);background:rgba(14,20,32,.52);
  color:#cfe0f0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  text-align:center;line-height:1.1;}
.tbtn.hit{background:rgba(255,157,46,.34);border-color:var(--acc);}
#bFire{font-size:13px;border-color:rgba(255,120,80,.5);background:rgba(90,26,14,.42);}
#bAds{border-color:rgba(120,190,255,.42);background:rgba(18,32,50,.5);}
#bAds.latched{background:rgba(120,190,255,.34);border-color:#7fc4ff;color:#eaf6ff;}

.wbtns{position:absolute;left:0;top:0;display:flex;gap:8px;}
.wbtn{border-radius:7px;border:2px solid rgba(120,150,190,.32);
  background:rgba(14,20,32,.52);color:#cfe0f0;font-size:10px;letter-spacing:.05em;
  display:flex;align-items:center;justify-content:center;text-transform:uppercase;}
.wbtn.sel{border-color:var(--acc);color:var(--acc);background:rgba(255,157,46,.16);}
.wbtn.no{opacity:.32;}
.wbtn.hit{background:rgba(255,157,46,.30);border-color:var(--acc);}
#bPause{position:absolute;border-radius:6px;border:1px solid rgba(120,150,190,.32);
  background:rgba(14,20,32,.6);color:#cfe0f0;font-size:13px;letter-spacing:.1em;
  display:flex;align-items:center;justify-content:center;}
#bPause.hit{background:rgba(255,157,46,.30);border-color:var(--acc);}

/* ---------- editor ---------- */
#edWrap{position:absolute;inset:0;display:none;flex-direction:column;z-index:45;background:#05060a;
  padding-top:var(--sat);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar);}
#edWrap.show{display:flex;}
.gtbadge{align-self:center;flex:0 0 auto;padding:4px 9px;border-radius:11px;cursor:pointer;
  border:1px solid var(--acc);color:var(--acc);background:rgba(255,157,46,.12);
  font-size:9px;letter-spacing:.14em;white-space:nowrap;}
/* one scrolling row: the canvas matters more than seeing every button at once */
#edTop{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);
  flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;touch-action:pan-x;
  align-items:center;background:#0a0d15;}
#edTop>*{flex:0 0 auto;}
#edTop .ttl{font-size:12px;letter-spacing:.16em;color:var(--acc);padding-right:4px;}
#edMain{flex:1;display:flex;min-height:0;}
#edCanvasBox{flex:1;position:relative;overflow:hidden;background:#020306;touch-action:none;}
canvas#edcanvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;}
#edSide{width:172px;flex:0 0 172px;border-left:1px solid var(--line);background:#0a0d15;
  overflow-y:auto;overscroll-behavior:contain;padding:8px;
  touch-action:pan-y;-webkit-overflow-scrolling:touch;}
@media(max-width:640px){#edSide{width:130px;flex-basis:130px;padding:6px;}}
.palbtn{display:flex;align-items:center;gap:6px;width:100%;min-height:32px;margin-bottom:4px;
  padding:4px 6px;border:1px solid var(--line);border-radius:4px;background:#101520;
  font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);text-align:left;}
.palbtn.sel{border-color:var(--acc);background:rgba(255,157,46,.14);color:var(--acc);}
.palhead{font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;
  margin:2px 0 5px;}
.palbtn b{font-weight:600;font-size:10px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips .palbtn{width:auto;flex:0 0 auto;margin:0;padding:5px 10px;min-height:30px;}
details>summary{cursor:pointer;user-select:none;}
.joincode{font:800 40px/1.1 ui-monospace,monospace;letter-spacing:9px;color:var(--acc);
  margin:6px 0 10px;text-shadow:0 0 18px rgba(255,157,46,.35);word-break:break-all;}
.sharecode{font:600 15px/1.35 ui-monospace,monospace;letter-spacing:2px;color:#cfe0f0;
  background:rgba(6,9,14,.7);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;margin-top:4px;word-break:break-all;user-select:all;}
.sw{width:16px;height:16px;border-radius:3px;flex:0 0 16px;border:1px solid #000;}
#edStatus{font-size:10px;color:var(--dim);padding:4px 8px;border-top:1px solid var(--line);
  background:#0a0d15;white-space:nowrap;overflow-x:auto;}

/* ---------- toast / modal ---------- */
#toast{position:absolute;left:50%;bottom:calc(18px + var(--sab));transform:translateX(-50%);
  background:rgba(8,12,20,.94);border:1px solid var(--line);border-radius:6px;padding:9px 14px;
  font-size:12px;letter-spacing:.05em;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center;}
#toast.show{opacity:1;}
#modal{position:absolute;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(2,4,8,.82);padding:calc(14px + var(--sat)) 14px calc(14px + var(--sab));}
#modal.show{display:flex;}
#modalBox{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;
  max-width:620px;width:100%;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;
  touch-action:pan-y;-webkit-overflow-scrolling:touch;}
#drop{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:rgba(255,157,46,.14);border:3px dashed var(--acc);font-size:18px;letter-spacing:.2em;color:#fff;}
#drop.show{display:flex;}
/* The old full-screen "rotate to landscape" blocker is gone for good: portrait
   is now a supported way to play, so there is nothing to nag about. */
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <canvas id="viewgl"></canvas>
  <canvas id="vmcanvas"></canvas>

  <!-- HUD ------------------------------------------------------------------>
  <div id="hud">
    <div id="dmgFlash"></div>
    <div id="crosshair"></div>
    <div class="hudbar" id="hudTop">
      <div class="pill" id="hObj">OBJECTIVE</div>
      <div class="pill" id="hEnemies">HOSTILES <b>0</b></div>
    </div>
    <div id="killfeed"></div>
    <div class="hudbar" id="hudBot">
      <div class="pill hp">HEALTH <b id="hHpNum">100</b><div class="bar"><i id="hHpBar" style="width:100%"></i></div>
        <span id="hArmor" style="display:none">ARMOUR <b id="hArmorNum">0</b><div class="bar arm"><i id="hArmorBar" style="width:0%"></i></div></span></div>
      <div class="pill" id="hFps" style="display:none">-- FPS</div>
      <div class="pill" id="hAmmo">PISTOL <b>12</b> / 48</div>
    </div>
    <div id="minimapWrap"><canvas id="minimap"></canvas></div>
    <div id="plates"></div>
    <div id="banner"></div>
    <div id="scorebd"></div>
  </div>

  <!-- ON-SCREEN CONTROLS ---------------------------------------------------->
  <!-- Labels carry the desktop key next to the action so the two control
       schemes read as the same game: FIRE=Space/LMB, AIM=Shift/RMB,
       RELOAD=R, USE=E, KNIFE=F, and the left stick is WASD. -->
  <button id="padToggle" type="button">▲ Controls</button>
  <div id="touch">
    <div class="stick" id="stickL"><i></i><u>MOVE · WASD</u></div>
    <div class="stick" id="stickR"><i></i><u>LOOK</u></div>
    <div class="tbtn" id="bFire">FIRE</div>
    <div class="tbtn" id="bAds">AIM<br>SHIFT</div>
    <div class="tbtn" id="bReload">RELOAD<br>R</div>
    <div class="tbtn" id="bKnife">KNIFE<br>F</div>
    <div class="tbtn" id="bUse">USE<br>E</div>
    <div class="wbtns">
      <div class="wbtn" data-wslot="0" id="wb0">1 PST</div>
      <div class="wbtn" data-wslot="1" id="wb1">2 SMG</div>
      <div class="wbtn" data-wslot="2" id="wb2">3 SHG</div>
      <div class="wbtn" data-wslot="3" id="wb3">4 RKT</div>
    </div>
    <div class="tbtn" id="bPause" style="border-radius:6px">❚❚</div>
  </div>

  <!-- SCREENS --------------------------------------------------------------->
  <div class="screen" id="menu"></div>
  <div id="edWrap">
    <div id="edTop"></div>
    <div id="edMain">
      <div id="edCanvasBox"><canvas id="edcanvas"></canvas></div>
      <div id="edSide"></div>
    </div>
    <div id="edStatus">ready</div>
  </div>

  <div id="modal"><div id="modalBox"></div></div>
  <div id="drop">DROP .raymod FILE</div>
  <div id="toast"></div>
</div>
<input type="file" id="fileIn" accept=".raymod,.json,application/json" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
<script>
"use strict";


/* ==== 10_engine.js ================================================== */
/* ============================================================================
 * MODULE: ENGINE
 * Core namespace, math, deterministic RNG, storage, timing, global state.
 * Nothing here knows about rendering, AI or content. Safe to read in isolation.
 * ========================================================================== */
const RR = (window.RR = {
  VERSION: "2.2.0",
  SCHEMA: 1,          // .raymod schema version understood by this build
  BUILD: "Hostile Sector: V01D",
  TITLE: "Hostile Sector: V01D",
});

/* --- ENGINE.math ---------------------------------------------------------- */
const M = (RR.M = {
  TAU: Math.PI * 2,
  clamp(v, a, b) { return v < a ? a : v > b ? b : v; },
  lerp(a, b, t) { return a + (b - a) * t; },
  sign(v) { return v < 0 ? -1 : v > 0 ? 1 : 0; },
  dist2(ax, ay, bx, by) { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; },
  angDiff(a, b) { let d = (b - a) % M.TAU; if (d > Math.PI) d -= M.TAU; if (d < -Math.PI) d += M.TAU; return d; },
  norm(a) { a %= M.TAU; return a < 0 ? a + M.TAU : a; },
});

/* Small xorshift RNG so map/particle behaviour can be reproduced in tests. */
RR.RNG = function (seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  const f = function () {
    s ^= s << 13; s >>>= 0; s ^= s >> 17; s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
  f.int = (n) => Math.floor(f() * n);
  f.range = (a, b) => a + f() * (b - a);
  f.pick = (arr) => arr[Math.floor(f() * arr.length)];
  return f;
};
const rnd = Math.random;

/* --- ENGINE.storage -------------------------------------------------------
 * localStorage may be unavailable (private mode, sandboxed frame, file://
 * restrictions). We degrade to an in-memory map instead of throwing so the
 * game always boots. `RR.Store.persistent` tells the UI which mode we're in.
 * ------------------------------------------------------------------------- */
RR.Store = (function () {
  const mem = Object.create(null);
  let ok = false;
  try {
    const k = "__rr_probe__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    ok = true;
  } catch (e) { ok = false; }
  const P = "hsv01d:";
  const OLD_P = "retroray:";
  /* One-time migration off the old key prefix so the rename does not throw
     away anybody's settings, drafts, saves or horde best. Runs once; the
     originals are left alone in case an older build is still in use. */
  (function migrate() {
    if (!ok) return;
    try {
      if (window.localStorage.getItem(P + "__migrated__")) return;
      const moved = [];
      for (let i = 0; i < window.localStorage.length; i++) {
        const k = window.localStorage.key(i);
        if (k && k.indexOf(OLD_P) === 0) moved.push(k);
      }
      for (const k of moved) {
        const nk = P + k.slice(OLD_P.length);
        if (window.localStorage.getItem(nk) == null)
          window.localStorage.setItem(nk, window.localStorage.getItem(k));
      }
      window.localStorage.setItem(P + "__migrated__", "1");
    } catch (e) {}
  })();
  return {
    get persistent() { return ok; },
    get(key, dflt) {
      try {
        const raw = ok ? window.localStorage.getItem(P + key) : mem[key];
        if (raw == null) return dflt;
        return JSON.parse(raw);
      } catch (e) { return dflt; }
    },
    set(key, val) {
      const raw = JSON.stringify(val);
      try { if (ok) window.localStorage.setItem(P + key, raw); else mem[key] = raw; }
      catch (e) { mem[key] = raw; }
      return true;
    },
    del(key) {
      try { if (ok) window.localStorage.removeItem(P + key); } catch (e) {}
      delete mem[key];
    },
    keys() {
      const out = [];
      try {
        if (ok) { for (let i = 0; i < window.localStorage.length; i++) {
          const k = window.localStorage.key(i);
          if (k && k.indexOf(P) === 0) out.push(k.slice(P.length));
        } } else out.push(...Object.keys(mem));
      } catch (e) {}
      return out;
    },
  };
})();

/* --- ENGINE.events (single bus; listeners registered once at boot) -------- */
RR.bus = (function () {
  const map = Object.create(null);
  return {
    on(ev, fn) { (map[ev] || (map[ev] = [])).push(fn); },
    emit(ev, a, b) { const l = map[ev]; if (!l) return; for (let i = 0; i < l.length; i++) l[i](a, b); },
  };
})();

/* --- ENGINE.loop ---------------------------------------------------------- */
RR.Loop = (function () {
  let last = 0, acc = 0, raf = 0, hidden = false;
  const FIXED = 1 / 60, MAXSTEP = 0.25;
  let fpsAcc = 0, fpsCount = 0, fps = 60;
  function frame(t) {
    raf = requestAnimationFrame(frame);
    if (hidden) { last = t; return; }
    if (!last) last = t;
    let dt = (t - last) / 1000; last = t;
    if (dt > MAXSTEP) dt = MAXSTEP;
    fpsAcc += dt; fpsCount++;
    if (fpsAcc >= 0.5) { fps = fpsCount / fpsAcc; fpsAcc = 0; fpsCount = 0; RR.bus.emit("fps", fps); }
    RR.fps = fps;
    acc += dt;
    let guard = 0;
    while (acc >= FIXED && guard++ < 6) { RR.bus.emit("tick", FIXED); acc -= FIXED; }
    RR.bus.emit("draw", dt);
  }
  document.addEventListener("visibilitychange", function () {
    hidden = document.hidden;
    if (hidden) { RR.bus.emit("blur"); } else { last = 0; }
  });
  return {
    start() { if (!raf) raf = requestAnimationFrame(frame); },
    stop() { if (raf) cancelAnimationFrame(raf); raf = 0; },
    get fps() { return fps; },
  };
})();

/* --- ENGINE.util ---------------------------------------------------------- */
RR.U = {
  el(id) { return document.getElementById(id); },
  esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  },
  toast(msg, ms) {
    const t = RR.U.el("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(RR.U._tt);
    RR.U._tt = setTimeout(() => t.classList.remove("show"), ms || 1900);
  },
  fmtTime(sec) {
    sec = Math.max(0, Math.floor(sec));
    return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");
  },
  isTouch() {
    return ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0;
  },
  /* ------------------------------------------------------- device class ---
   * "Does this thing have a touchscreen" is the WRONG question for deciding
   * whether to put a gamepad on screen: every modern laptop answers yes, and
   * a touchscreen laptop is still a mouse-and-keyboard machine. What actually
   * matters is whether touch is the PRIMARY way this device is pointed at.
   *
   * So: trust an explicit mobile signal first, then the user agent, then the
   * pointer media queries — a device whose primary pointer is coarse and
   * which cannot hover is a handheld, whatever its touch-point count says.
   * Cached, because it cannot change without a reload.
   * ---------------------------------------------------------------------- */
  device() {
    if (RR.U._dev) return RR.U._dev;
    const nav = (typeof navigator !== "undefined" && navigator) || {};
    const ua = String(nav.userAgent || "");
    const uaData = nav.userAgentData;
    const maxTouch = nav.maxTouchPoints || 0;
    const hasTouch = ("ontouchstart" in window) || maxTouch > 0;
    const mm = (q) => { try { return !!(window.matchMedia && window.matchMedia(q).matches); } catch (e) { return false; } };
    const coarse = mm("(pointer: coarse)"), fine = mm("(pointer: fine)"), noHover = mm("(hover: none)");
    /* any-pointer / any-hover describe EVERY input the device has, not just the
       primary one. That is what separates a touchscreen laptop (which also has
       a trackpad, so any-pointer:fine is true) from a phone (which does not).
       It is the only reliable way to tell those two apart from inside a page. */
    const anyFine = mm("(any-pointer: fine)"), anyHover = mm("(any-hover: hover)");
    let shortEdge = 0;
    try { shortEdge = Math.min(screen.width || 0, screen.height || 0) || 0; } catch (e) { shortEdge = 0; }
    /* iPadOS 13+ deliberately reports a Macintosh UA; the touch count gives it away */
    const iPadAsMac = /Macintosh/i.test(ua) && maxTouch > 1;
    const phoneUA = /Android.*Mobile|iPhone|iPod|Windows Phone|IEMobile|BlackBerry|BB10|Opera Mini/i.test(ua);
    const tabletUA = iPadAsMac || /iPad|Tablet|PlayBook|Silk/i.test(ua) || (/Android/i.test(ua) && !/Mobile/i.test(ua));
    let kind, why;
    if (tabletUA) { kind = "tablet"; why = "tablet user agent"; }
    else if (phoneUA) { kind = "phone"; why = "mobile user agent"; }
    else if (uaData && uaData.mobile === true) { kind = "phone"; why = "userAgentData.mobile"; }
    /* A mouse or trackpad anywhere on the device means it is a computer, even
       if it also has a touchscreen. Checked before the coarse-pointer test so
       a touchscreen laptop is never mistaken for a tablet. */
    else if (anyFine || anyHover) {
      kind = "desktop";
      why = hasTouch ? "touchscreen, but it also has a mouse" : "mouse and keyboard";
    }
    else if (hasTouch && coarse && noHover) {
      kind = shortEdge >= 600 ? "tablet" : "phone"; why = "touch is the only pointer";
    } else {
      kind = "desktop"; why = "mouse and keyboard";
    }
    RR.U._dev = { kind, why, touch: hasTouch, coarse, fine, anyFine, anyHover, noHover,
                  maxTouch, shortEdge, handheld: kind !== "desktop" };
    return RR.U._dev;
  },
  /* the question the pad actually wants answered */
  isHandheld() { return RR.U.device().handheld; },
  download(name, text, mime) {
    const blob = new Blob([text], { type: mime || "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
  },
  async copy(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) {}
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand("copy"); ta.remove(); return ok;
    } catch (e) { return false; }
  },
  /* FNV-1a — used for mod hashes in online version checks. Not cryptographic. */
  hash(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
    return ("00000000" + h.toString(16)).slice(-8);
  },
};

/* ============================================================================
 * MODULE: ASSETS  (procedural textures, normal maps, sprites, viewmodels)
 * Everything is generated at boot from theme data. No files, no network.
 *
 * Textures are built as a 12-tile atlas per theme, plus a matching NORMAL
 * atlas derived from the albedo's luminance gradient. Both renderers read the
 * same atlases; the WebGL path uploads them as textures, the software path
 * samples them directly.
 * ========================================================================== */
RR.Assets = (function () {
  const TS = 64;                 // texture tile size
  const TILES = 12;              // tiles per theme atlas
  const AW = TS * TILES;
  const SPR_W = 48, SPR_H = 64, SPR_FRAMES = 5, SPR_DIRS = 8;

  const LE = (function () {
    const b = new ArrayBuffer(4), u32 = new Uint32Array(b), u8 = new Uint8Array(b);
    u32[0] = 0x11223344; return u8[0] === 0x44;
  })();
  const SR = LE ? 0 : 24, SG = LE ? 8 : 16, SB = LE ? 16 : 8, SA = LE ? 24 : 0;
  const pack = (r, g, b, a) => (((a & 255) << SA) | ((b & 255) << SB) | ((g & 255) << SG) | ((r & 255) << SR)) >>> 0;

  const SHADE_LEVELS = 32;
  const SHADE = new Uint8Array(SHADE_LEVELS * 256);
  for (let l = 0; l < SHADE_LEVELS; l++) {
    const m = l / (SHADE_LEVELS - 1);
    for (let v = 0; v < 256; v++) SHADE[l * 256 + v] = (v * m) | 0;
  }

  function hash2(x, y, s) {
    let n = ((x * 73856093) ^ (y * 19349663) ^ (s * 83492791)) >>> 0;
    n = (n ^ (n >>> 13)) >>> 0; n = (n * 1274126177) >>> 0;
    return (n >>> 8) / 16777216;
  }
  /* Accepts "#rrggbb", "#rgb" or "rgb(r,g,b)". mix() and shift() feed their
     output back into hex() (the shading helpers re-parse their base colour),
     so both must return something hex() can read — they return "#rrggbb". */
  function hex(c) {
    const str = c == null ? "#808080" : String(c);
    if (str.charCodeAt(0) === 35) {
      if (str.length === 4) {
        const v3 = parseInt(str.slice(1), 16);
        const r = (v3 >> 8) & 15, g2 = (v3 >> 4) & 15, b2 = v3 & 15;
        return [r * 17, g2 * 17, b2 * 17];
      }
      const v = parseInt(str.slice(1), 16);
      return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
    }
    const m2 = /rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/.exec(str);
    if (m2) return [+m2[1] | 0, +m2[2] | 0, +m2[3] | 0];
    return [128, 128, 128];
  }
  function h2(n) { const v = M.clamp(Math.round(n), 0, 255).toString(16); return v.length < 2 ? "0" + v : v; }
  function rgbHex(r, g, b) { return "#" + h2(r) + h2(g) + h2(b); }
  function mix(a, b, t) {
    const A = hex(a), B = hex(b);
    return rgbHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
  }
  function shift(c, d) {
    const A = hex(c);
    return rgbHex(A[0] + d, A[1] + d, A[2] + d);
  }
  function cv(w, h) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.imageSmoothingEnabled = false;
    return { c, x };
  }
  function grain(ctx, w, h, amt, seed, lift) {
    const up = lift == null ? 1 : lift;
    for (let y = 0; y < h; y++) for (let px = 0; px < w; px++) {
      const n = hash2(px, y, seed);
      if (n > 0.78 && up > 0) { ctx.fillStyle = "rgba(255,255,255," + ((n - 0.78) * amt * up).toFixed(3) + ")"; ctx.fillRect(px, y, 1, 1); }
      else if (n < 0.28) { ctx.fillStyle = "rgba(0,0,0," + ((0.28 - n) * amt).toFixed(3) + ")"; ctx.fillRect(px, y, 1, 1); }
    }
  }
  /* soft multi-octave stain used for grime in corners */
  function grime(ctx, w, h, seed, amt) {
    for (let y = 0; y < h; y += 2) for (let x = 0; x < w; x += 2) {
      let v = 0, f = 1, a = 1, tot = 0;
      for (let o = 0; o < 3; o++) { v += hash2((x * f / 12) | 0, (y * f / 12) | 0, seed + o) * a; tot += a; f *= 2.3; a *= 0.5; }
      v /= tot;
      const edge = Math.min(1, Math.min(x, y, w - x, h - y) / 14);
      const k = (1 - edge) * 0.55 + v * 0.45;
      if (k > 0.45) { ctx.fillStyle = "rgba(0,0,0," + ((k - 0.45) * amt).toFixed(3) + ")"; ctx.fillRect(x, y, 2, 2); }
    }
  }

  /* ---------------------------------------------------------------- WALLS */
  const wallPainters = {
    panel(g, t, base, seed) {
      g.fillStyle = base; g.fillRect(0, 0, TS, TS);
      for (let i = 0; i < 4; i++) {
        g.fillStyle = shift(base, i % 2 ? -12 : 8);
        g.fillRect(2, i * 16 + 2, TS - 4, 12);
        g.fillStyle = "rgba(255,255,255,.10)"; g.fillRect(2, i * 16 + 2, TS - 4, 1);
        g.fillStyle = "rgba(0,0,0,.40)"; g.fillRect(2, i * 16 + 13, TS - 4, 3);
      }
      g.fillStyle = shift(base, 30);
      for (let i = 0; i < 4; i++) { g.fillRect(5, i * 16 + 5, 2, 2); g.fillRect(TS - 7, i * 16 + 5, 2, 2); }
      g.fillStyle = t.accent; g.globalAlpha = 0.32; g.fillRect(0, 30, TS, 2); g.globalAlpha = 1;
      g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(0, 0, 1, TS); g.fillRect(0, 0, TS, 1);
    },
    brick(g, t, base, seed) {
      g.fillStyle = shift(base, -38); g.fillRect(0, 0, TS, TS);
      const bh = 10, bw = 21;
      for (let r = 0; r < 7; r++) {
        const off = (r % 2) * (bw >> 1);
        for (let c = -1; c < 4; c++) {
          const x = c * (bw + 2) + off, y = r * (bh - 1);
          g.fillStyle = shift(base, ((hash2(c, r, seed) * 34) | 0) - 14);
          g.fillRect(x, y, bw, bh - 2);
          g.fillStyle = "rgba(255,255,255,.10)"; g.fillRect(x, y, bw, 1);
          g.fillStyle = "rgba(0,0,0,.38)"; g.fillRect(x, y + bh - 3, bw, 1);
          g.fillStyle = "rgba(0,0,0,.30)"; g.fillRect(x + bw - 1, y, 1, bh - 2);
        }
      }
    },
    tile(g, t, base, seed) {
      g.fillStyle = base; g.fillRect(0, 0, TS, TS);
      for (let ty = 0; ty < 4; ty++) for (let tx = 0; tx < 4; tx++) {
        g.fillStyle = shift(base, ((hash2(tx, ty, seed) * 24) | 0) - 11);
        g.fillRect(tx * 16 + 1, ty * 16 + 1, 14, 14);
        g.fillStyle = "rgba(255,255,255,.09)"; g.fillRect(tx * 16 + 1, ty * 16 + 1, 14, 1);
        g.fillStyle = "rgba(0,0,0,.28)"; g.fillRect(tx * 16 + 1, ty * 16 + 14, 14, 1);
      }
      g.fillStyle = t.accent; g.globalAlpha = 0.20; g.fillRect(0, 46, TS, 3); g.globalAlpha = 1;
    },
    bars(g, t, base, seed) {
      g.fillStyle = shift(base, -32); g.fillRect(0, 0, TS, TS);
      g.fillStyle = "rgba(0,0,0,.58)"; g.fillRect(0, 0, TS, TS);
      for (let i = 0; i < 8; i++) {
        const x = i * 8 + 2;
        g.fillStyle = shift(base, 24); g.fillRect(x, 0, 4, TS);
        g.fillStyle = "rgba(255,255,255,.16)"; g.fillRect(x, 0, 1, TS);
        g.fillStyle = "rgba(0,0,0,.4)"; g.fillRect(x + 3, 0, 1, TS);
      }
      g.fillStyle = shift(base, 12); g.fillRect(0, 4, TS, 5); g.fillRect(0, TS - 12, TS, 5);
      g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(0, 9, TS, 2);
    },
    tech(g, t, base, seed) {
      g.fillStyle = shift(base, -20); g.fillRect(0, 0, TS, TS);
      for (let i = 0; i < 12; i++) {
        const x = ((hash2(i, 3, seed) * TS) | 0), y = ((hash2(i, 9, seed) * TS) | 0);
        const w = 6 + ((hash2(i, 1, seed) * 18) | 0), h = 4 + ((hash2(i, 7, seed) * 10) | 0);
        g.fillStyle = shift(base, i % 2 ? 18 : -12); g.fillRect(x, y, w, h);
        g.fillStyle = "rgba(255,255,255,.10)"; g.fillRect(x, y, w, 1);
        g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(x, y + h - 1, w, 1);
      }
      g.fillStyle = t.accent; g.globalAlpha = 0.55;
      g.fillRect(0, 18, TS, 1); g.fillRect(0, 44, TS, 1); g.fillRect(30, 0, 1, TS);
      g.globalAlpha = 1;
      for (let i = 0; i < 5; i++) { g.fillStyle = t.accent; g.fillRect(4 + i * 12, 20, 3, 3); }
    },
  };
  const floorPainters = {
    grate(g, c, seed) {
      g.fillStyle = c; g.fillRect(0, 0, TS, TS);
      g.fillStyle = "rgba(0,0,0,.55)";
      for (let i = 0; i < 8; i++) g.fillRect(i * 8 + 5, 0, 3, TS);
      g.fillStyle = "rgba(255,255,255,.035)";
      for (let i = 0; i < 4; i++) g.fillRect(0, i * 16, TS, 1);
    },
    concrete(g, c, seed) {
      g.fillStyle = c; g.fillRect(0, 0, TS, TS);
      grain(g, TS, TS, 0.5, seed, 0.35);
      g.fillStyle = "rgba(0,0,0,.22)";
      g.fillRect(0, 0, TS, 1); g.fillRect(0, 32, TS, 1); g.fillRect(0, 0, 1, TS); g.fillRect(32, 0, 1, TS);
    },
    carpet(g, c, seed) {
      g.fillStyle = c; g.fillRect(0, 0, TS, TS); grain(g, TS, TS, 0.4, seed + 3, 0.5);
      g.fillStyle = "rgba(0,0,0,.16)";
      for (let i = 0; i < 16; i++) g.fillRect(0, i * 4, TS, 1);
    },
    tile(g, c, seed) {
      g.fillStyle = c; g.fillRect(0, 0, TS, TS);
      g.fillStyle = "rgba(0,0,0,.38)"; g.fillRect(0, 0, TS, 2); g.fillRect(0, 32, TS, 2);
      g.fillRect(0, 0, 2, TS); g.fillRect(32, 0, 2, TS);
      g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(3, 3, 28, 28); g.fillRect(35, 35, 28, 28);
    },
    plate(g, c, seed) {
      g.fillStyle = c; g.fillRect(0, 0, TS, TS);
      g.fillStyle = "rgba(255,255,255,.08)";
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) if ((x + y) % 2) g.fillRect(x * 8, y * 8, 8, 8);
      g.fillStyle = "rgba(0,0,0,.32)"; g.fillRect(0, 0, TS, 1); g.fillRect(0, 0, 1, TS);
    },
  };

  function buildAtlas(theme, seed) {
    const { c, x: g } = cv(AW, TS);
    const paintWall = wallPainters[theme.wallStyle] || wallPainters.panel;
    const paintFloor = floorPainters[theme.floorStyle] || floorPainters.concrete;
    const put = (idx, fn) => { g.save(); g.translate(idx * TS, 0); g.beginPath(); g.rect(0, 0, TS, TS); g.clip(); fn(g); g.restore(); };

    put(0, (q) => { paintWall(q, theme, theme.wallA, seed); grain(q, TS, TS, 0.32, seed, 0.5); grime(q, TS, TS, seed, 0.7); });
    put(1, (q) => { paintWall(q, theme, theme.wallB, seed + 11); grain(q, TS, TS, 0.32, seed + 4, 0.5); grime(q, TS, TS, seed + 1, 0.6); });
    put(2, (q) => {
      paintWall(q, theme, mix(theme.wallA, theme.accent, 0.35), seed + 21);
      q.fillStyle = theme.accent; q.globalAlpha = 0.5; q.fillRect(0, 26, TS, 3); q.fillRect(0, 36, TS, 3); q.globalAlpha = 1;
      grime(q, TS, TS, seed + 2, 0.5);
    });
    put(3, (q) => {  /* door */
      q.fillStyle = theme.door; q.fillRect(0, 0, TS, TS);
      q.fillStyle = shift(theme.door, -34); q.fillRect(0, 0, 5, TS); q.fillRect(TS - 5, 0, 5, TS);
      q.fillStyle = shift(theme.door, 26); q.fillRect(5, 0, 2, TS);
      q.fillStyle = theme.accent; q.fillRect(8, 26, 16, 5); q.fillRect(40, 26, 16, 5);
      q.fillStyle = "rgba(0,0,0,.34)"; for (let i = 0; i < 6; i++) q.fillRect(0, 6 + i * 11, TS, 2);
      q.fillStyle = shift(theme.door, 44); q.fillRect(0, 0, TS, 2);
      q.fillStyle = "rgba(0,0,0,.5)"; q.fillRect(0, TS - 3, TS, 3);
      grain(q, TS, TS, 0.22, seed + 7, 0.6);
    });
    put(4, (q) => {  /* crate */
      const b = mix(theme.wallA, "#8a6a3a", 0.6);
      q.fillStyle = b; q.fillRect(0, 0, TS, TS);
      q.fillStyle = shift(b, -42);
      q.fillRect(0, 0, TS, 4); q.fillRect(0, TS - 4, TS, 4); q.fillRect(0, 0, 4, TS); q.fillRect(TS - 4, 0, 4, TS);
      q.strokeStyle = shift(b, -26); q.lineWidth = 4;
      q.beginPath(); q.moveTo(4, 4); q.lineTo(TS - 4, TS - 4); q.moveTo(TS - 4, 4); q.lineTo(4, TS - 4); q.stroke();
      q.fillStyle = "rgba(255,255,255,.12)"; q.fillRect(0, 0, TS, 2);
      q.fillStyle = theme.accent; q.globalAlpha = .35; q.fillRect(20, 26, 24, 10); q.globalAlpha = 1;
      grain(q, TS, TS, 0.45, seed + 2, 0.6);
    });
    put(5, (q) => {  /* barrel */
      const b = mix(theme.wallB, theme.accent, 0.34);
      q.fillStyle = shift(b, -48); q.fillRect(0, 0, TS, TS);
      for (const cx of [16, 48]) {
        q.fillStyle = b; q.fillRect(cx - 14, 0, 28, TS);
        q.fillStyle = shift(b, 30); q.fillRect(cx - 14, 0, 5, TS);
        q.fillStyle = shift(b, -36); q.fillRect(cx + 8, 0, 6, TS);
        q.fillStyle = shift(b, -58); q.fillRect(cx - 14, 12, 28, 5); q.fillRect(cx - 14, 44, 28, 5);
        q.fillStyle = theme.accent; q.globalAlpha = .55; q.fillRect(cx - 7, 26, 14, 9); q.globalAlpha = 1;
      }
      grain(q, TS, TS, 0.4, seed + 5, 0.6);
    });
    put(6, (q) => paintFloor(q, theme.floor, seed + 13));
    put(7, (q) => {  /* ceiling */
      q.fillStyle = theme.ceil; q.fillRect(0, 0, TS, TS);
      q.fillStyle = "rgba(0,0,0,.32)";
      for (let i = 0; i < 4; i++) q.fillRect(0, i * 16, TS, 3);
      q.fillStyle = shift(theme.ceil, 10); q.fillRect(0, 30, TS, 2);
      grain(q, TS, TS, 0.28, seed + 17, 0.0);
    });
    put(8, (q) => {  /* railing — mostly open metal */
      q.fillStyle = shift(theme.wallB, -20); q.fillRect(0, 0, TS, TS);
      q.fillStyle = mix(theme.wallA, "#9aa6b4", 0.5);
      q.fillRect(0, 2, TS, 9); q.fillRect(0, TS - 12, TS, 8);
      for (let i = 0; i < 5; i++) q.fillRect(6 + i * 13, 0, 6, TS);
      q.fillStyle = "rgba(255,255,255,.20)";
      q.fillRect(0, 2, TS, 2);
      for (let i = 0; i < 5; i++) q.fillRect(6 + i * 13, 0, 2, TS);
      q.fillStyle = theme.accent; q.globalAlpha = .4; q.fillRect(0, 11, TS, 2); q.globalAlpha = 1;
      grain(q, TS, TS, 0.4, seed + 23, 0.7);
    });
    put(9, (q) => {  /* window frame + glass */
      q.fillStyle = shift(theme.wallA, -12); q.fillRect(0, 0, TS, TS);
      q.fillStyle = mix(theme.accent, "#cfe8ff", 0.6);
      q.globalAlpha = 0.30; q.fillRect(6, 6, TS - 12, TS - 12); q.globalAlpha = 1;
      q.fillStyle = shift(theme.door, -10);
      q.fillRect(0, 0, TS, 7); q.fillRect(0, TS - 7, TS, 7); q.fillRect(0, 0, 7, TS); q.fillRect(TS - 7, 0, 7, TS);
      q.fillRect(30, 0, 5, TS);
      q.fillStyle = "rgba(255,255,255,.30)";
      q.beginPath(); q.moveTo(10, TS - 10); q.lineTo(28, 10); q.lineTo(34, 10); q.lineTo(16, TS - 10); q.closePath(); q.fill();
      q.fillStyle = "rgba(255,255,255,.16)"; q.fillRect(0, 0, TS, 2);
      grain(q, TS, TS, 0.25, seed + 29, 0.8);
    });
    put(10, (q) => { /* overhead beam / pipework */
      const b = mix(theme.wallB, "#6e7684", 0.45);
      q.fillStyle = shift(b, -30); q.fillRect(0, 0, TS, TS);
      for (let i = 0; i < 3; i++) {
        const y = 8 + i * 20;
        q.fillStyle = b; q.fillRect(0, y, TS, 13);
        q.fillStyle = "rgba(255,255,255,.16)"; q.fillRect(0, y, TS, 3);
        q.fillStyle = "rgba(0,0,0,.42)"; q.fillRect(0, y + 10, TS, 3);
        q.fillStyle = shift(b, -20); q.fillRect(22, y - 2, 7, 17); q.fillRect(48, y - 2, 7, 17);
      }
      q.fillStyle = theme.accent; q.globalAlpha = .35; q.fillRect(0, 30, TS, 2); q.globalAlpha = 1;
      grain(q, TS, TS, 0.35, seed + 31, 0.6);
    });
    put(11, (q) => { /* counter + soffit */
      const b = mix(theme.wallA, theme.door, 0.5);
      q.fillStyle = b; q.fillRect(0, 0, TS, TS);
      q.fillStyle = shift(b, 26); q.fillRect(0, 0, TS, 6);
      q.fillStyle = shift(b, -34); q.fillRect(0, 6, TS, 3);
      for (let i = 0; i < 3; i++) { q.fillStyle = shift(b, -16); q.fillRect(4 + i * 20, 14, 16, 40); q.fillStyle = shift(b, 14); q.fillRect(4 + i * 20, 14, 16, 2); }
      q.fillStyle = theme.accent; q.globalAlpha = .3; q.fillRect(0, 58, TS, 3); q.globalAlpha = 1;
      grain(q, TS, TS, 0.3, seed + 37, 0.6);
      grime(q, TS, TS, seed + 5, 0.6);
    });

    const data = g.getImageData(0, 0, AW, TS).data;
    return new Uint32Array(data.buffer.slice(0));
  }

  /* Normal map derived from albedo luminance. Sobel on each tile separately so
     gradients never bleed across tile seams. Packed as (nx,ny,nz) in 0..255. */
  function buildNormals(albedo) {
    const out = new Uint32Array(albedo.length);
    const lum = new Float32Array(albedo.length);
    for (let i = 0; i < albedo.length; i++) {
      const c = albedo[i];
      lum[i] = (((c >>> SR) & 255) * 0.299 + ((c >>> SG) & 255) * 0.587 + ((c >>> SB) & 255) * 0.114) / 255;
    }
    const L = (tile, x, y) => {
      const cx = M.clamp(x, 0, TS - 1), cy = M.clamp(y, 0, TS - 1);
      return lum[cy * AW + tile * TS + cx];
    };
    const STR = 2.4;
    for (let t = 0; t < TILES; t++) {
      for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
        const gx = (L(t, x + 1, y - 1) + 2 * L(t, x + 1, y) + L(t, x + 1, y + 1)) -
                   (L(t, x - 1, y - 1) + 2 * L(t, x - 1, y) + L(t, x - 1, y + 1));
        const gy = (L(t, x - 1, y + 1) + 2 * L(t, x, y + 1) + L(t, x + 1, y + 1)) -
                   (L(t, x - 1, y - 1) + 2 * L(t, x, y - 1) + L(t, x + 1, y - 1));
        let nx = -gx * STR, ny = -gy * STR, nz = 1;
        const inv = 1 / Math.hypot(nx, ny, nz);
        nx *= inv; ny *= inv; nz *= inv;
        out[y * AW + t * TS + x] = pack(((nx * 0.5 + 0.5) * 255) | 0, ((ny * 0.5 + 0.5) * 255) | 0, ((nz * 0.5 + 0.5) * 255) | 0, 255);
      }
    }
    return out;
  }

  /* --------------------------------------------------------------- SPRITES
   * 8 facing directions x 5 frames. Directions 0..4 are drawn (front, front
   * three-quarter, side, back three-quarter, back); 5..7 are mirrored.
   * dir 0 = facing the camera. Columns are frames, rows are directions.
   *
   * Art notes: silhouettes read first, so every figure gets a lit side, a
   * shadowed side and a dark outline. Undead get torn clothing with skin and
   * ribs showing through, blood runs, reaching arms and lit eyes. Humans get
   * a helmet, a plate carrier with straps and a visible weapon.
   * ------------------------------------------------------------------ */
  function lit(c, k) { return shift(c, k); }
  function outline(g, x, y, w, h) {
    g.fillStyle = "rgba(0,0,0,.55)";
    g.fillRect(x - 1, y, 1, h); g.fillRect(x + w, y, 1, h);
    g.fillRect(x, y - 1, w, 1); g.fillRect(x, y + h, w, 1);
  }

  /* --- shading toolkit ---------------------------------------------------
   * Flat rectangles read as cardboard. These three helpers are what turn a
   * box into something that looks like it has volume, at a resolution where
   * you only have a handful of pixels to say it with.
   * --------------------------------------------------------------------- */

  /* A vertical column lit from `lightX` (0..1 across the shape): each pixel
     column gets its own shade from a cosine falloff, so limbs and torsos read
     as cylinders instead of slabs. `wrap` adds a rim highlight on the far
     edge, which is what sells the roundness. */
  function cylinder(g, x, y, w, h, base, lightX, amp, rim) {
    if (w <= 0 || h <= 0) return;
    const lx = lightX == null ? 0.30 : lightX;
    const a = amp == null ? 30 : amp;
    const C = hex(base);
    for (let i = 0; i < w; i++) {
      const u = (i + 0.5) / w;
      /* cos-shaped falloff around the light, squared so the terminator is
         tight rather than a wash */
      let k = Math.cos((u - lx) * Math.PI * 0.92);
      k = k > 0 ? k * k : 0;
      let d = Math.round((k - 0.42) * a * 2);
      if (rim && u > 0.86) d = Math.round(a * 0.55);            /* rim light */
      g.fillStyle = "rgb(" + M.clamp(C[0] + d, 0, 255) + "," +
        M.clamp(C[1] + d, 0, 255) + "," + M.clamp(C[2] + d, 0, 255) + ")";
      g.fillRect(x + i, y, 1, h);
    }
  }
  /* Top-lit vertical falloff — for shoulders, helmet crowns and boot tops. */
  function vgrad(g, x, y, w, h, base, topD, botD) {
    if (w <= 0 || h <= 0) return;
    const C = hex(base);
    for (let j = 0; j < h; j++) {
      const t = h === 1 ? 0 : j / (h - 1);
      const d = Math.round(topD + (botD - topD) * t);
      g.fillStyle = "rgb(" + M.clamp(C[0] + d, 0, 255) + "," +
        M.clamp(C[1] + d, 0, 255) + "," + M.clamp(C[2] + d, 0, 255) + ")";
      g.fillRect(x, y + j, w, 1);
    }
  }
  /* 2x2 ordered dither — breaks the hard step between two shades the way a
     period-correct artist would, with no extra colours. */
  function dither(g, x, y, w, h, col, density) {
    g.fillStyle = col;
    const d = density == null ? 0.5 : density;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const on = d >= 0.75 ? ((i + j) & 1) === 0 || ((i & 1) === 0 && (j & 1) === 0)
        : d >= 0.5 ? ((i + j) & 1) === 0
        : ((i & 1) === 0 && (j & 1) === 0);
      if (on) g.fillRect(x + i, y + j, 1, 1);
    }
  }
  /* Ambient occlusion under an overhang (chin, chest rig, hem). */
  function ao(g, x, y, w, h, strength) {
    g.fillStyle = "rgba(0,0,0," + (strength == null ? 0.28 : strength) + ")";
    g.fillRect(x, y, w, h);
  }

  function drawCorpse(g, pal, undead) {
    const y = SPR_H - 4;
    g.fillStyle = "rgba(70,4,10,.5)";
    g.beginPath(); g.ellipse(24, y + 1, 21, 6, 0, 0, M.TAU); g.fill();
    g.fillStyle = pal.b; g.fillRect(7, y - 11, 32, 10);
    g.fillStyle = pal.a; g.fillRect(11, y - 15, 24, 7);
    g.fillStyle = shift(pal.a, 16); g.fillRect(11, y - 15, 24, 2);
    g.fillStyle = pal.skin; g.fillRect(34, y - 19, 10, 9);
    g.fillStyle = shift(pal.skin, -30); g.fillRect(34, y - 12, 10, 2);
    if (undead) { g.fillStyle = "#c9d84a"; g.fillRect(37, y - 16, 3, 2); }
    g.fillStyle = pal.b; g.fillRect(4, y - 8, 8, 5);
    g.fillStyle = "#6d0f12"; g.fillRect(6, y - 3, 34, 3);
    g.fillStyle = "#8e1a1c"; g.fillRect(14, y - 6, 14, 3);
  }

  /* --- armed human ------------------------------------------------------
   * Everything is lit from the upper-left: cylindrical shading across each
   * limb, a top-down falloff on the shoulders and helmet, contact occlusion
   * under the chin and the chest rig, and a walk cycle where the arms swing
   * opposite the legs. That combination is what reads as a person rather
   * than a stack of boxes.
   * --------------------------------------------------------------------- */
  function drawHuman(g, pal, frame, hscale, dir) {
    const cx = SPR_W / 2, base = SPR_H - 2, H = hscale || 1;
    const back = dir >= 3, side = dir === 2, q34 = dir === 1 || dir === 3;
    const face = side ? (dir === 2 ? 1 : -1) : 0;
    const off = side ? 0 : q34 ? (dir === 1 ? 3 : -3) : 0;
    const swing = frame === 1 ? 3.4 : frame === 2 ? -3.4 : 0;
    const bodyW = side ? 15 : q34 ? 19 : 23;
    const bob = frame === 1 || frame === 2 ? 1 : 0;
    const hipY = Math.round(base - 20 * H) + bob;
    const chestY = Math.round(base - 44 * H) + bob;
    const headY = chestY - Math.round(11 * H);
    const LIT = 0.28;                          /* light comes from the left */
    const cloth = pal.b, kit = pal.a, skin = pal.skin;

    /* ground shadow, softer at the edges */
    g.fillStyle = "rgba(0,0,0,.20)";
    g.beginPath(); g.ellipse(cx + off, base - 1, bodyW * 0.66, 5, 0, 0, M.TAU); g.fill();
    g.fillStyle = "rgba(0,0,0,.34)";
    g.beginPath(); g.ellipse(cx + off, base - 1, bodyW * 0.46, 3, 0, 0, M.TAU); g.fill();

    /* --- legs: trousers, knee pad, boot with a sole --- */
    for (const sgn of [-1, 1]) {
      const lead = sgn > 0 ? 1 : -1;
      const sw = swing * lead * (side ? 1.6 : 1);
      const lx = Math.round(cx + off + (side ? sgn * 2 : sgn * 6) - 4 + sw * 0.35);
      const legH = base - hipY - 5;
      cylinder(g, lx, hipY, 8, legH, cloth, LIT, 26, !side);
      /* thigh is a touch brighter than the shin */
      ao(g, lx, hipY + Math.round(legH * 0.55), 8, 1, 0.22);
      /* knee pad */
      g.fillStyle = shift(cloth, -26);
      g.fillRect(lx + 1, hipY + Math.round(legH * 0.52), 6, 4);
      g.fillStyle = shift(cloth, 10);
      g.fillRect(lx + 1, hipY + Math.round(legH * 0.52), 6, 1);
      /* boot */
      const bx = lx - 1 + Math.round(sw * 0.5);
      vgrad(g, bx, base - 6, 10, 4, "#23252c", 16, -6);
      g.fillStyle = "#101116"; g.fillRect(bx, base - 2, 10, 2);
      g.fillStyle = "#3a3d47"; g.fillRect(bx, base - 6, 10, 1);
      dither(g, bx + 1, base - 4, 8, 2, "rgba(0,0,0,.35)", 0.5);
    }

    /* --- torso: shirt under a plate carrier --- */
    const torsoH = hipY - chestY + 4;
    const tx = Math.round(cx - bodyW / 2 + off);
    cylinder(g, tx, chestY, bodyW, torsoH, kit, LIT, 30, !side);
    vgrad(g, tx, chestY, bodyW, 3, kit, 22, 0);          /* shoulder top-light */
    outline(g, tx, chestY, bodyW, torsoH);
    if (!back) {
      /* plate carrier sits proud of the shirt and casts a shadow on it */
      const pw = bodyW - 6, px2 = tx + 3, py2 = chestY + 4, ph = torsoH - 13;
      /* the carrier has to stay lighter than the shadow side of the shirt or
         it reads as a hole punched through the chest */
      const carrier = mix(kit, cloth, 0.55);
      cylinder(g, px2, py2, pw, ph, carrier, LIT, 18, false);
      ao(g, px2, py2 + ph, pw, 2, 0.30);
      g.fillStyle = shift(carrier, 24); g.fillRect(px2, py2, pw, 1);
      /* mag pouches */
      g.fillStyle = shift(carrier, -26);
      for (let i = 0; i < 2; i++) g.fillRect(px2 + 1 + i * (pw - 6), py2 + ph - 8, 5, 7);
      g.fillStyle = shift(carrier, 16);
      for (let i = 0; i < 2; i++) g.fillRect(px2 + 1 + i * (pw - 6), py2 + ph - 8, 5, 1);
      /* unit flash + straps */
      g.fillStyle = pal.trim; g.fillRect(px2 + 1, py2 + 3, pw - 2, 2);
      g.fillStyle = shift(carrier, -34);
      g.fillRect(cx - 2 + off, py2 + 1, 4, ph - 2);
      dither(g, px2, py2 + 2, pw, ph - 4, "rgba(0,0,0,.16)", 0.25);
      /* collar + neck shadow */
      g.fillStyle = shift(kit, -22); g.fillRect(cx - 5 + off, chestY, 10, 3);
      ao(g, cx - 4 + off, chestY, 8, 2, 0.35);
      /* belt */
      g.fillStyle = "#191b21"; g.fillRect(tx + 1, hipY - 3, bodyW - 2, 3);
      g.fillStyle = shift(pal.trim, -40); g.fillRect(cx - 2 + off, hipY - 3, 4, 3);
    } else {
      cylinder(g, tx + 3, chestY + 5, bodyW - 6, torsoH - 11, shift(kit, -16), LIT, 20, false);
      g.fillStyle = pal.trim; g.fillRect(tx + 3, chestY + 5, bodyW - 6, 2);
      g.fillStyle = shift(cloth, -14); g.fillRect(cx - 5 + off, chestY + 9, 10, 12);
      dither(g, tx + 3, chestY + 7, bodyW - 6, torsoH - 14, "rgba(0,0,0,.22)", 0.25);
      g.fillStyle = "#191b21"; g.fillRect(tx + 1, hipY - 3, bodyW - 2, 3);
    }

    /* --- arms: swing opposite the legs --- */
    const armY = chestY + 6;
    for (const sgn of [-1, 1]) {
      const asw = -swing * sgn * 0.55;
      const ax = Math.round(cx + off + sgn * (bodyW / 2 + 1) - (sgn < 0 ? 5 : 0));
      cylinder(g, ax, armY + asw, 6, 11, shift(kit, -8), sgn < 0 ? 0.25 : 0.35, 26, false);
      /* sleeve cuff, then forearm */
      g.fillStyle = shift(kit, -28); g.fillRect(ax, armY + 10 + asw, 6, 2);
      cylinder(g, ax, armY + 12 + asw, 6, 6, shift(kit, -4), sgn < 0 ? 0.25 : 0.35, 22, false);
      /* shoulder cap catches the top light */
      vgrad(g, ax, armY + asw, 6, 3, shift(kit, 4), 20, 0);
    }

    /* --- weapon, held in both hands --- */
    if (!back || side) {
      const gx = side ? cx + face * 13 : cx + off + (q34 ? (dir === 1 ? 7 : -7) : 0);
      const gy = armY + 9;
      if (side) {
        vgrad(g, cx + (face > 0 ? 2 : -24), gy - 2, 22, 6, pal.gun, 20, -14);
        vgrad(g, cx + (face > 0 ? 1 : -8), gy - 5, 7, 9, pal.gun, 14, -18);
        g.fillStyle = "#0a0b0e"; g.fillRect(cx + (face > 0 ? 22 : -24), gy - 1, 2, 3);
      } else {
        const gun = shift(pal.gun, 18);
        outline(g, gx - 5, gy - 5, 10, 10);
        vgrad(g, gx - 5, gy - 4, 10, 8, gun, 26, -18);
        vgrad(g, gx - 2, gy - 11, 5, 8, gun, 14, -16);
        g.fillStyle = "#07080b"; g.fillRect(gx - 2, gy - 13, 5, 3);
        g.fillStyle = shift(gun, 44); g.fillRect(gx - 5, gy - 4, 1, 8);
        g.fillStyle = shift(gun, 30); g.fillRect(gx - 2, gy - 11, 1, 8);
      }
      /* gloved hands */
      const hcol = "#3c4149";
      vgrad(g, gx - 9, gy - 3, 6, 7, hcol, 22, -14);
      vgrad(g, gx + 4, gy - 3, 6, 7, hcol, 22, -14);
      g.fillStyle = shift(skin, -10);
      g.fillRect(gx - 9, gy - 3, 6, 1); g.fillRect(gx + 4, gy - 3, 6, 1);
      g.fillStyle = "rgba(0,0,0,.45)";
      g.fillRect(gx - 9, gy + 3, 6, 1); g.fillRect(gx + 4, gy + 3, 6, 1);
    }
    if (frame === 3 && !back) {
      const fx = side ? cx + face * 26 : cx + off;
      const fy = side ? armY + 7 : armY - 3;
      g.fillStyle = "rgba(255,248,214,.95)";
      g.beginPath(); g.arc(fx, fy, 8, 0, M.TAU); g.fill();
      g.fillStyle = "#ffc44f";
      g.beginPath(); g.arc(fx, fy, 4.5, 0, M.TAU); g.fill();
      g.fillStyle = "#fff6dc";
      g.beginPath(); g.arc(fx, fy, 2, 0, M.TAU); g.fill();
    }

    /* --- head: helmet, brow shadow, nose, jaw --- */
    const hw = side ? 12 : 15, hh = 14;
    const hx = Math.round(cx - hw / 2 + off), hy = headY;
    cylinder(g, hx, hy + 3, hw, hh - 3, skin, LIT, 26, !side);
    outline(g, hx, hy, hw, hh);
    /* helmet: domed, with a brim that shadows the eyes */
    vgrad(g, hx - 1, hy - 1, hw + 2, 6, shift(kit, 6), 30, -10);
    g.fillStyle = shift(kit, 40); g.fillRect(hx + 1, hy - 1, 3, 1);   /* crown spec */
    g.fillStyle = shift(kit, -34); g.fillRect(hx - 1, hy + 4, hw + 2, 2);
    ao(g, hx, hy + 6, hw, 2, 0.34);
    g.fillStyle = shift(kit, 24); g.fillRect(hx, hy - 1, hw - 3, 1);
    if (!back) {
      const eyeC = pal.eye || "#cfe6ff";
      /* eye sockets under the brim */
      g.fillStyle = "#191b20";
      if (side) g.fillRect(hx + (face > 0 ? hw - 6 : 1), hy + 8, 5, 3);
      else { g.fillRect(hx + 2, hy + 8, 4, 3); g.fillRect(hx + hw - 6, hy + 8, 4, 3); }
      g.fillStyle = eyeC;
      if (side) g.fillRect(hx + (face > 0 ? hw - 5 : 2), hy + 9, 2, 1);
      else { g.fillRect(hx + 3, hy + 9, 2, 1); g.fillRect(hx + hw - 5, hy + 9, 2, 1); }
      /* nose: a lit ridge with a shadow on its right */
      const nx = side ? hx + (face > 0 ? hw - 4 : 2) : cx + off - 1;
      g.fillStyle = shift(skin, 26); g.fillRect(nx, hy + 8, 1, 3);
      g.fillStyle = shift(skin, -34); g.fillRect(nx + 1, hy + 8, 1, 4);
      /* mouth + jaw shading */
      g.fillStyle = shift(skin, -40);
      g.fillRect(hx + 4, hy + hh - 3, hw - 8, 1);
      dither(g, hx + 1, hy + hh - 4, hw - 2, 3, "rgba(0,0,0,.30)", 0.25);
      /* cheek highlight on the lit side */
      g.fillStyle = shift(skin, 18); g.fillRect(hx + 1, hy + 8, 1, 4);
      /* chin shadow onto the collar */
      ao(g, hx + 2, hy + hh, hw - 4, 1, 0.40);
    } else {
      cylinder(g, hx, hy + 3, hw, hh - 3, shift(skin, -34), LIT, 18, false);
      g.fillStyle = shift(cloth, -14); g.fillRect(hx + 2, hy + 6, hw - 4, 4);
      dither(g, hx + 1, hy + 7, hw - 2, 5, "rgba(0,0,0,.25)", 0.25);
    }
  }

  /* --- undead ------------------------------------------------------------
   * Same lighting model as the living, but the silhouette is deliberately
   * wrong: hunched, asymmetric, arms out in front, one leg dragging. That
   * asymmetry is what makes a zombie readable at twenty metres.
   * --------------------------------------------------------------------- */
  function drawUndead(g, pal, frame, hscale, dir) {
    const cx = SPR_W / 2, base = SPR_H - 2, H = hscale || 1;
    const back = dir >= 3, side = dir === 2, q34 = dir === 1 || dir === 3;
    const face = side ? 1 : 0;
    const off = (side ? 0 : q34 ? (dir === 1 ? 3 : -3) : 0) + 2;   // permanent lurch
    const attacking = frame === 3;
    const swing = frame === 1 ? 3.6 : frame === 2 ? -3.6 : 0;
    const bodyW = side ? 14 : q34 ? 18 : 21;
    const bob = attacking ? -2 : (frame === 1 || frame === 2 ? 1 : 0);
    const hipY = Math.round(base - 19 * H) + bob;
    const chestY = Math.round(base - 42 * H) + bob;
    const headY = chestY - Math.round(10 * H);
    const gore = pal.gore || "#7d1216";
    const LIT = 0.26;
    const rot = shift(pal.skin, -18);          /* discoloured flesh */

    g.fillStyle = "rgba(0,0,0,.18)";
    g.beginPath(); g.ellipse(cx + off, base - 1, bodyW * 0.68, 5, 0, 0, M.TAU); g.fill();
    g.fillStyle = "rgba(0,0,0,.32)";
    g.beginPath(); g.ellipse(cx + off, base - 1, bodyW * 0.46, 3, 0, 0, M.TAU); g.fill();

    /* --- legs: torn trousers, one shin bare and bloodied, one foot dragging */
    for (const sgn of [-1, 1]) {
      const drag = sgn < 0 ? 0.4 : 1;          /* the left leg lags */
      const sw = swing * sgn * (side ? 1.5 : 1) * drag;
      const lx = Math.round(cx + off + (side ? sgn * 2 : sgn * 6) - 4 + sw * 0.3);
      const legH = base - hipY - 4;
      cylinder(g, lx, hipY, 8, legH, pal.b, LIT, 24, !side);
      if (sgn < 0) {
        /* trouser torn away below the knee */
        const kneeY = hipY + Math.round(legH * 0.45);
        cylinder(g, lx, kneeY, 8, base - kneeY - 4, rot, LIT, 26, !side);
        g.fillStyle = shift(pal.b, -26);
        for (let i = 0; i < 3; i++) g.fillRect(lx + i * 3, kneeY - 1 + (i & 1), 3, 2);
        g.fillStyle = gore; g.fillRect(lx + 2, kneeY + 3, 3, 6);
        g.fillStyle = shift(gore, 22); g.fillRect(lx + 2, kneeY + 3, 1, 3);
        dither(g, lx, kneeY + 2, 8, base - kneeY - 8, "rgba(60,30,20,.30)", 0.25);
      }
      const bx = lx - 1 + Math.round(sw * 0.5);
      vgrad(g, bx, base - 5, 10, 3, "#1b1c22", 14, -6);
      g.fillStyle = "#0d0e12"; g.fillRect(bx, base - 2, 10, 2);
    }

    /* --- torso: shirt torn open over ribs --- */
    const torsoH = hipY - chestY + 4;
    const tx = Math.round(cx - bodyW / 2 + off);
    cylinder(g, tx, chestY, bodyW, torsoH, pal.a, LIT, 28, !side);
    vgrad(g, tx, chestY, bodyW, 3, pal.a, 18, 0);
    outline(g, tx, chestY, bodyW, torsoH);
    if (!back) {
      /* exposed chest */
      const ew = 11, ex = cx - 5 + off;
      cylinder(g, ex, chestY + 5, ew, torsoH - 11, rot, LIT, 26, false);
      ao(g, ex, chestY + 5, ew, 2, 0.32);
      /* ribs: alternating light and shadow so they read as bone under skin */
      for (let i = 0; i < 4; i++) {
        const ry = chestY + 9 + i * 4;
        g.fillStyle = "rgba(22,16,14,.55)"; g.fillRect(ex + 1, ry, ew - 2, 1);
        g.fillStyle = shift(rot, 16); g.fillRect(ex + 1, ry + 1, ew - 2, 1);
      }
      /* an open wound and blood running down */
      g.fillStyle = "#2a0508"; g.fillRect(ex + 3, chestY + 8, 5, 5);
      g.fillStyle = gore; g.fillRect(ex + 4, chestY + 9, 3, 3);
      g.fillStyle = gore; g.fillRect(cx - 1 + off, chestY + 12, 2, torsoH - 17);
      g.fillStyle = shift(gore, 24); g.fillRect(cx - 1 + off, chestY + 12, 1, 5);
      dither(g, ex, chestY + 14, ew, torsoH - 19, gore, 0.25);
      /* ragged shirt edges, and a hem that hangs unevenly */
      g.fillStyle = shift(pal.a, -26);
      for (let i = 0; i < 5; i++) g.fillRect(tx + 1 + i * 4, hipY - 2 + (i & 1) * 3, 3, 3);
      g.fillStyle = shift(pal.a, 14);
      g.fillRect(ex - 2, chestY + 4, 2, torsoH - 9);
      g.fillStyle = "rgba(0,0,0,.35)";
      g.fillRect(ex + ew, chestY + 4, 2, torsoH - 9);
    } else {
      cylinder(g, tx + 3, chestY + 5, bodyW - 6, torsoH - 10, shift(pal.a, -16), LIT, 20, false);
      g.fillStyle = "#2a0508"; g.fillRect(cx - 3 + off, chestY + 8, 6, 13);
      g.fillStyle = gore; g.fillRect(cx - 2 + off, chestY + 9, 4, 11);
      cylinder(g, cx + bodyW / 2 - 7 + off, chestY + 6, 4, 9, rot, LIT, 18, false);
      dither(g, tx + 3, chestY + 7, bodyW - 6, torsoH - 14, "rgba(0,0,0,.24)", 0.25);
    }

    /* --- arms: reaching, uneven, bloodied hands --- */
    const reach = attacking ? 15 : 10;
    const armY = chestY + 5;
    for (const sgn of [-1, 1]) {
      const lag = sgn < 0 ? 1.4 : 1;
      const sw = swing * sgn * 0.6 * lag;
      const ax = Math.round(cx + off + sgn * (bodyW / 2 + 1) - (sgn < 0 ? 6 : 0));
      /* sleeve */
      cylinder(g, ax, armY + sw, 7, 12, pal.a, sgn < 0 ? 0.22 : 0.34, 24, false);
      g.fillStyle = shift(pal.a, -30);
      for (let i = 0; i < 3; i++) g.fillRect(ax + i * 3, armY + 11 + sw + (i & 1), 3, 2);
      /* bare forearm */
      const fx2 = ax + (sgn > 0 ? 1 : 0);
      cylinder(g, fx2, armY + 12 + sw, 6, reach, rot, sgn < 0 ? 0.22 : 0.34, 26, false);
      dither(g, fx2, armY + 14 + sw, 6, reach - 3, "rgba(60,30,24,.30)", 0.25);
      /* hand: knuckles then fingers */
      const hy2 = armY + 12 + reach + sw;
      cylinder(g, fx2 - 1, hy2, 8, 4, rot, 0.3, 22, false);
      g.fillStyle = shift(rot, -30);
      for (let f2 = 0; f2 < 3; f2++) g.fillRect(fx2 - 1 + f2 * 3, hy2 + 4, 2, 3);
      g.fillStyle = shift(rot, 12);
      for (let f2 = 0; f2 < 3; f2++) g.fillRect(fx2 - 1 + f2 * 3, hy2 + 4, 1, 1);
      g.fillStyle = gore; g.fillRect(fx2, hy2 + 2, 6, 2);
      g.fillStyle = shift(gore, -20); g.fillRect(fx2, hy2 + 6, 5, 1);
    }

    /* --- head: gaunt skull, sunken eyes, jaw hanging open --- */
    const hw = side ? 12 : 14, hh = 14;
    const hx = Math.round(cx - hw / 2 + off), hy = headY;
    cylinder(g, hx, hy, hw, hh, rot, LIT, 26, !side);
    /* cranium catches the top light, temples fall away */
    vgrad(g, hx + 1, hy, hw - 2, 4, shift(rot, 8), 22, -4);
    outline(g, hx, hy, hw, hh);
    /* matted hair */
    vgrad(g, hx + 1, hy, hw - 4, 3, "#3a2e22", 14, -14);
    g.fillStyle = "#2f261c"; g.fillRect(hx + hw - 5, hy + 1, 3, 2);
    dither(g, hx + 1, hy + 2, hw - 2, 2, "rgba(20,14,10,.55)", 0.5);
    if (!back) {
      const eye = pal.eye || "#ffdc4a";
      /* deep sockets: a dark well with a lit brow above it */
      g.fillStyle = shift(rot, 20);
      if (side) g.fillRect(hx + hw - 7, hy + 4, 6, 1);
      else { g.fillRect(hx + 1, hy + 4, 5, 1); g.fillRect(hx + hw - 6, hy + 4, 5, 1); }
      g.fillStyle = "#0a0906";
      if (side) g.fillRect(hx + hw - 6, hy + 5, 4, 4);
      else { g.fillRect(hx + 2, hy + 5, 4, 4); g.fillRect(hx + hw - 6, hy + 5, 4, 4); }
      g.fillStyle = eye;
      if (side) g.fillRect(hx + hw - 5, hy + 6, 2, 2);
      else { g.fillRect(hx + 3, hy + 6, 2, 2); g.fillRect(hx + hw - 5, hy + 6, 2, 2); }
      /* hollow cheeks */
      dither(g, hx + 1, hy + 9, hw - 2, 3, "rgba(0,0,0,.34)", 0.5);
      /* jaw hanging open, teeth top and bottom */
      const open = attacking ? 6 : 3;
      g.fillStyle = "#120d0b"; g.fillRect(hx + 3, hy + 10, hw - 6, open);
      g.fillStyle = "#cfc3a6"; g.fillRect(hx + 3, hy + 10, hw - 6, 1);
      g.fillStyle = "#b7ab8f"; g.fillRect(hx + 4, hy + 9 + open, hw - 8, 1);
      g.fillStyle = gore; g.fillRect(hx + 4, hy + 10 + open, hw - 8, 3);
      g.fillStyle = shift(gore, -22); g.fillRect(hx + 5, hy + 13 + open, hw - 10, 1);
      ao(g, hx + 2, hy + hh, hw - 4, 1, 0.42);
    } else {
      cylinder(g, hx, hy, hw, hh, shift(rot, -22), LIT, 16, false);
      g.fillStyle = "#241c15"; g.fillRect(hx + 1, hy, hw - 2, 6);
      g.fillStyle = "#2a0508"; g.fillRect(hx + 3, hy + 7, hw - 6, 4);
      g.fillStyle = gore; g.fillRect(hx + 4, hy + 8, hw - 8, 2);
    }
  }

  function drawActor(g, pal, frame, undead, hscale, dir) {
    if (frame === 4) return drawCorpse(g, pal, undead);
    if (undead) drawUndead(g, pal, frame, hscale, dir);
    else drawHuman(g, pal, frame, hscale, dir);
  }

  function buildSpriteSheet(def, dirs) {
    const D = dirs ? SPR_DIRS : 1;
    const { c, x: g } = cv(SPR_W * SPR_FRAMES, SPR_H * D);
    const undead = def.sprite === "undead";
    for (let d = 0; d < D; d++) {
      const mirror = d > 4;
      const src = mirror ? 8 - d : d;
      for (let f = 0; f < SPR_FRAMES; f++) {
        g.save();
        g.beginPath(); g.rect(f * SPR_W, d * SPR_H, SPR_W, SPR_H); g.clip();
        if (mirror) { g.translate((f + 1) * SPR_W, d * SPR_H); g.scale(-1, 1); }
        else g.translate(f * SPR_W, d * SPR_H);
        drawActor(g, def.pal, f, undead, def.height || 1, src);
        g.restore();
      }
    }
    const d = g.getImageData(0, 0, SPR_W * SPR_FRAMES, SPR_H * D).data;
    return { px: new Uint32Array(d.buffer.slice(0)), canvas: c, w: SPR_W * SPR_FRAMES, fw: SPR_W,
      h: SPR_H * D, fh: SPR_H, frames: SPR_FRAMES, dirs: D };
  }

  function buildPickupSheet() {
    const kinds = ["ammo", "smg", "shotgun", "armor", "rocket"];
    const out = {};
    for (const k of kinds) {
      const { c, x: g } = cv(SPR_W, SPR_H);
      const y0 = 30;
      g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.ellipse(24, SPR_H - 6, 14, 4, 0, 0, M.TAU); g.fill();
      if (k === "ammo") {
        g.fillStyle = "#4a5a3a"; g.fillRect(12, y0, 24, 20);
        g.fillStyle = "#5f7449"; g.fillRect(12, y0, 24, 5);
        g.fillStyle = "#2a3222"; g.fillRect(12, y0 + 18, 24, 2);
        g.fillStyle = "#d8c46a"; g.fillRect(17, y0 + 8, 14, 3);
        g.fillStyle = "#8fa04f"; g.fillRect(14, y0 + 2, 20, 2);
      } else if (k === "smg") {
        g.fillStyle = "#2b2f36"; g.fillRect(8, y0 + 6, 32, 6);
        g.fillRect(14, y0 + 12, 7, 12);
        g.fillStyle = "#3d434c"; g.fillRect(30, y0 + 3, 6, 4);
        g.fillStyle = "#d98b3a"; g.fillRect(9, y0 + 7, 4, 2);
      } else if (k === "shotgun") {
        g.fillStyle = "#3a2a1e"; g.fillRect(8, y0 + 8, 32, 5);
        g.fillStyle = "#2b2f36"; g.fillRect(8, y0 + 4, 26, 5);
        g.fillStyle = "#4b525c"; g.fillRect(30, y0 + 4, 10, 4);
        g.fillStyle = "#ff5a48"; g.fillRect(10, y0 + 9, 4, 2);
      } else if (k === "armor") {
        g.fillStyle = "#2f6a8c"; g.fillRect(14, y0 - 4, 20, 24);
        g.fillStyle = "#4a9cc4"; g.fillRect(14, y0 - 4, 20, 5);
        g.fillStyle = "#1d4a63"; g.fillRect(14, y0 + 15, 20, 5);
        g.beginPath(); g.moveTo(14, y0 + 16); g.lineTo(24, y0 + 24); g.lineTo(34, y0 + 16);
        g.closePath(); g.fillStyle = "#2f6a8c"; g.fill();
        g.fillStyle = "#7fd8ff"; g.fillRect(20, y0 + 2, 8, 3); g.fillRect(22, y0 - 1, 4, 9);
        g.fillStyle = "rgba(255,255,255,.30)"; g.fillRect(15, y0 - 3, 4, 20);
      } else {
        g.fillStyle = "#3d4739"; g.fillRect(8, y0 + 2, 34, 9);
        g.fillStyle = "#59654f"; g.fillRect(8, y0 + 2, 34, 3);
        g.fillStyle = "#22291f"; g.fillRect(8, y0 + 9, 34, 3);
        g.fillStyle = "#a83c22"; g.fillRect(34, y0 + 1, 8, 11);
        g.fillStyle = "#ffb04a"; g.fillRect(9, y0 + 4, 5, 4);
      }
      g.fillStyle = "rgba(255,255,255,.16)"; g.fillRect(10, y0 - 2, 28, 2);
      const d = g.getImageData(0, 0, SPR_W, SPR_H).data;
      out[k] = { px: new Uint32Array(d.buffer.slice(0)), canvas: c, w: SPR_W, fw: SPR_W,
        h: SPR_H, fh: SPR_H, frames: 1, dirs: 1, emissive: 0.45 };
    }
    out.checkpoint = buildCheckpointSheet();
    return out;
  }

  /* Checkpoint beacon: two frames, dormant (amber, dark) and claimed (green,
     lit). Tall and narrow so it reads as a marker from across a room and is
     never mistaken for something you can pick up. */
  function buildCheckpointSheet() {
    const { c, x: g } = cv(SPR_W * 2, SPR_H);
    for (let f = 0; f < 2; f++) {
      const ox = f * SPR_W, on = f === 1;
      const glow = on ? "#7dff9f" : "#ffc247";
      const dim = on ? "#1c4a30" : "#4d3616";
      g.save();
      g.beginPath(); g.rect(ox, 0, SPR_W, SPR_H); g.clip();
      g.fillStyle = "rgba(0,0,0,.34)";
      g.beginPath(); g.ellipse(ox + 24, SPR_H - 5, 13, 4, 0, 0, M.TAU); g.fill();
      /* base plate */
      vgrad(g, ox + 14, SPR_H - 12, 20, 7, on ? "#2b4c39" : "#3a3a42", 18, -14);
      g.fillStyle = "#14161b"; g.fillRect(ox + 14, SPR_H - 6, 20, 2);
      /* post: dark, so the lit parts are the only bright thing on the sprite */
      cylinder(g, ox + 21, 18, 6, SPR_H - 30, "#2b313b", 0.28, 22, true);
      outline(g, ox + 21, 18, 6, SPR_H - 30);
      /* lamp head */
      cylinder(g, ox + 15, 8, 18, 14, dim, 0.28, 26, false);
      outline(g, ox + 15, 8, 18, 14);
      g.fillStyle = glow; g.fillRect(ox + 17, 11, 14, 8);
      g.fillStyle = "#ffffff"; g.fillRect(ox + 18, 12, 5, 2);
      g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(ox + 15, 19, 18, 3);
      /* halo, brighter once claimed */
      g.globalAlpha = on ? 0.30 : 0.14;
      g.fillStyle = glow;
      g.beginPath(); g.arc(ox + 24, 15, on ? 16 : 12, 0, M.TAU); g.fill();
      g.globalAlpha = 1;
      /* chevrons up the post so it reads at a distance */
      for (let i = 0; i < 4; i++) {
        g.fillStyle = glow; g.fillRect(ox + 19, 28 + i * 8, 10, 3);
        g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(ox + 19, 31 + i * 8, 10, 1);
      }
      g.restore();
    }
    const d = g.getImageData(0, 0, SPR_W * 2, SPR_H).data;
    return { px: new Uint32Array(d.buffer.slice(0)), canvas: c, w: SPR_W * 2, fw: SPR_W,
      /* emissive is ADDED to the sprite's light, so anything much above ~0.3
         saturates the tint and the beacon washes out to white */
      h: SPR_H, fh: SPR_H, frames: 2, dirs: 1, emissive: 0.28 };
  }

  /* ------------------------------------------------------- WEAPON VIEWMODELS
   * Poses: 0 idle, 1 firing, 2 reloading, 3 sighted idle, 4 sighted firing. */

/* ============================================================================
 * MODULE: AUDIO
 * Procedural synthesis only — no samples, no files. Adds positional panning,
 * distance falloff, occlusion filtering when the source is out of sight, and

    musG = ctx.createGain(); musG.gain.value = RR.settings.musVol;
