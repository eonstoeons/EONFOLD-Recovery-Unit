        }
        /* and an id that does not exist must fail rather than quietly
           substituting the built-in campaign */
        assert(RR.Game.start({ mode: "campaign", campaignId: "no:such", levelIndex: 0 }) === null,
          "an unknown campaign silently started something else");
        return { ok: true, detail: "both option spellings load the mod's map and enemies; unknown ids fail loudly" };
      } finally { RR.Mods.removePack("starter-mod"); RR.Game.stop(); RR.mode = "menu"; }
    });

    /* ------------------------------------------------------- AI regressions */
    t("bots never park on a pickup they cannot use", () => {
      const S = RR.Game.start({ mode: "ffa", bots: 1, scoreLimit: 99 });
      const bot = S.actors.find((a) => a.isBot);
      assert(bot, "no bot");
      /* full on everything */
      for (const id in bot.weapons) { const w = bot.weapons[id]; w.reserve = w.def.reserveMax || w.def.mag * 6; }
      bot.armor = RR.Content.rules().armorMax || 100;
      const ammo = S.pickups.find((q) => !q.inert && q.kind === "ammo");
      assert(ammo, "no ammo pickup on this map");
      assert(RR.Combat.wantsPickup(bot, ammo) === false, "a full bot still wants an ammo box");
      const marker = { kind: "checkpoint", inert: true, x: 1, y: 1, taken: false };
      assert(RR.Combat.wantsPickup(bot, marker) === false, "a bot wants an inert world marker");
      /* an empty bot does want it */
      for (const id in bot.weapons) bot.weapons[id].reserve = 0;
      assert(RR.Combat.wantsPickup(bot, ammo) === true, "an empty bot does not want ammo");
      return { ok: true, detail: "inert markers and already-full pickups are ignored" };
    });

    t("a bot standing on its own goal picks a new one instead of freezing", () => {
      const S = RR.Game.start({ mode: "tdm", bots: 3, scoreLimit: 999, timeLimit: 9999, team: 0 });
      const bot = S.actors.find((a) => a.isBot);
      assert(bot, "no bot");
      /* recreate the exact state that used to lock a bot up: a fresh memory of
         a contact at the spot it is already standing on */
      bot.target = null;
      bot.seen = false;
      bot.seenAt = S.time;
      bot.lastSeenX = bot.x; bot.lastSeenY = bot.y;
      bot._goal = [bot.x, bot.y]; bot._goalT = 0;
      const sx = bot.x, sy = bot.y;
      let travelled = 0, px = bot.x, py = bot.y;
      for (let i = 0; i < 60 * 4; i++) {
        sim(S, 1 / 60);
        const d = Math.hypot(bot.x - px, bot.y - py);
        if (d < 3) travelled += d;
        px = bot.x; py = bot.y;
        if (bot.dead) break;
      }
      assert(travelled > 1.0, "the bot moved " + travelled.toFixed(2) + "m in four seconds — it is stuck");
      assert(bot.seenAt == null || bot._goal == null || M.dist2(bot._goal[0], bot._goal[1], sx, sy) > 1.0,
        "the bot is still targeting the spot it started on");
      return { ok: true, detail: "covered " + travelled.toFixed(1) + "m after arriving at a stale contact" };
    });

    t("a broken zombie reference still spawns a zombie, not a rifleman", () => {
      const pack = { schema: RR.SCHEMA, id: "badz", namespace: "badz", name: "Bad Z", version: "1.0.0",
        maps: { yard: { name: "Yard", theme: "core:detention", grid: [
          "##########", "#P...Z...#", "#..o..o..#", "#.a....g.#", "#...Z....#", "##########"] } },
        horde: { maps: ["yard"], unlock: [{ round: 1, mix: ["ghoul"] }] } };
      const V = RR.Mods.validatePack(pack, {});
      assert(V.pack, "pack rejected: " + V.errors.join("; "));
      RR.Mods.addPack(V.pack, true);
      try {
        /* the loader must at least SAY the reference is broken */
        const probs = RR.Content.problems();
        assert(probs.missing.some((m) => /ghoul/.test(m)), "the missing enemy was not reported");
        const S = RR.Game.start({ mode: "horde", mapId: "badz:yard" });
        assert(S, "horde map did not start");
        S.round = 1; S.roundState = "fight"; S.spawnQueue = 6; S.spawnTimer = 0;
        sim(S, 6);
        const spawned = S.actors.filter((a) => a.isEnemy);
        assert(spawned.length >= 3, "only " + spawned.length + " spawned");
        const humans = spawned.filter((a) => !(a.def.sprite === "undead" || a.melee));
        assert(!humans.length, humans.length + " armed humans spawned in a zombie round (" +
          humans.map((h) => h.defId).join(",") + ")");
        return { ok: true, detail: spawned.length + " spawns, all undead despite the broken reference" };
      } finally { RR.Mods.removePack("badz"); RR.Game.stop(); RR.mode = "menu"; }
    });

    /* -------------------------------------------------- editor game types */
    t("every mode screen offers an editor already set to that game type", () => {
      const cases = [["campaign", "campaign", "Campaign level"], ["horde", "horde", "Zombie Horde map"],
                     ["dm", "ffa", "Free For All arena"], ["dm", "tdm", "Team Deathmatch arena"]];
      const saved = RR.Editor.project;
      try {
        for (const [screen, mode, label] of cases) {
          RR.UI.show(screen, screen === "dm" ? mode : undefined);
          const html = RR.U.el("menu").innerHTML;
          assert(html.indexOf('data-act="editorFor"') >= 0, screen + " has no editor entry point");
          assert(html.indexOf('data-arg="' + mode + '"') >= 0,
            screen + " does not pass the game type (" + mode + ")");
          RR.Editor.openFor(mode);
          assert(RR.Editor.project.mode === mode,
            "openFor(" + mode + ") left the editor on " + RR.Editor.project.mode);
          const side = RR.U.el("edSide").innerHTML;
          assert(side.indexOf(label) >= 0, "the palette does not lead with " + label);
          RR.Editor.close();
        }
        return { ok: true, detail: "campaign, horde, ffa and tdm each open a palette for their own spawns" };
      } finally { RR.Editor.project = saved; RR.mode = "menu"; RR.UI.show("main"); }
    });

    t("the editor validates a map against the game type it is for", () => {
      const grid = (rows) => rows;
      const mk = (g) => ({ id: "probe", _full: "probe:probe", name: "Probe", theme: "core:security",
        objective: "", grid: g });
      /* a campaign level with no exit is broken as a campaign and fine as FFA */
      const noExit = mk(grid(["##########", "#P...m...#", "#..o..o..#", "#.m....m.#", "#..m..E..#", "##########"]));
      assert(!RR.World.validateMap(noExit, "campaign").ok, "a campaign level with no exit passed");
      assert(RR.World.validateMap(noExit, "ffa").ok, "a legal FFA arena was rejected: " +
        RR.World.validateMap(noExit, "ffa").errors.join("; "));
      /* TDM needs both team spawns */
      const oneTeam = mk(grid(["##########", "#1...1...#", "#..o..o..#", "#.a....g.#", "#........#", "##########"]));
      const tdmR = RR.World.validateMap(oneTeam, "tdm");
      assert(!tdmR.ok && /team B/i.test(tdmR.errors.join(" ")), "missing team B was not reported: " + tdmR.errors.join("; "));
      const bothTeams = mk(grid(["##########", "#1...2...#", "#..o..o..#", "#.a....g.#", "#1...2...#", "##########"]));
      assert(RR.World.validateMap(bothTeams, "tdm").ok, "a legal TDM arena was rejected");
      /* horde needs zombie spawns */
      const noZ = mk(grid(["##########", "#P.......#", "#..o..o..#", "#.a....g.#", "#........#", "##########"]));
      const hR = RR.World.validateMap(noZ, "horde");
      assert(!hR.ok && /zombie/i.test(hR.errors.join(" ")), "missing zombie spawns were not reported");
      const withZ = mk(grid(["##########", "#P...Z...#", "#..o..o..#", "#.a....g.#", "#...Z....#", "##########"]));
      assert(RR.World.validateMap(withZ, "horde").ok, "a legal horde map was rejected");
      /* and with no mode given, nothing new is enforced */
      assert(RR.World.validateMap(noExit).ok, "the mode-less check became stricter");
      return { ok: true, detail: "campaign needs an exit, TDM needs both teams, horde needs Z spawns" };
    });

    /* ------------------------------------------------------------- audio */
    t("every weapon report uses the layered gun synth", () => {
      const guns = [];
      for (const id in RR.Content.rules() ? {} : {}) { /* no-op, keeps shape */ }
      const names = ["shot_pistol", "shot_smg", "shot_shotgun", "shot_rocket",
                     "shot_enemy_light", "shot_enemy_mid", "shot_enemy_heavy", "explosion"];
      for (const n of names) {
        const rec = RR.Content.sound(n);
        assert(rec, n + " is not defined");
        assert(rec.type === "gun", n + ' is type "' + rec.type + '", expected "gun"');
        assert(rec.body && rec.body <= 130, n + " body is " + rec.body + "Hz — not a deep report");
        guns.push(n.replace("shot_", "") + " " + rec.body + "Hz");
      }
      /* every weapon that fires must point at one of them */
      for (const wid of ["pistol", "smg", "shotgun", "rocket"]) {
        const w = RR.Content.weapon(wid);
        assert(w && w.sound, wid + " has no sound");
        assert(RR.Content.sound(w.sound).type === "gun", wid + " does not use a gun report");
      }
      return { ok: true, detail: guns.join(" · ") };
    });

    /* ------------------------------------------------------------ online */
    t("online is switched off in the menus but fully intact in the code", () => {
      /* The ask was to take online OUT for now without losing the work. So:
         nothing reachable, nothing dialling out, and every piece still here
         behind one flag. */
      assert(RR.FEATURES && RR.FEATURES.online === false, "RR.FEATURES.online should ship false");
      assert(RR.feature("online") === false, "RR.feature('online') should be false");
      RR.UI.show("main");
      const main = RR.U.el("menu").innerHTML;
      assert(!/data-arg="online"/.test(main), "the Online entry is still on the main menu");
      /* asking for the screen directly must not strand the player on a blank one */
      RR.UI.show("online");
      const shown = RR.U.el("menu").innerHTML;
      assert(!/id="oLobbies"/.test(shown) && !/oNewLobby/.test(shown), "the online screen still rendered");
      assert(/data-arg="campaign"/.test(shown), "asking for the online screen did not fall back to the main menu");
      /* and nothing opened a socket */
      RR.Online.connect();
      assert(!RR.Online.connected, "connect() opened a session while online is switched off");
      /* the implementation is all still present and callable */
      for (const k of ["connect", "disconnect", "host", "join", "startMatch", "newLobby",
                       "encodeServer", "decodeServer", "parseInvite", "inviteCode", "acceptInvite"])
        assert(typeof RR.Online[k] === "function", "RR.Online." + k + " went missing");
      assert(RR.LocalNet && typeof RR.LocalNet.open === "function", "the built-in lobby server went missing");
      /* invite codes still round-trip, so the format cannot drift while it is off */
      const u = "ws://10.0.0.7:9000";
      assert(RR.Online.decodeServer(RR.Online.encodeServer(u)) === u, "invite encoding broke while online was off");
      RR.UI.show("main");
      return { ok: true, detail: "hidden from the menus, no sockets, RR.Online + RR.LocalNet intact behind RR.FEATURES.online" };
    });

    t("online works with no server and no second player", () => withOnline(() => {
      const savedUrl = RR.settings.serverUrl, savedName = RR.settings.playerName;
      RR.settings.serverUrl = ""; RR.settings.playerName = "";
      RR.Online.disconnect();
      /* Opening Online with nothing configured used to say "not configured"
         and stop. It now names you, connects to the built-in server and opens
         a lobby you can start on your own. */
      RR.UI.show("online");
      RR.LocalNet.flush(); RR.LocalNet.flush();
      assert((RR.settings.playerName || "").trim(), "online did not give the player a name");
      assert(RR.Online.isLocal, "should be on the built-in server with no URL set");
      assert(RR.Online.connected, "the built-in server did not connect");
      const lob = RR.Online.lobby;
      assert(lob, "entering Online did not open a lobby");
      assert(lob.code && lob.code.length === 6, "the lobby has no join code");
      assert((lob.players || []).length === 1, "expected a lobby of one, got " + (lob.players || []).length);
      assert(lob.owner === RR.Online.selfId, "the solo player is not the host of their own lobby");
      const html = RR.U.el("menu").innerHTML;
      assert(/oStart/.test(html), "no Start button in a solo lobby");
      assert(!/Pick a name/.test(html), "still gating on a name");
      RR.settings.serverUrl = savedUrl; RR.settings.playerName = savedName;
      RR.UI.show("main");
      return { ok: true, detail: "auto-named, auto-connected, lobby " + lob.code + " with 1 player and a live Start" };
    }));

    t("a one-player lobby starts a real match", () => withOnline(() => {
      const savedUrl = RR.settings.serverUrl, savedS = RR.Game.S;
      RR.settings.serverUrl = "";
      RR.Online.disconnect();
      RR.UI.show("online");
      RR.LocalNet.flush(); RR.LocalNet.flush();
      assert(RR.Online.lobby, "no lobby to start");
      assert((RR.Online.lobby.players || []).length === 1, "this test needs a solo lobby");
      RR.Online.startMatch();
      RR.LocalNet.flush(); RR.LocalNet.flush();
      const S = RR.Game.S;
      assert(S, "start with one player did not begin a match");
      assert(S.online, "the match is not flagged as an online match");
      assert(RR.mode === "play" && !RR.paused, "the match did not actually enter play");
      /* solo means bots, otherwise "start alone" is an empty map */
      const bots = S.actors.filter((a) => a.isBot).length;
      assert(bots > 0, "a solo online match has nobody to fight");
      const t0 = S.time;
      sim(S, 0.5);
      assert(S.time > t0, "the match is not running");
      RR.Game.stop(); RR.Game.S = savedS; RR.mode = "menu";
      RR.settings.serverUrl = savedUrl;
      RR.Online.disconnect();
      RR.UI.show("main");
      return { ok: true, detail: "1 player + " + bots + " bots, match live on " + S.mapId };
    }));

    t("setting a server URL switches straight back to real multiplayer", () => withOnline(() => {
      const savedUrl = RR.settings.serverUrl;
      RR.settings.serverUrl = "ws://example.invalid:8787";
      assert(!RR.Online.isLocal, "a configured URL should not use the built-in server");
      const st = RR.Online.status();
      assert(!/built-in/i.test(st.text), "still reporting the built-in lobby with a URL set: " + st.text);
      RR.settings.serverUrl = "";
      assert(RR.Online.isLocal, "clearing the URL should fall back to the built-in server");
      RR.settings.serverUrl = savedUrl;
      RR.Online.disconnect();
      return { ok: true, detail: "URL set → real socket · URL cleared → built-in lobby" };
    }));

    /* --------------------------------------------------------------- end */
    RR.settings.difficulty = savedDiff;
    RR.Game.stop();
    RR.mode = savedMode; RR.paused = savedPaused; RR.Game.S = savedS;
    RR.In.script(null);
    return results.slice();
  }

  function summary() {
    const r = results.length ? results : run();
    const pass = r.filter((x) => x.ok).length;
    return pass + "/" + r.length + " passed\n" +
      r.map((x) => (x.ok ? "PASS  " : "FAIL  ") + x.name + (x.detail ? "\n        " + x.detail : "")).join("\n");
  }
  return { run, summary, get results() { return results.slice(); } };
})();


/* ==== 99_boot.js ==================================================== */
/* ============================================================================
 * MODULE: BOOT
 * Wires the modules together exactly once and starts the frame loop.
 * ========================================================================== */
(function () {
  /* Portrait is a supported way to play, so this just resizes the renderer and
     re-lays the pad for the new shape. There is no orientation nag any more. */
  function fitViewport() {
    RR.R.resize();
    RR.In.refreshPadVisibility();
  }

  function boot() {
    RR.Mods.load();
    RR.VM.init();
    RR.Hud.init();
    RR.R.init();
    RR.In.init();
    RR.UI.bind();

    RR.U.el("hFps").style.display = RR.settings.showFps ? "" : "none";

    RR.bus.on("tick", (dt) => { if (RR.mode === "play") RR.Game.tick(dt); });
    RR.bus.on("draw", (dt) => {
      if (RR.mode === "play") { RR.Game.draw(dt); if (!RR.paused) RR.Hud.frame(RR.Game.S, dt); }
      const sb = RR.U.el("scorebd");
      if (RR.mode === "play" && !RR.paused && RR.Game.S && RR.In.keyDown("score")) {
        if (!sb.classList.contains("show")) { sb.innerHTML = RR.UI.scoreTable(RR.Game.S); sb.classList.add("show"); }
      } else if (sb.classList.contains("show")) sb.classList.remove("show");
    });
    RR.bus.on("fps", (f) => {
      if (!RR.settings.showFps) return;
      RR.U.el("hFps").textContent = Math.round(f) + " FPS · " + RR.R.name + " " + RR.R.W + "×" + RR.R.H;
    });
    RR.bus.on("content-changed", () => {
      /* a mod change can invalidate the menu that is on screen */
      if (RR.mode === "menu") RR.UI.show(RR.UI.current);
    });

    window.addEventListener("resize", () => { fitViewport(); RR.Hud.resize(); });
    window.addEventListener("orientationchange", () => setTimeout(fitViewport, 200));

    /* audio contexts need a user gesture on most browsers */
    const unlock = () => { RR.Audio.init(); RR.Audio.resume(); if (!RR.Audio.playing) RR.Audio.startMusic(RR.Content.music("menu")); };
    window.addEventListener("pointerdown", unlock, { once: true });
    window.addEventListener("keydown", unlock, { once: true });

    /* An invite link lands here: #j=<invite>. Configure the server, then go
       straight to Online — the name gate still runs first if we have no name.
       The hash is cleared so a refresh does not re-trigger it. */
    let invited = false;
    try {
      const h = String(window.location.hash || "");
      if (RR.feature("online") && /^#j=/i.test(h)) {
        invited = RR.Online.acceptInvite(h);
        if (window.history && window.history.replaceState)
          window.history.replaceState(null, "", window.location.href.split("#")[0]);
      }
    } catch (e) { invited = false; }
    if (!invited) RR.UI.show("main");
    fitViewport();
    RR.Loop.start();
    RR.booted = true;
    RR.bus.emit("booted");
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, { once: true });
  else boot();
})();

</script>
